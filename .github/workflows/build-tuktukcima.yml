name: Build TukTukcima Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'TukTukcima/**'
      - '.github/workflows/build-tuktukcima.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TukTukcima plugin
        run: ./gradlew :TukTukcima:make

      - name: Upload TukTukcima.cs3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: TukTukcima
          path: TukTukcima/build/TukTukcima.cs3

      - name: Copy artifact and sync TukTukcima manifest size
        run: |
          test -s TukTukcima/build/TukTukcima.cs3
          mkdir -p build
          cp -f TukTukcima/build/TukTukcima.cs3 build/TukTukcima.cs3
          python3 - <<'PY'
          import os, re
          path = "plugins.json"
          with open(path, "r", encoding="utf-8") as fh:
              text = fh.read()
          size = os.path.getsize("build/TukTukcima.cs3")
          found = [False]
          def update(match):
              block = match.group(0)
              if '"internalName": "TukTukcima"' not in block:
                  return block
              found[0] = True
              return re.sub(r'("fileSize"\s*:\s*)\d+', rf'\g<1>{size}', block, count=1)
          updated = re.sub(r'\{[^{}]*"internalName"\s*:\s*"TukTukcima"[^{}]*\}', update, text, flags=re.S)
          if not found[0]:
              raise SystemExit("TukTukcima manifest entry was not found")
          with open(path, "w", encoding="utf-8") as fh:
              fh.write(updated)
          PY

      - name: Commit and push built cs3 to build/
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f build/TukTukcima.cs3 plugins.json
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Build TukTukcima.cs3 [skip ci]"
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git rebase "refs/remotes/origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
