# Self-contained GitHub Actions workflow. Install at .github/workflows/kilo-agent.yml
# Required EXISTING secrets: OPENCODE_WEB_USERNAME, OPENCODE_WEB_PASSWORD, OPENCODE_STATE_KEY.
# No Kilo API key is required for the free route tested on 2026-10-23.
# Free does NOT mean unlimited. Provider quotas and availability can change.
# Use only for development of the checked-out repository, not a general-purpose server.
# Persists isolated agent HOME + working tree, not /usr, /opt, /tmp or old OpenCode state.
# Stop normally for final backup; forced cancellation may lose edits after the latest checkpoint.
# Review every agent change. Backup encryption is not a substitute for secret hygiene.
name: Kilo Free Agent — browser IDE + encrypted persistence
'on':
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Total session budget including startup, 15–300 minutes
        type: string
        required: true
        default: '240'
      backup_interval_minutes:
        description: Encrypted HOME + workspace backup, 5–60 minutes
        type: string
        required: true
        default: '15'
      auto_commit:
        description: Commit and push all non-ignored project edits (review security notes)
        type: boolean
        default: false
      commit_interval_seconds:
        description: Automatic Git save interval, 60–1800 seconds
        type: string
        default: '120'
      restore_state:
        description: Restore saved state only when its base commit matches checkout
        type: boolean
        default: true
      live_model_test:
        description: Require a real FREE model response and tool execution before publishing URL
        type: boolean
        default: true
      allow_tools:
        description: Auto-approve agent commands; agent has runner access. Disable for approval prompts
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: kilo-agent-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  KILO_VERSION: 7.8.17
  CODE_SERVER_VERSION: 4.141.0
  CODE_SERVER_SHA256: 65bcd20b524d03eb1b5adb7f360244599ef0e5b74089a46a982d32c074b97a29
  CLOUDFLARED_VERSION: 2026.10.3
  CLOUDFLARED_SHA256: 053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0
  HOME: /home/runner/kilo-home
  XDG_CONFIG_HOME: /home/runner/kilo-home/.config
  XDG_DATA_HOME: /home/runner/kilo-home/.local/share
  XDG_STATE_HOME: /home/runner/kilo-home/.local/state
  XDG_CACHE_HOME: /home/runner/kilo-home/.cache
  KILO_DISABLE_AUTOUPDATE: '1'
  DO_NOT_TRACK: '1'
jobs:
  kilo-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Validate existing secrets and input bounds
      env:
        OPENCODE_WEB_USERNAME: ${{ secrets.OPENCODE_WEB_USERNAME }}
        OPENCODE_WEB_PASSWORD: ${{ secrets.OPENCODE_WEB_PASSWORD }}
        STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
        DURATION: ${{ inputs.duration_minutes }}
        BACKUP_MINUTES: ${{ inputs.backup_interval_minutes }}
        COMMIT_SECONDS: ${{ inputs.commit_interval_seconds }}
        REF_TYPE: ${{ github.ref_type }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os, time
        for k in ('OPENCODE_WEB_USERNAME','OPENCODE_WEB_PASSWORD','STATE_KEY'):
            if not os.environ.get(k): raise SystemExit('Missing existing repository secret: '+k)
            if '\n' in os.environ[k] or '\r' in os.environ[k]: raise SystemExit('Secrets must be single-line: '+k)
        for k,lo,hi in [('DURATION',15,300),('BACKUP_MINUTES',5,60),('COMMIT_SECONDS',60,1800)]:
            s=os.environ[k]
            if not s.isascii() or not s.isdigit() or not lo<=int(s)<=hi: raise SystemExit('Invalid input: '+k)
        if os.environ['REF_TYPE']!='branch': raise SystemExit('Run this workflow on a branch, not a tag')
        with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('SESSION_DEADLINE='+str(int(time.time())+int(os.environ['DURATION'])*60)+'\n')
        PY
    - name: Create isolated persistent HOME
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin" "$HOME/.config" "$HOME/.cache"
    - name: Checkout selected branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned agent, IDE and tunnel
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq nginx apache2-utils rsync zstd gnupg sqlite3 curl ca-certificates
        sudo systemctl stop nginx || true
        RUNTIME="$RUNNER_TEMP/runtime"
        mkdir -p "$RUNTIME/bin" "$RUNNER_TEMP/downloads" "$HOME/.local/bin"
        npm install --global --prefix "$RUNTIME" "@kilocode/cli@$KILO_VERSION"
        cd "$RUNNER_TEMP/downloads"
        curl -fLsS --retry 3 "https://github.com/coder/code-server/releases/download/v$CODE_SERVER_VERSION/code-server-$CODE_SERVER_VERSION-linux-amd64.tar.gz" -o code-server.tgz
        echo "$CODE_SERVER_SHA256  code-server.tgz" | sha256sum --check --strict
        tar -xzf code-server.tgz -C "$RUNTIME"
        ln -sf "$RUNTIME/code-server-$CODE_SERVER_VERSION-linux-amd64/bin/code-server" "$RUNTIME/bin/code-server"
        curl -fLsS --retry 3 "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64" -o "$RUNTIME/bin/cloudflared"
        echo "$CLOUDFLARED_SHA256  $RUNTIME/bin/cloudflared" | sha256sum --check --strict
        chmod +x "$RUNTIME/bin/cloudflared"
        echo "$RUNTIME/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$RUNTIME/bin/kilo" --version
        "$RUNTIME/bin/code-server" --version
        "$RUNTIME/bin/cloudflared" --version
    - name: Install embedded state and verification scripts
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/kilo-scripts"
        cat > "$RUNNER_TEMP/kilo-scripts/state.py" <<'KILO_SCRIPT_STATE_PY'
        import hashlib, json, os, pathlib, shutil, sqlite3, subprocess, sys, tarfile, tempfile, time
        P=pathlib.Path
        HOME=P(os.environ['HOME']); WORK=P(os.environ['GITHUB_WORKSPACE'])
        TMP=P(os.environ['RUNNER_TEMP']); REPO=os.environ['GITHUB_REPOSITORY']
        BRANCH=os.environ['GITHUB_REF_NAME']; TAG='kilo-agent-state-'+hashlib.sha256(BRANCH.encode()).hexdigest()[:12]
        KEY=os.environ.get('STATE_KEY','')
        if not KEY: raise SystemExit('Missing existing secret OPENCODE_STATE_KEY')
        def run(args, **kw):
            return subprocess.run(args, check=True, **kw)
        def gh(*args):
            return run(['gh',*args],capture_output=True,text=True).stdout

        def release():
            p=subprocess.run(['gh','api',f'repos/{REPO}/releases/tags/{TAG}'],capture_output=True,text=True)
            if p.returncode:
                if '404' in p.stderr: return None
                raise RuntimeError('Cannot read state release: '+p.stderr)
            return json.loads(p.stdout)

        def download(name, folder):
            gh('release','download',TAG,'--repo',REPO,'--pattern',name,'--dir',str(folder),'--clobber')

        def manifests(info):
            return sorted([a['name'] for a in info['assets'] if re_manifest(a['name'])], reverse=True)

        def re_manifest(n):
            import re
            return bool(re.fullmatch(r'state-[0-9]+-[0-9]+-[0-9]+\.json',n))

        def gpg(src,dst,decrypt=False):
            # Passphrase travels over stdin, never command-line arguments or log output.
            a=['gpg','--batch','--yes','--pinentry-mode','loopback','--passphrase-fd','0',
               '--no-symkey-cache','--output',str(dst)]
            a+=['--decrypt',str(src)] if decrypt else ['--symmetric','--cipher-algo','AES256',str(src)]
            run(a,input=(KEY+'\n').encode(),stdout=subprocess.DEVNULL)

        def restore():
            info=release()
            if info is None: print('No previous Kilo state for this branch; starting clean.'); return
            mm=manifests(info)
            if not mm: print('No completed state generation; starting clean.'); return
            with tempfile.TemporaryDirectory(dir=TMP,prefix='kilo-restore-') as d:
                d=P(d); download(mm[0],d); m=json.loads((d/mm[0]).read_text())
                if m['branch']!=BRANCH or m['repository']!=REPO: raise RuntimeError('State repository/branch mismatch')
                head=run(['git','-C',str(WORK),'rev-parse','HEAD'],capture_output=True,text=True).stdout.strip()
                if m['head']!=head:
                    print('WARNING: Saved state was created from a different commit than the checked-out HEAD.')
                    print('Skipping restore and starting with a clean workspace; the old encrypted state release is preserved for manual recovery.')
                    print('To resume that saved workspace, rerun on the matching branch/commit or recover the saved changes manually.')
                    return
                joined=d/'payload.gpg'
                with joined.open('wb') as out:
                    for f in m['parts']:
                        n=f['name']
                        if P(n).name!=n or not n.startswith(mm[0][:-5]+'.part-'): raise RuntimeError('Unsafe part name')
                        download(n,d); p=d/n
                        if p.stat().st_size!=f['size'] or hashlib.file_digest(p.open('rb'),'sha256').hexdigest()!=f['sha256']:
                            raise RuntimeError('Backup part checksum mismatch')
                        with p.open('rb') as inp: shutil.copyfileobj(inp,out)
                        p.unlink()
                archive=d/'payload.tar.zst'; gpg(joined,archive,True)
                raw=d/'payload.tar'
                run(['zstd','-q','-d',str(archive),'-o',str(raw)])
                target=d/'extracted'; target.mkdir()
                with tarfile.open(raw) as tf:
                    # Reject traversal, devices and links that escape the archive.
                    for member in tf.getmembers():
                        p=pathlib.PurePosixPath(member.name)
                        if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] not in ('home','workspace'):
                            raise RuntimeError('Unsafe archive member')
                    tf.extractall(target,filter='data')
                for src,dst in [('home',HOME),('workspace',WORK)]:
                    if (target/src).is_dir():
                        args=['rsync','-a','--safe-links']
                        if src=='workspace': args+=['--delete','--exclude=.git']
                        run(args+[str(target/src)+'/',str(dst)+'/'])
                print('Restored completed encrypted Kilo state:',mm[0])

        def snapshot_sqlite(source, dest):
            for p in source.rglob('*'):
                if p.is_symlink() or not p.is_file(): continue
                rel=p.relative_to(source); q=dest/rel
                if not q.is_file() or q.is_symlink(): continue
                try:
                    with p.open('rb') as f: header=f.read(16)
                except (PermissionError,FileNotFoundError): continue
                if header!=b'SQLite format 3\x00': continue
                temporary=q.with_name(q.name+'.consistent-snapshot')
                try:
                    deadline=time.monotonic()+60
                    def progress(status,remaining,total):
                        if time.monotonic()>deadline: raise TimeoutError('SQLite snapshot timed out')
                    with sqlite3.connect(p.as_uri()+'?mode=ro',uri=True,timeout=20) as src:
                        with sqlite3.connect(temporary) as dst: src.backup(dst,pages=256,progress=progress)
                    os.replace(temporary,q)
                    for suffix in ('-wal','-shm','-journal'):
                        q.with_name(q.name+suffix).unlink(missing_ok=True)
                except FileNotFoundError:
                    temporary.unlink(missing_ok=True)

        def backup():
            info=release()
            if info is None:
                gh('release','create',TAG,'--repo',REPO,'--target',BRANCH,'--title','Kilo encrypted agent state (not a software release)',
                   '--notes','Encrypted per-branch state. Requires OPENCODE_STATE_KEY. Do not delete while a run is active.','--latest=false')
            with tempfile.TemporaryDirectory(dir=TMP,prefix='kilo-backup-') as d:
                d=P(d); stage=d/'stage'; stage.mkdir()
                exclusions=['.ssh','.gnupg','.aws','.azure','.kube','.docker/config.json','.git-credentials','.netrc','.npmrc','.pypirc',
                  '.config/gh','auth.json','service.json','*.sock','*.pid','*.log','*.db-wal','*.db-shm',
                  '.cache/pip','.cache/ms-playwright','.local/share/code-server/CachedData','.local/share/code-server/logs']
                for label,source in [('home',HOME),('workspace',WORK)]:
                    dest=stage/label; dest.mkdir()
                    args=['rsync','-a','--safe-links']
                    for e in exclusions+(['.git'] if label=='workspace' else []): args+=['--exclude',e]
                    args+=[str(source)+'/',str(dest)+'/']
                    p=subprocess.run(args)
                    if p.returncode not in (0,24): raise RuntimeError('Snapshot rsync failed')
                    snapshot_sqlite(source,dest)
                size=int(run(['du','-sb',str(stage)],capture_output=True,text=True).stdout.split()[0])
                if size>8*1024**3: raise RuntimeError('State exceeds the explicit 8 GiB safety cap; reduce caches before backup')
                plain=d/'state.tar.zst'
                run(['tar','--zstd','-cf',str(plain),'-C',str(stage),'home','workspace'])
                encrypted=d/'state.gpg'; gpg(plain,encrypted)
                prefix=f"state-{time.time_ns():019d}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
                run(['split','-b','1800M',str(encrypted),str(d/(prefix+'.part-'))])
                files=sorted(d.glob(prefix+'.part-*'))
                head=run(['git','-C',str(WORK),'rev-parse','HEAD'],capture_output=True,text=True).stdout.strip()
                m={'format':1,'repository':REPO,'branch':BRANCH,'head':head,'parts':[]}
                for p in files:
                    m['parts'].append({'name':p.name,'size':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()})
                    gh('release','upload',TAG,str(p),'--repo',REPO)
                manifest=d/(prefix+'.json'); manifest.write_text(json.dumps(m,indent=2))
                # This last upload publishes the generation only after every part succeeded.
                gh('release','upload',TAG,str(manifest),'--repo',REPO)
                print('Published authenticated-encrypted state:',manifest.name)
                # Keep two completed generations. Never remove the previous generation until publication succeeds.
                current=release(); old=manifests(current)[2:]
                for name in old:
                    prefix_old=name[:-5]
                    for asset in current['assets']:
                        n=asset['name']
                        if n==name or n.startswith(prefix_old+'.part-'):
                            try: gh('release','delete-asset',TAG,n,'--repo',REPO,'--yes')
                            except subprocess.CalledProcessError: print('Warning: old asset cleanup failed')
        if __name__=='__main__':
            import fcntl
            with (TMP/'kilo-state.lock').open('w') as lock:
                fcntl.flock(lock,fcntl.LOCK_EX)
                with (TMP/'kilo-git.lock').open('w') as git_lock:
                    fcntl.flock(git_lock,fcntl.LOCK_EX)
                    {'restore':restore,'backup':backup}[sys.argv[1]]()
        KILO_SCRIPT_STATE_PY
        cat > "$RUNNER_TEMP/kilo-scripts/smoke.py" <<'KILO_SCRIPT_SMOKE_PY'
        import json, os, pathlib, subprocess, tempfile
        with tempfile.TemporaryDirectory(prefix='kilo-probe-',dir=os.environ['RUNNER_TEMP']) as d:
            subprocess.run(['git','init','-q',d],check=True)
            prompt=('This is a harmless deployment self-test in a disposable Git repository. '
              'Use the write or apply_patch tool to create probe.txt containing AGENT_TOOL_OK. '
              'Then use bash to execute cat probe.txt and git status --short. '
              'Finish with exactly KILO_SMOKE_OK. Do not install software or modify anything outside this directory.')
            p=subprocess.run(['kilo','--pure','run','--auto','--format','json','--dir',d,
               '--model','kilo/kilo-auto/free',prompt],capture_output=True,text=True,timeout=240)
            events=[]
            for line in p.stdout.splitlines():
                try: events.append(json.loads(line))
                except json.JSONDecodeError: pass
            tools=[e['part'] for e in events if e.get('type')=='tool_use']
            done=[x for x in tools if x.get('state',{}).get('status')=='completed']
            ok=(p.returncode==0 and not any(e.get('type')=='error' for e in events)
                and pathlib.Path(d,'probe.txt').is_file()
                and pathlib.Path(d,'probe.txt').read_text().strip()=='AGENT_TOOL_OK'
                and any(t.get('tool') in ('write','apply_patch','edit') for t in done)
                and any(t.get('tool')=='bash' and t.get('state',{}).get('metadata',{}).get('exit')==0 for t in done)
                and any('KILO_SMOKE_OK' in e.get('part',{}).get('text','') for e in events))
            report={'passed':ok,'exit':p.returncode,'session_ids':sorted({e.get('sessionID') for e in events if e.get('sessionID')}),
               'tools':[t.get('tool') for t in done],
               'models':[e['part'].get('model') for e in events if e.get('type')=='step_finish'],
               'reported_cost':sum(e['part'].get('cost',0) for e in events if e.get('type')=='step_finish')}
            pathlib.Path(os.environ['RUNNER_TEMP'],'smoke-result.json').write_text(json.dumps(report,indent=2))
            print(json.dumps(report,indent=2))
            if not ok:
                # Full output stays local (and is not uploaded as a public artifact).
                pathlib.Path(os.environ['RUNNER_TEMP'],'smoke-failure.log').write_text(p.stdout+'\n'+p.stderr)
                raise SystemExit('Live free-model test failed (quota, network, or tool failure). No paid fallback is configured.')
        KILO_SCRIPT_SMOKE_PY
        cat > "$RUNNER_TEMP/kilo-scripts/git-save.sh" <<'KILO_SCRIPT_GIT_SAVE_SH'
        #!/usr/bin/env bash
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        exec 8>"$RUNNER_TEMP/kilo-git.lock"
        flock 8
        # Never bypass branch protection, never force-push, never pull/rebase over live edits.
        if [[ -n "$(git status --porcelain)" ]]; then
          git add -A
          if ! git diff --cached --quiet; then
            # Heuristic only: this is NOT a guarantee against committing secrets.
            if git diff --cached --name-only | grep -Eq '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$)|\.(pem|p12|pfx|key)$'; then
              echo 'Refusing automatic commit: sensitive-looking path staged. Review it manually.' >&2
              exit 1
            fi
            git -c core.hooksPath=/dev/null commit -m 'chore: save Kilo agent workspace [skip ci]'
          fi
        fi
        if ! git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
          echo 'Push rejected. Local workspace is retained in encrypted backup; resolve permissions/protection manually.' >&2
          exit 1
        fi
        KILO_SCRIPT_GIT_SAVE_SH
        cat > "$RUNNER_TEMP/kilo-scripts/proxy.py" <<'KILO_SCRIPT_PROXY_PY'
        import os, pathlib, subprocess
        p=pathlib.Path(os.environ['RUNNER_TEMP']); user=os.environ['OPENCODE_WEB_USERNAME']; password=os.environ['OPENCODE_WEB_PASSWORD']
        if not user or not password: raise SystemExit('Set existing OPENCODE_WEB_USERNAME and OPENCODE_WEB_PASSWORD secrets')
        if ':' in user or '\n' in user or '\n' in password or '\r' in user or '\r' in password:
            raise SystemExit('Basic-auth username must not contain colon/newline; password must not contain newline')
        f=p/'web.htpasswd'
        r=subprocess.run(['htpasswd','-niB',user],input=password+'\n',capture_output=True,text=True,check=True)
        f.write_text(r.stdout); f.chmod(0o600)
        conf=r'''
        worker_processes 1;
        pid __TMP__/nginx.pid;
        error_log __TMP__/nginx-error.log warn;
        events { worker_connections 256; }
        http {
          access_log off;
          client_body_temp_path __TMP__/nginx-body;
          proxy_temp_path __TMP__/nginx-proxy;
          fastcgi_temp_path __TMP__/nginx-fastcgi;
          uwsgi_temp_path __TMP__/nginx-uwsgi;
          scgi_temp_path __TMP__/nginx-scgi;
          map $http_upgrade $connection_upgrade { default upgrade; '' close; }
          server {
            listen 127.0.0.1:8081;
            server_name _;
            auth_basic "Private Kilo workspace";
            auth_basic_user_file __TMP__/web.htpasswd;
            client_max_body_size 100m;
            location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $http_host;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header Authorization "";
              proxy_read_timeout 3600s;
              proxy_buffering off;
            }
          }
        }
        '''
        # Runner paths are generated locally, never interpolated from untrusted workflow inputs.
        if any(c in str(p) for c in ' ;\n\r{}'): raise SystemExit('Unsupported runner temp path')
        (p/'nginx.conf').write_text(conf.replace('__TMP__',str(p)))
        subprocess.run(['nginx','-t','-c',str(p/'nginx.conf'),'-p',str(p)],check=True)
        subprocess.run(['nginx','-c',str(p/'nginx.conf'),'-p',str(p)],check=True)
        KILO_SCRIPT_PROXY_PY
        cat > "$RUNNER_TEMP/kilo-scripts/settings.py" <<'KILO_SCRIPT_SETTINGS_PY'
        import json, os, pathlib, shlex
        h=pathlib.Path(os.environ['HOME']); rt=pathlib.Path(os.environ['RUNNER_TEMP']); bindir=rt/'runtime/bin'
        (h/'.local/bin').mkdir(parents=True,exist_ok=True)
        # A terminal-start wrapper restores runtime PATH even if a shell resets it.
        wrapper=h/'.local/bin/start-kilo'
        wrapper.write_text('#!/usr/bin/env bash\nexport PATH='+shlex.quote(str(bindir))+':"$HOME/.local/bin:$PATH"\n'
            +'cd '+shlex.quote(os.environ['GITHUB_WORKSPACE'])+'\n'
            +'kilo'+(' --auto' if os.environ['ALLOW_TOOLS']=='true' else '')+'\nexec bash -l\n')
        wrapper.chmod(0o700)
        settings=h/'.local/share/code-server/User/settings.json'; settings.parent.mkdir(parents=True,exist_ok=True)
        try: data=json.loads(settings.read_text())
        except (FileNotFoundError,json.JSONDecodeError): data={}
        data.update({'telemetry.telemetryLevel':'off','workbench.colorTheme':'Default Dark Modern',
          'workbench.startupEditor':'none','workbench.secondarySideBar.defaultVisibility':'hidden',
          'terminal.integrated.defaultProfile.linux':'Kilo Agent',
          'terminal.integrated.profiles.linux':{'Kilo Agent':{'path':str(wrapper)},'bash':{'path':'/bin/bash'}},
          'security.workspace.trust.enabled':True})
        settings.write_text(json.dumps(data,indent=2))
        config={'model':'kilo/kilo-auto/free','small_model':'kilo/kilo-auto/free','autoupdate':False,'share':'disabled','permission':'ask'}
        # Force only the model and background model to free; preserve existing MCP config on disk.
        with open(os.environ['GITHUB_ENV'],'a') as f: f.write('KILO_CONFIG_CONTENT='+json.dumps(config,separators=(',',':'))+'\n')
        KILO_SCRIPT_SETTINGS_PY
    - name: Restore isolated Kilo state (never overwrite legacy OpenCode backups)
      if: ${{ inputs.restore_state }}
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/kilo-scripts/state.py" restore
    - name: Configure free agent and terminal UI
      env:
        ALLOW_TOOLS: ${{ inputs.allow_tools }}
      shell: bash
      run: |
        set -euo pipefail
        git -C "$GITHUB_WORKSPACE" config user.name 'github-actions[bot]'
        git -C "$GITHUB_WORKSPACE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        python3 "$RUNNER_TEMP/kilo-scripts/settings.py"
    - name: Live model response + local file tool + Git tool self-test
      if: ${{ inputs.live_model_test }}
      timeout-minutes: 6
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/kilo-scripts/smoke.py"
    - name: Start loopback-only IDE and authenticated proxy
      env:
        OPENCODE_WEB_USERNAME: ${{ secrets.OPENCODE_WEB_USERNAME }}
        OPENCODE_WEB_PASSWORD: ${{ secrets.OPENCODE_WEB_PASSWORD }}
      shell: bash
      run: |
        set -euo pipefail
        # Remove login/backup credentials from the IDE process environment.
        env -u OPENCODE_WEB_USERNAME -u OPENCODE_WEB_PASSWORD -u STATE_KEY -u GH_TOKEN \
          nohup code-server --bind-addr 127.0.0.1:8080 --auth none \
          --disable-telemetry --disable-update-check --disable-getting-started-override \
          "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/ide.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/ide.pid"
        for _ in $(seq 1 90); do
          if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:8080/healthz > /dev/null
        python3 "$RUNNER_TEMP/kilo-scripts/proxy.py"
        python3 - <<'PY'
        import base64, os, urllib.request, urllib.error
        url='http://127.0.0.1:8081/'
        try:
            urllib.request.urlopen(url,timeout=20)
            raise SystemExit('SECURITY FAILURE: unauthenticated request accepted')
        except urllib.error.HTTPError as e:
            if e.code!=401: raise
        req=urllib.request.Request(url)
        s=base64.b64encode((os.environ['OPENCODE_WEB_USERNAME']+':'+os.environ['OPENCODE_WEB_PASSWORD']).encode()).decode()
        req.add_header('Authorization','Basic '+s)
        with urllib.request.urlopen(req,timeout=30) as r:
            if r.status!=200: raise SystemExit('Authenticated IDE not ready')
        print('Proxy test passed: anonymous 401; valid existing credentials 200.')
        PY
    - name: Create initial encrypted recovery point
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
      timeout-minutes: 20
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/kilo-scripts/state.py" backup
        touch "$RUNNER_TEMP/backup-ready"
    - name: Publish temporary HTTPS browser workspace
      env:
        OPENCODE_WEB_USERNAME: ${{ secrets.OPENCODE_WEB_USERNAME }}
        OPENCODE_WEB_PASSWORD: ${{ secrets.OPENCODE_WEB_PASSWORD }}
      timeout-minutes: 12
      shell: bash
      run: |
        set -euo pipefail
        env -u OPENCODE_WEB_USERNAME -u OPENCODE_WEB_PASSWORD \
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8081 \
          --metrics 127.0.0.1:49312 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/tunnel.pid"
        python3 - <<'PY'
        import base64,os,pathlib,re,time,urllib.request,urllib.error
        p=pathlib.Path(os.environ['RUNNER_TEMP'])
        url=None
        for _ in range(120):
            text=(p/'tunnel.log').read_text(errors='replace')
            m=re.search(r'https://[a-z0-9-]+\.trycloudflare\.com',text)
            if m:
                try:
                    with urllib.request.urlopen('http://127.0.0.1:49312/ready',timeout=3) as r:
                        if r.status==200: url=m.group(); break
                except Exception: pass
            time.sleep(1)
        if not url: raise SystemExit('Cloudflare Quick Tunnel was not ready; no working public link was verified')
        # Verify the public boundary too, not only the local health endpoint.
        public_ok=False
        for _ in range(30):
            try:
                try:
                    urllib.request.urlopen(url,timeout=10)
                    raise SystemExit('SECURITY FAILURE: public request accepted without credentials')
                except urllib.error.HTTPError as exc:
                    if exc.code!=401: raise
                req=urllib.request.Request(url)
                token=base64.b64encode((os.environ['OPENCODE_WEB_USERNAME']+':'+os.environ['OPENCODE_WEB_PASSWORD']).encode()).decode()
                req.add_header('Authorization','Basic '+token)
                with urllib.request.urlopen(req,timeout=15) as response:
                    if response.status==200: public_ok=True; break
            except (urllib.error.URLError,TimeoutError): time.sleep(2)
        if not public_ok: raise SystemExit('Public HTTPS authentication test failed; URL not published')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Kilo coding workspace\n\n[Open browser IDE]('+url+')\n\n')
            f.write('Sign in using existing OPENCODE_WEB_USERNAME / OPENCODE_WEB_PASSWORD secrets.\n\n')
            f.write('Open **Terminal → New Terminal** to launch Kilo. Use `/models` to choose a free model.\n\n')
            f.write('Free hosted providers can impose quotas or change availability. No paid fallback.\n\n')
            f.write('Agent can execute code on this runner. Do not expose an untrusted repository or confidential prompts.\n')
        # Publish the URL directly in this step's live log as soon as it is verified.
        print('PUBLIC BROWSER IDE URL: ' + url, flush=True)
        print('::notice title=Browser IDE URL::' + url, flush=True)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('public_url=' + url + '\\n')
        print('The link is also saved in the job Summary for later reference.', flush=True)
        PY
    - name: Serve repository development session with periodic saves
      env:
        AUTO_COMMIT: ${{ inputs.auto_commit }}
        COMMIT_SECONDS: ${{ inputs.commit_interval_seconds }}
        BACKUP_MINUTES: ${{ inputs.backup_interval_minutes }}
        GH_TOKEN: ${{ github.token }}
        STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        next_backup=$(date +%s)
        next_commit=$(date +%s)
        next_countdown=$(( $(date +%s) + 300 ))
        backup_pid=''
        show_remaining() {
          local remaining=$(( SESSION_DEADLINE - $(date +%s) ))
          (( remaining < 0 )) && remaining=0
          printf 'LIVE COUNTDOWN: %02d h %02d min remaining until workflow session ends.\\n' \\
            "$((remaining / 3600))" "$(((remaining % 3600) / 60))"
        }
        show_remaining
        while (( $(date +%s) < SESSION_DEADLINE )); do
          now=$(date +%s)
          if (( now >= next_countdown )); then
            show_remaining
            next_countdown=$((now + 300))
          fi
          for service in ide tunnel; do
            kill -0 "$(cat "$RUNNER_TEMP/$service.pid")" || { echo "$service stopped" >&2; exit 1; }
          done
          if [[ -n "$backup_pid" ]] && ! kill -0 "$backup_pid" 2>/dev/null; then
            wait "$backup_pid" || { echo 'Periodic state backup failed' >&2; exit 1; }
            backup_pid=''
          fi
          if [[ "$AUTO_COMMIT" == true ]] && (( now >= next_commit )); then
            bash "$RUNNER_TEMP/kilo-scripts/git-save.sh"
            next_commit=$((now + COMMIT_SECONDS))
          fi
          if (( now >= next_backup )) && [[ -z "$backup_pid" ]]; then
            python3 "$RUNNER_TEMP/kilo-scripts/state.py" backup > "$RUNNER_TEMP/periodic-backup.log" 2>&1 &
            backup_pid=$!
            next_backup=$((now + BACKUP_MINUTES * 60))
          fi
          sleep 10
        done
        if [[ -n "$backup_pid" ]]; then wait "$backup_pid"; fi
    - name: Stop incoming access and quiesce agent before final snapshot
      if: ${{ always() }}
      shell: bash
      run: |
        set -uo pipefail
        for service in tunnel ide; do
          if [[ -f "$RUNNER_TEMP/$service.pid" ]]; then kill "$(cat "$RUNNER_TEMP/$service.pid")" 2>/dev/null || true; fi
        done
        if [[ -f "$RUNNER_TEMP/nginx.pid" ]]; then
          nginx -s quit -c "$RUNNER_TEMP/nginx.conf" -p "$RUNNER_TEMP" || true
        fi
        pkill -TERM -u "$(id -u)" -f "$RUNNER_TEMP/runtime.*kilo" || true
        sleep 3
    - name: Final optional Git commit and push
      if: ${{ always() && inputs.auto_commit }}
      shell: bash
      run: |
        set -euo pipefail
        bash "$RUNNER_TEMP/kilo-scripts/git-save.sh"
    - name: Final encrypted HOME and workspace backup
      if: ${{ always() }}
      timeout-minutes: 20
      env:
        GH_TOKEN: ${{ github.token }}
        STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        # Do not overwrite an older recovery point if startup/restore never completed.
        if [[ -f "$RUNNER_TEMP/backup-ready" ]]; then
          python3 "$RUNNER_TEMP/kilo-scripts/state.py" backup
        else
          echo 'No initial recovery point: preserving previous state without overwrite.'
        fi
