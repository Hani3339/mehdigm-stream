name: Temp Inspect VnxPlayer

on:
  push:
    branches:
      - arena/aca5ffed-mehdigm-stream
    paths:
      - .github/workflows/tmp-inspect-vnx.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/aca5ffed-mehdigm-stream

      - name: Install Python deps
        run: |
          pip install -q curl_cffi

      - name: Test token IP-binding, S1 across episodes, subtitles, and download endpoints
        run: |
          python3 - << 'PYEOF'
          import json, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from curl_cffi import requests as creq

          PROXIES = []
          for src in [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
              "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt",
          ]:
              try:
                  r = creq.get(src, timeout=8)
                  if r.status_code == 200:
                      for ln in r.text.splitlines()[:100]:
                          ln = ln.strip()
                          if re.match(r"^\d+\.\d+\.\d+\.\d+:\d+$", ln):
                              PROXIES.append("http://" + ln)
              except Exception:
                  pass

          GOOD_PROXY = [None]
          def try_one(p, url, headers):
              try:
                  kw = {"impersonate": "chrome124", "headers": headers, "timeout": 6, "allow_redirects": True}
                  if p:
                      kw["proxies"] = {"http": p, "https": p}
                  r = creq.get(url, **kw)
                  if r.status_code == 200 and "Just a moment..." not in r.text[:2000] and "_cf_chl_opt" not in r.text[:4000]:
                      return r.status_code, str(r.url), r.text, dict(r.headers), p
              except Exception:
                  pass
              return None

          def fetch_cf(url, headers):
              if GOOD_PROXY[0]:
                  res = try_one(GOOD_PROXY[0], url, headers)
                  if res:
                      return res
              try:
                  with ThreadPoolExecutor(max_workers=25) as ex:
                      futs = [ex.submit(try_one, p, url, headers) for p in PROXIES[:70]]
                      for fut in as_completed(futs, timeout=15):
                          r = fut.result()
                          if r:
                              GOOD_PROXY[0] = r[4]
                              return r
              except Exception:
                  pass
              return 0, "", "", {}, None

          ep_ref = "https://w1.anime4up.rest/episode/%d8%a7%d9%86%d9%85%d9%8a-tokyo-revengers-santen-sensou-hen-%d8%a7%d9%84%d8%ad%d9%84%d9%82%d8%a9-4-%d9%85%d8%aa%d8%b1%d8%ac%d9%85%d8%a9/"
          iframe_hdrs = {
              "Referer": ep_ref,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ar,en-US;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "same-origin",
          }

          out = {"episodes": {}, "downloads": {}, "subtitles": {}}

          test_pages = {
              "tr4_s1": "https://w1.anime4up.rest/Anime4up-S1/mal/59088/4/sub/?vnx_no_cache=1",
              "tr4_s2": "https://w1.anime4up.rest/Anime4up-S2/mal/59088/4/sub/?vnx_no_cache=1",
              "tr3_s1": "https://w1.anime4up.rest/Anime4up-S1/mal/59088/3/sub/?vnx_no_cache=1",
              "tr3_s2": "https://w1.anime4up.rest/Anime4up-S2/mal/59088/3/sub/?vnx_no_cache=1",
              "bc3_s1": "https://w1.anime4up.rest/Anime4up-S1/mal/61967/3/sub/?vnx_no_cache=1",
              "bc3_s2": "https://w1.anime4up.rest/Anime4up-S2/mal/61967/3/sub/?vnx_no_cache=1",
              "naruto500_s1": "https://w1.anime4up.rest/Anime4up-S1/mal/1735/500/sub/?vnx_no_cache=1",
              "naruto500_s2": "https://w1.anime4up.rest/Anime4up-S2/mal/1735/500/sub/?vnx_no_cache=1",
          }

          cdn_hdrs = {
              "Accept": "application/vnd.apple.mpegurl, application/x-mpegURL, */*",
              "Referer": "https://w1.anime4up.rest/",
              "Origin": "https://w1.anime4up.rest",
          }

          for label, u in test_pages.items():
              st, fin_u, txt, hdrs, px = fetch_cf(u, iframe_hdrs)
              m_su = re.search(r'let\s+streamUrl\s*=\s*"([^"]*)"', txt)
              m_tr = re.search(r'const\s+tracks\s*=\s*(\[.*?\]);', txt)
              su = m_su.group(1) if m_su else ""
              entry = {"html_status": st, "proxy_used": px, "streamUrl": su, "tracks": m_tr.group(1) if m_tr else ""}

              if su:
                  # Test 1: Fetch CDN URL DIRECTLY from runner IP (DIFFERENT IP from proxy!) WITH headers
                  try:
                      r_dir = creq.get(su, headers=cdn_hdrs, impersonate="chrome124", timeout=10)
                      entry["cdn_direct_with_hdrs"] = {
                          "status": r_dir.status_code,
                          "len": len(r_dir.text),
                          "preview": r_dir.text[:600],
                      }
                      # If master m3u8, also test fetching first variant!
                      v_urls = [ln.strip() for ln in r_dir.text.splitlines() if ln.strip().startswith("http")]
                      if v_urls:
                          rv = creq.get(v_urls[0], headers=cdn_hdrs, impersonate="chrome124", timeout=10)
                          entry["cdn_variant0_direct"] = {"status": rv.status_code, "len": len(rv.text), "preview": rv.text[:350]}
                  except Exception as ex:
                      entry["cdn_direct_with_hdrs"] = {"err": str(ex)}

                  # Test 2: Fetch CDN URL DIRECTLY WITHOUT Referer/Origin headers (plain OkHttp/ExoPlayer check!)
                  try:
                      r_plain = creq.get(su, impersonate="chrome124", timeout=10)
                      entry["cdn_direct_no_hdrs"] = {"status": r_plain.status_code, "len": len(r_plain.text), "preview": r_plain.text[:250]}
                  except Exception as ex:
                      entry["cdn_direct_no_hdrs"] = {"err": str(ex)}

              # Test subtitles from tr4_s2 & bc3_s1
              if label in ("tr4_s2", "bc3_s1") and m_tr:
                  try:
                      tr_arr = json.loads(m_tr.group(1))
                      for t_obj in tr_arr:
                          cand_list = [t_obj.get("file", "")] + t_obj.get("fallbacks", [])
                          if t_obj.get("fallbacks"):
                              # Also test fallback stripped of query!
                              cand_list.append(t_obj["fallbacks"][0].split("?")[0])
                          for cu in cand_list:
                              if not cu:
                                  continue
                              # Direct without proxy
                              try:
                                  rd = creq.get(cu, headers={"Referer": "https://w1.anime4up.rest/"}, impersonate="chrome124", timeout=8)
                                  d_info = {"status": rd.status_code, "len": len(rd.text), "has_cues": "-->" in rd.text}
                              except Exception as ex:
                                  d_info = {"err": str(ex)}
                              # Via proxy
                              pst, _, ptxt, _, ppx = fetch_cf(cu, {"Referer": "https://w1.anime4up.rest/", "Accept": "text/vtt,*/*"})
                              p_info = {"status": pst, "len": len(ptxt), "has_cues": "-->" in ptxt, "preview": ptxt[:300]}
                              out["subtitles"][cu] = {"direct": d_info, "via_proxy": p_info}
                  except Exception as ex:
                      out["subtitles"][label + "_err"] = str(ex)

              out["episodes"][label] = entry

          # Test /download/ endpoints!
          for dlabel, du in [
              ("tr4_s1_dl", "https://w1.anime4up.rest/Anime4up-S1/mal/59088/4/sub/download/?vnx_no_cache=1"),
              ("tr4_s2_dl", "https://w1.anime4up.rest/Anime4up-S2/mal/59088/4/sub/download/?vnx_no_cache=1"),
              ("bc3_s1_dl", "https://w1.anime4up.rest/Anime4up-S1/mal/61967/3/sub/download/?vnx_no_cache=1"),
          ]:
              st, fin_u, txt, _, px = fetch_cf(du, iframe_hdrs)
              out["downloads"][dlabel] = {
                  "status": st,
                  "len": len(txt),
                  "urls": list(set(re.findall(r'https?:\\?/\\?/[^"\'\\\s<>]+', txt)))[:30],
                  "snippet": txt[:2500],
              }

          with open(".tmp_vnx/verify_matrix.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print("MATRIX DONE")
          PYEOF

      - name: Commit matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .tmp_vnx/verify_matrix.json
          git commit -m "chore: save vnxplayer verification matrix [skip ci]" || true
          git push origin arena/aca5ffed-mehdigm-stream
