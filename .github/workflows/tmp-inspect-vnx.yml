name: Build Anime4Up v3 & Verify anime4up1 + anime4up2

on:
  push:
    branches:
      - arena/aca5ffed-mehdigm-stream
    paths:
      - .github/workflows/tmp-inspect-vnx.yml
      - Anime4Up/**

permissions:
  contents: write

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/aca5ffed-mehdigm-stream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Anime4Up.cs3
        run: |
          set -eo pipefail
          mkdir -p .tmp_vnx
          chmod +x ./gradlew
          ./gradlew :Anime4Up:make --no-daemon --stacktrace 2>&1 | tee .tmp_vnx/gradle_build.log
          cp -f Anime4Up/build/Anime4Up.cs3 build/Anime4Up.cs3
          ls -la build/Anime4Up.cs3
          unzip -p build/Anime4Up.cs3 manifest.json > .tmp_vnx/cs3_manifest.json
          cat .tmp_vnx/cs3_manifest.json

      - name: Live End-to-End Verification of anime4up1 & anime4up2 on Target Episode
        run: |
          pip install -q curl_cffi beautifulsoup4
          python3 - << 'PYEOF'
          import json, re, time
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from curl_cffi import requests as creq

          PROXIES = []
          for src in [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
              "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt",
          ]:
              try:
                  r = creq.get(src, timeout=8)
                  if r.status_code == 200:
                      for ln in r.text.splitlines()[:100]:
                          ln = ln.strip()
                          if re.match(r"^\d+\.\d+\.\d+\.\d+:\d+$", ln):
                              PROXIES.append("http://" + ln)
              except Exception:
                  pass

          GOOD_PROXY = [None]
          def try_one(p, url, headers):
              try:
                  kw = {"impersonate": "chrome124", "headers": headers, "timeout": 6, "allow_redirects": True}
                  if p:
                      kw["proxies"] = {"http": p, "https": p}
                  r = creq.get(url, **kw)
                  if r.status_code == 200 and "Just a moment..." not in r.text[:2000] and "_cf_chl_opt" not in r.text[:4000] and "هذا الدومين غير مصرح" not in r.text:
                      return r.status_code, str(r.url), r.text, p
              except Exception:
                  pass
              return None

          def fetch_net(url, headers):
              if GOOD_PROXY[0]:
                  res = try_one(GOOD_PROXY[0], url, headers)
                  if res:
                      return res
              try:
                  with ThreadPoolExecutor(max_workers=25) as ex:
                      futs = [ex.submit(try_one, p, url, headers) for p in PROXIES[:70]]
                      for fut in as_completed(futs, timeout=15):
                          r = fut.result()
                          if r:
                              GOOD_PROXY[0] = r[3]
                              return r
              except Exception:
                  pass
              return 0, "", "", None

          ep_url = "https://w1.anime4up.rest/episode/%d8%a7%d9%86%d9%85%d9%8a-tokyo-revengers-santen-sensou-hen-%d8%a7%d9%84%d8%ad%d9%84%d9%82%d8%a9-4-%d9%85%d8%aa%d8%b1%d8%ac%d9%85%d8%a9/"
          st, _, ep_html, px = fetch_net(ep_url, {"Referer": "https://w1.anime4up.rest/"})
          soup = BeautifulSoup(ep_html, "html.parser")
          servers = []
          for li in soup.select("ul#episode-servers li[data-watch], li[data-watch]"):
              w_url = li.get("data-watch", "")
              s_el = li.select_one(".watch-server-name, span.server")
              s_name = s_el.get_text(strip=True) if s_el else li.get_text(strip=True)
              if "anime4up" in s_name.lower() or "c1oiijc.shop" in w_url:
                  servers.append({"name": s_name, "watch_url": w_url})

          e2e_report = {"episode_url": ep_url, "discovered_vnx_servers": servers, "extracted": {}}
          site_origin = "https://w1.anime4up.rest"
          cdn_hdrs = {
              "Accept": "application/vnd.apple.mpegurl, application/x-mpegURL, */*",
              "Referer": site_origin + "/",
              "Origin": site_origin,
          }

          for srv in servers:
              m_path = re.search(r"/(Anime4up-S(\d+)/[^?#]+)", srv["watch_url"], re.I)
              canon_url = f"{site_origin}/{m_path.group(1).lstrip('/')}"
              fetch_url = f"{canon_url}?vnx_no_cache={int(time.time()*1000)}"
              hst, _, htxt, _ = fetch_net(fetch_url, {
                  "Referer": ep_url,
                  "Sec-Fetch-Dest": "iframe",
                  "Sec-Fetch-Mode": "navigate",
                  "Sec-Fetch-Site": "same-origin",
              })
              su_m = re.search(r'(?:let|var|const)\s+streamUrl\s*=\s*["\']([^"\']+)["\']', htxt)
              tr_m = re.search(r'const\s+tracks\s*=\s*(\[[\s\S]*?\])\s*;', htxt)
              stream_url = su_m.group(1) if su_m else ""
              rc = creq.get(stream_url, headers=cdn_hdrs, impersonate="chrome124", timeout=10)
              body = rc.text.lstrip("\ufeff").strip()
              has_sep_audio = bool(re.search(r'#EXT-X-MEDIA:[^\r\n]*TYPE=AUDIO[^\r\n]*URI=["\'][^"\']+["\']', body, re.I))
              variants = re.findall(r'#EXT-X-STREAM-INF:([^\r\n]+)\r?\n(https?://[^\r\n]+)', body)
              # Verify first media segment HTTP 200!
              seg_status = 0
              if variants:
                  rv = creq.get(variants[0][1].strip(), headers=cdn_hdrs, impersonate="chrome124", timeout=10)
                  segs = [ln.strip() for ln in rv.text.splitlines() if ln.strip().startswith("http")]
                  if segs:
                      rs = creq.get(segs[0], headers={"Referer": site_origin + "/", "Range": "bytes=0-1023"}, impersonate="chrome124", timeout=10)
                      seg_status = rs.status_code

              sub_ok = False
              sub_len = 0
              if tr_m:
                  t_arr = json.loads(tr_m.group(1))
                  for cand in [t_arr[0].get("file", "")] + t_arr[0].get("fallbacks", []):
                      sst, _, stxt, _ = fetch_net(cand, {"Referer": canon_url, "Accept": "text/vtt,*/*"})
                      if sst == 200 and "-->" in stxt:
                          sub_ok = True
                          sub_len = len(stxt)
                          break

              e2e_report["extracted"][srv["name"]] = {
                  "canonical_url": canon_url,
                  "playlist_http": rc.status_code,
                  "has_separate_audio_tracks": has_sep_audio,
                  "variant_count": len(variants),
                  "variants_meta": [v[0] for v in variants],
                  "first_segment_http": seg_status,
                  "arabic_subtitle_verified": sub_ok,
                  "arabic_subtitle_bytes": sub_len,
              }

          with open(".tmp_vnx/e2e_report.json", "w", encoding="utf-8") as f:
              json.dump(e2e_report, f, ensure_ascii=False, indent=2)
          print(json.dumps(e2e_report, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit build & verification artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/Anime4Up.cs3 .tmp_vnx/gradle_build.log .tmp_vnx/cs3_manifest.json .tmp_vnx/e2e_report.json
          git commit -m "chore: build Anime4Up v3 cs3 and save e2e report [skip ci]" || true
          git push origin arena/aca5ffed-mehdigm-stream
