name: Temp Inspect VnxPlayer

on:
  push:
    branches:
      - arena/aca5ffed-mehdigm-stream
    paths:
      - .github/workflows/tmp-inspect-vnx.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/aca5ffed-mehdigm-stream

      - name: Install Python deps
        run: |
          pip install -q curl_cffi playwright beautifulsoup4
          python3 -m playwright install chromium

      - name: Capture full VnxPlayer HTML, JS, Subtitles, and CDN behavior
        run: |
          mkdir -p .tmp_vnx
          python3 - << 'PYEOF'
          import asyncio, json, re
          from curl_cffi import requests as creq
          from playwright.async_api import async_playwright

          PROXIES = []
          for src in [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
              "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt",
          ]:
              try:
                  r = creq.get(src, timeout=8)
                  if r.status_code == 200:
                      for ln in r.text.splitlines()[:120]:
                          ln = ln.strip()
                          if re.match(r"^\d+\.\d+\.\d+\.\d+:\d+$", ln):
                              PROXIES.append("http://" + ln)
              except Exception:
                  pass

          def fetch_via_proxy(url, headers):
              for p in [None] + PROXIES[:80]:
                  try:
                      kw = {"impersonate": "chrome124", "headers": headers, "timeout": 10, "allow_redirects": True}
                      if p:
                          kw["proxies"] = {"http": p, "https": p}
                      r = creq.get(url, **kw)
                      if r.status_code == 200 and "Just a moment..." not in r.text[:2000] and "_cf_chl_opt" not in r.text[:4000]:
                          return r.status_code, str(r.url), r.text, dict(r.headers), p
                  except Exception:
                      pass
              return 0, "", "", {}, None

          ep_ref = "https://w1.anime4up.rest/episode/%d8%a7%d9%86%d9%85%d9%8a-tokyo-revengers-santen-sensou-hen-%d8%a7%d9%84%d8%ad%d9%84%d9%82%d8%a9-4-%d9%85%d8%aa%d8%b1%d8%ac%d9%85%d8%a9/"
          iframe_hdrs = {
              "Referer": ep_ref,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ar,en-US;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "same-origin",
          }

          targets = {
              "tr4_s1_direct": "https://w1.anime4up.rest/Anime4up-S1/mal/59088/4/sub/",
              "tr4_s2_direct": "https://w1.anime4up.rest/Anime4up-S2/mal/59088/4/sub/",
              "tr4_s1_4x": "https://4x.c1oiijc.shop/Anime4up-S1/mal/59088/4/sub/",
              "tr4_s2_4x": "https://4x.c1oiijc.shop/Anime4up-S2/mal/59088/4/sub/",
              "tr3_s1_direct": "https://w1.anime4up.rest/Anime4up-S1/mal/59088/3/sub/",
              "tr3_s2_direct": "https://w1.anime4up.rest/Anime4up-S2/mal/59088/3/sub/",
              "tr1_s1_direct": "https://w1.anime4up.rest/Anime4up-S1/mal/59088/1/sub/",
              "tr1_s2_direct": "https://w1.anime4up.rest/Anime4up-S2/mal/59088/1/sub/",
              "bc3_s1_direct": "https://w1.anime4up.rest/Anime4up-S1/mal/61967/3/sub/",
              "bc3_s1_nocache": "https://w1.anime4up.rest/Anime4up-S1/mal/61967/3/sub/?vnx_no_cache=1",
              "bc3_s2_direct": "https://w1.anime4up.rest/Anime4up-S2/mal/61967/3/sub/",
          }

          results = {}

          # Use Playwright to capture FULL untruncated body of w1.anime4up.rest/Anime4up-S1 and S2 + any JS files
          async def run_pw():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  ctx = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                      locale="ar",
                  )
                  for name, u in [
                      ("tr4_s1", "https://4x.c1oiijc.shop/Anime4up-S1/mal/59088/4/sub/"),
                      ("tr4_s2", "https://4x.c1oiijc.shop/Anime4up-S2/mal/59088/4/sub/"),
                      ("tr3_s1", "https://4x.c1oiijc.shop/Anime4up-S1/mal/59088/3/sub/"),
                      ("tr3_s2", "https://4x.c1oiijc.shop/Anime4up-S2/mal/59088/3/sub/"),
                      ("tr1_s1", "https://4x.c1oiijc.shop/Anime4up-S1/mal/59088/1/sub/"),
                      ("bc3_s1_nc", "https://w1.anime4up.rest/Anime4up-S1/mal/61967/3/sub/?vnx_no_cache=1"),
                  ]:
                      page = await ctx.new_page()
                      saved_docs = []
                      async def on_resp(resp, label=name):
                          try:
                              url = resp.url
                              if ("Anime4up-S" in url and resp.status == 200) or ("VnxPlayer" in url and url.endswith(".js")) or ("7p4bm32" in url):
                                  txt = await resp.text()
                                  saved_docs.append({"url": url, "status": resp.status, "len": len(txt), "text": txt[:200000]})
                          except Exception as ex:
                              saved_docs.append({"url": resp.url, "status": resp.status, "err": str(ex)})
                      page.on("response", on_resp)
                      parent_url = ep_ref
                      await page.route(parent_url, lambda route, target=u: route.fulfill(
                          status=200,
                          content_type="text/html; charset=utf-8",
                          body=f'<!DOCTYPE html><html><body><iframe id="p" referrerpolicy="no-referrer-when-downgrade" src="{target}" width="800" height="450" allowfullscreen></iframe></body></html>'
                      ))
                      try:
                          await page.goto(parent_url, wait_until="domcontentloaded", timeout=20000)
                          await page.wait_for_timeout(8000)
                      except Exception as ex:
                          print("pw err", name, ex)
                      results[name] = saved_docs
                      for idx, d in enumerate(saved_docs):
                          if "Anime4up-S" in d["url"] and "text" in d:
                              with open(f".tmp_vnx/full_{name}_{idx}.html", "w", encoding="utf-8") as f:
                                  f.write(d["text"])
                          elif "VnxPlayer" in d["url"] and "text" in d:
                              with open(f".tmp_vnx/vnx_js_{idx}.js", "w", encoding="utf-8") as f:
                                  f.write(d["text"])
                      await page.close()
                  await browser.close()

          asyncio.run(run_pw())

          # Also test proxy fetch on direct w1.anime4up.rest/Anime4up-S1 & S2 + subtitle URLs!
          proxy_tests = {}
          for k in ("tr4_s1_direct", "tr4_s2_direct", "tr4_s1_4x", "tr4_s2_4x", "bc3_s1_nocache"):
              st, fin_u, txt, hdrs, px = fetch_via_proxy(targets[k], iframe_hdrs)
              proxy_tests[k] = {
                  "status": st,
                  "final_url": fin_u,
                  "len": len(txt),
                  "proxy": px,
                  "has_7p4bm32": "7p4bm32" in txt,
                  "has_vnx": "vnx" in txt.lower(),
                  "tail": txt[-8000:] if txt else "",
              }
              if txt:
                  with open(f".tmp_vnx/proxy_{k}.html", "w", encoding="utf-8") as f:
                      f.write(txt)

          # Extract any subtitle URL from tr4_s2 full html and test fetching it via proxy AND direct
          sub_urls = set()
          cdn_urls = set()
          for name, docs in results.items():
              for d in docs:
                  t = d.get("text", "")
                  for m in re.findall(r'https?:\\?/\\?/[^"\'\\\s<>]+(?:\.vtt|7p4bm32\.shop[^"\'\\\s<>]*)', t):
                      u_clean = m.replace("\\/", "/")
                      if ".vtt" in u_clean:
                          sub_urls.add(u_clean)
                      else:
                          cdn_urls.add(u_clean)

          sub_tests = {}
          for su in sorted(sub_urls)[:6]:
              st, fin_u, txt, hdrs, px = fetch_via_proxy(su, {"Referer": "https://w1.anime4up.rest/Anime4up-S2/mal/59088/4/sub/"})
              sub_tests[su] = {"status": st, "len": len(txt), "proxy": px, "preview": txt[:600]}

          cdn_tests = {}
          for cu in sorted(cdn_urls)[:8]:
              # Test direct without proxy! (CDN might not block datacenter/any IP, or check required headers!)
              for hdr_mode, ch in [
                  ("with_referer", {"Referer": "https://w1.anime4up.rest/", "Origin": "https://w1.anime4up.rest"}),
                  ("no_headers", {}),
              ]:
                  try:
                      r = creq.get(cu, headers=ch, impersonate="chrome124", timeout=10)
                      cdn_tests[f"{hdr_mode}::{cu[:80]}"] = {"status": r.status_code, "len": len(r.text), "preview": r.text[:400]}
                  except Exception as ex:
                      cdn_tests[f"{hdr_mode}::{cu[:80]}"] = {"err": str(ex)}

          with open(".tmp_vnx/deep_summary.json", "w", encoding="utf-8") as f:
              json.dump({
                  "proxy_tests": proxy_tests,
                  "sub_urls": sorted(sub_urls),
                  "cdn_urls": sorted(cdn_urls),
                  "sub_tests": sub_tests,
                  "cdn_tests": cdn_tests,
                  "pw_doc_counts": {k: [{"url": x.get("url"), "status": x.get("status"), "len": x.get("len")} for x in v] for k, v in results.items()},
              }, f, ensure_ascii=False, indent=2)
          print("DONE DEEP CAPTURE")
          PYEOF

      - name: Commit captured results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .tmp_vnx/
          git commit -m "chore: deep capture vnxplayer html and js [skip ci]" || true
          git push origin arena/aca5ffed-mehdigm-stream
