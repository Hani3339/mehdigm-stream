name: CI Build and Inspect

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  inspect-providers:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Python curl_cffi
        run: pip install curl_cffi

      - name: Inspect Home8, Black Clover Ep3, VnxPlayer, Workupload, GoFile, MediaFire
        run: |
          python3 - << 'PYEOF'
          import os, re, json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from curl_cffi import requests as creq

          os.makedirs(".tmp_inspect/v2", exist_ok=True)
          TEST_URL = "https://w1.anime4up.rest/home8/"

          def is_valid_a4u(t):
              return bool(t and len(t) > 1500 and "just a moment" not in t.lower() and "anime4up" in t.lower())

          # Collect multiple working proxies so no single proxy drops mid-run
          PROXY_SOURCES = [
              ("http", "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=6000&country=all&ssl=yes&anonymity=all"),
              ("http", "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"),
              ("socks5", "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt"),
              ("http", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"),
              ("socks5", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"),
              ("http", "https://raw.githubusercontent.com/vakhov/fresh-proxy-list/master/https.txt"),
              ("socks5", "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"),
          ]
          candidates, seen = [], set()
          for proto, src in PROXY_SOURCES:
              try:
                  r = creq.get(src, timeout=8)
                  if r.status_code == 200:
                      for ln in r.text.splitlines()[:160]:
                          ln = ln.strip()
                          if ":" in ln and not ln.startswith("#"):
                              p = ln if "://" in ln else f"{proto}://{ln}"
                              if p not in seen:
                                  seen.add(p)
                                  candidates.append(p)
              except Exception:
                  pass

          good_proxies = []
          def test_p(p):
              try:
                  r = creq.get(TEST_URL, proxies={"http": p, "https": p}, impersonate="chrome124", timeout=9)
                  if r.status_code == 200 and is_valid_a4u(r.text):
                      return p, r.text
              except Exception:
                  pass
              return None

          home8_cached = ""
          with ThreadPoolExecutor(max_workers=50) as ex:
              futs = [ex.submit(test_p, p) for p in candidates[:500]]
              for fut in as_completed(futs):
                  res = fut.result()
                  if res:
                      p, txt = res
                      good_proxies.append(p)
                      if not home8_cached:
                          home8_cached = txt
                      if len(good_proxies) >= 8:
                          break

          print("Good proxies:", good_proxies)
          if home8_cached:
              with open(".tmp_inspect/v2/home8.html", "w", encoding="utf-8") as f:
                  f.write(home8_cached)

          def a4u_get(url):
              for p in [None] + good_proxies:
                  try:
                      prx = {"http": p, "https": p} if p else None
                      r = creq.get(url, headers={"Referer": "https://w1.anime4up.rest/", "Accept-Language": "ar,en-US;q=0.9"}, proxies=prx, impersonate="chrome124", timeout=15)
                      if r.status_code == 200 and is_valid_a4u(r.text):
                          return r.text
                  except Exception:
                      pass
              return ""

          for fname, u in [
              ("black_clover_s2_ep3.html", "https://w1.anime4up.rest/episode/%d8%a7%d9%86%d9%85%d9%8a-black-clover-2nd-season-%d8%a7%d9%84%d8%ad%d9%84%d9%82%d8%a9-3-%d9%85%d8%aa%d8%b1%d8%ac%d9%85%d8%a9/"),
              ("search_naruto.html", "https://w1.anime4up.rest/?search_param=animes&s=naruto"),
          ]:
              h = a4u_get(u)
              print(f"{fname}: {len(h)} bytes")
              with open(f".tmp_inspect/v2/{fname}", "w", encoding="utf-8") as f:
                  f.write(h)

          # Now test VnxPlayer (Anime4up-S1 & Anime4up-S2) WITH Referer: https://w1.anime4up.rest/
          vnx_headers = {
              "Referer": "https://w1.anime4up.rest/",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "cross-site",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }
          for vname, vurl in [
              ("vnx_naruto_s1.html", "https://4x.c1oiijc.shop/Anime4up-S1/mal/1735/500/sub/"),
              ("vnx_naruto_s2.html", "https://4x.c1oiijc.shop/Anime4up-S2/mal/1735/500/sub/"),
              ("vnx_bc_s1.html", "https://4x.c1oiijc.shop/Anime4up-S1/mal/61967/3/sub/"),
              ("vnx_bc_s2.html", "https://4x.c1oiijc.shop/Anime4up-S2/mal/61967/3/sub/"),
          ]:
              for p in [None] + good_proxies[:3]:
                  try:
                      prx = {"http": p, "https": p} if p else None
                      r = creq.get(vurl, headers=vnx_headers, proxies=prx, impersonate="chrome124", timeout=15)
                      print(f"{vname} via {p}: status={r.status_code} len={len(r.text)} url={r.url}")
                      if r.status_code == 200 and len(r.text) > 100:
                          with open(f".tmp_inspect/v2/{vname}", "w", encoding="utf-8") as f:
                              f.write(f"<!-- FINAL_URL: {r.url} -->\n" + r.text)
                          break
                  except Exception as e:
                      print(f"{vname} err: {e}")

          # Test Workupload direct download API
          wu_report = {}
          try:
              s = creq.Session(impersonate="chrome124")
              r1 = s.get("https://workupload.com/file/bZQrCGgNJQy", timeout=12)
              r2 = s.get("https://workupload.com/start/bZQrCGgNJQy", headers={"Referer": "https://workupload.com/file/bZQrCGgNJQy"}, timeout=12)
              r3 = s.get("https://workupload.com/api/file/getDownloadServer/bZQrCGgNJQy", headers={"Referer": "https://workupload.com/start/bZQrCGgNJQy", "X-Requested-With": "XMLHttpRequest"}, timeout=12)
              wu_report = {"r1": r1.status_code, "r2": r2.status_code, "r3_status": r3.status_code, "r3_body": r3.text[:1000], "cookies": dict(s.cookies)}
          except Exception as e:
              wu_report = {"err": str(e)}

          # Test GoFile API
          gf_report = {}
          try:
              s = creq.Session(impersonate="chrome124")
              acc = s.post("https://api.gofile.io/accounts", timeout=12).json()
              tok = acc.get("data", {}).get("token", "")
              # Also check global.js for wt token
              gjs = s.get("https://gofile.io/dist/js/config.js", timeout=10)
              if gjs.status_code != 200:
                  gjs = s.get("https://gofile.io/dist/js/global.js", timeout=10)
              wt_m = re.search(r'wt\s*[:=]\s*["\']([^"\']+)["\']', gjs.text) if gjs.status_code == 200 else None
              wt = wt_m.group(1) if wt_m else "4fd6sg89d7s6"
              cnt = s.get(f"https://api.gofile.io/contents/Ea141JHv?wt={wt}", headers={"Authorization": f"Bearer {tok}", "X-Website-Token": wt}, timeout=12)
              gf_report = {"token_ok": bool(tok), "wt": wt, "cnt_status": cnt.status_code, "cnt_body": cnt.text[:1500]}
          except Exception as e:
              gf_report = {"err": str(e)}

          # Test MediaFire direct extraction
          mf_report = {}
          try:
              rmf = creq.get("https://www.mediafire.com/file/a7nxsp84rbvukf9", impersonate="chrome124", timeout=12)
              m1 = re.search(r'href="(https?://download\d+\.mediafire\.com/[^"]+)"', rmf.text)
              m2 = re.search(r'data-scrambled-url="([^"]+)"', rmf.text)
              mf_report = {"status": rmf.status_code, "direct": m1.group(1) if m1 else None, "scrambled": m2.group(1) if m2 else None}
          except Exception as e:
              mf_report = {"err": str(e)}

          with open(".tmp_inspect/v2/providers_report.json", "w", encoding="utf-8") as f:
              json.dump({"good_proxies": good_proxies, "workupload": wu_report, "gofile": gf_report, "mediafire": mf_report}, f, indent=2, ensure_ascii=False)
          PYEOF

      - name: Commit v2 inspect results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f .tmp_inspect/v2/
          git commit -m "chore: attach v2 provider inspection [skip ci]"
          git push origin "${{ github.ref_name }}"
