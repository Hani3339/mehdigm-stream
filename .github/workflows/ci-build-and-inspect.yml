name: Build Anime4Up & Cimawbas

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  build-cs3:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Anime4Up & Cimawbas (.cs3)
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew :Anime4Up:clean :Anime4Up:make :Cimawbas:clean :Cimawbas:make --stacktrace --no-daemon
          mkdir -p build
          cp -v Anime4Up/build/Anime4Up.cs3 build/Anime4Up.cs3
          cp -v Cimawbas/build/Cimawbas.cs3 build/Cimawbas.cs3
          ls -lh build/Anime4Up.cs3 build/Cimawbas.cs3

      - name: Commit built .cs3 packages
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/Anime4Up.cs3 build/Cimawbas.cs3
          git commit --allow-empty -m "chore: rebuild Anime4Up.cs3 and Cimawbas.cs3 [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "${{ github.ref_name }}"
