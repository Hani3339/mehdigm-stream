name: Build Anime4Up & Cimawbas and Verify Live Extraction

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  build-and-verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Anime4Up & Cimawbas (.cs3)
        run: |
          chmod +x gradlew
          ./gradlew :Anime4Up:clean :Anime4Up:make :Cimawbas:clean :Cimawbas:make --stacktrace --no-daemon | tee .tmp_gradle_build.log
          mkdir -p build
          cp -v Anime4Up/build/Anime4Up.cs3 build/Anime4Up.cs3
          cp -v Cimawbas/build/Cimawbas.cs3 build/Cimawbas.cs3
          ls -lh build/Anime4Up.cs3 build/Cimawbas.cs3

      - name: Live End-to-End Verification
        run: |
          pip install -q curl_cffi beautifulsoup4
          python3 -u - << 'PYEOF' 2>&1 | tee .tmp_verify_log.txt
          import base64, json, re, urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from bs4 import BeautifulSoup
          from curl_cffi import requests as creq

          PROXY_FEEDS = [
              ("http", "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=6500&country=all&ssl=yes&anonymity=all"),
              ("http", "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"),
              ("socks5", "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt"),
              ("http", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"),
              ("socks5", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"),
              ("http", "https://raw.githubusercontent.com/vakhov/fresh-proxy-list/master/https.txt"),
              ("socks5", "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"),
          ]

          working_proxy = None
          dead_proxies = set()

          def is_valid_site(html):
              if not html or len(html) < 800:
                  return False
              low = html.lower()
              if "<title>just a moment" in low or "cf-browser-verification" in low:
                  return False
              return any(k in html for k in ("anime4up", "anime-card-container", "anime-details", "episode-servers", "الحلقة"))

          def find_working_proxy(test_url):
              global working_proxy
              cands = []
              for proto, feed in PROXY_FEEDS:
                  try:
                      r = creq.get(feed, timeout=8)
                      if r.status_code == 200:
                          for line in r.text.splitlines()[:100]:
                              line = line.strip()
                              if line and ":" in line and not line.startswith("#"):
                                  spec = line if "://" in line else f"{proto}://{line}"
                                  if spec not in dead_proxies:
                                      cands.append(spec)
                  except Exception:
                      pass
              cands = list(dict.fromkeys(cands))[:220]
              print(f"[Proxy] Probing {len(cands)} proxies across {len(PROXY_FEEDS)} sources...")

              def probe(p):
                  try:
                      r = creq.get(test_url, impersonate="chrome124", proxies={"http": p, "https": p}, timeout=9)
                      if r.status_code == 200 and is_valid_site(r.text):
                          return p, r.text
                  except Exception:
                      pass
                  dead_proxies.add(p)
                  return None

              ex = ThreadPoolExecutor(max_workers=28)
              try:
                  futs = [ex.submit(probe, p) for p in cands]
                  for f in as_completed(futs):
                      res = f.result()
                      if res:
                          working_proxy = res[0]
                          print(f"[Proxy] Selected working proxy: {working_proxy}")
                          ex.shutdown(wait=False, cancel_futures=True)
                          return res[1]
              finally:
                  ex.shutdown(wait=False, cancel_futures=True)
              return None

          def fetch_site(url):
              global working_proxy
              try:
                  r = creq.get(url, impersonate="chrome124", timeout=10)
                  if r.status_code == 200 and is_valid_site(r.text):
                      return r.text
              except Exception:
                  pass
              for _ in range(3):
                  if working_proxy:
                      try:
                          r = creq.get(url, impersonate="chrome124", proxies={"http": working_proxy, "https": working_proxy}, timeout=14)
                          if r.status_code == 200 and is_valid_site(r.text):
                              return r.text
                      except Exception:
                          pass
                      dead_proxies.add(working_proxy)
                      working_proxy = None
                  res = find_working_proxy(url)
                  if res:
                      return res
              return None

          def extract_episodes_like_kotlin(anime_url):
              html = fetch_site(anime_url)
              assert html, f"Failed to fetch {anime_url}"
              soup = BeautifulSoup(html, "html.parser")
              title = soup.select_one("h1.anime-details-title")
              title_txt = title.get_text(strip=True) if title else "?"
              no_eps_yet = "لا توجد حلقات" in html
              cards = soup.select("div#episodesList div.anime-card-container")
              ep_map = {}
              for c in cards:
                  a = c.select_one("div.ep_num a[href*='/episode/'], a.overlay[href*='/episode/'], a[href*='/episode/']")
                  if a:
                      href = a["href"]
                      key = urllib.parse.unquote(href).rstrip("/").lower()
                      ep_map[key] = href
              has_more = bool(soup.select_one("a.episodes-load-more, nav.episodes-pagination-holder a.page-numbers"))
              first_ep_el = soup.select_one("a.anime-first-ep[href*='/episode/']")
              first_ep = first_ep_el["href"] if first_ep_el else (next(iter(ep_map.values()), None))
              if (not ep_map or has_more) and first_ep:
                  ep_html = fetch_site(first_ep)
                  if ep_html:
                      ep_soup = BeautifulSoup(ep_html, "html.parser")
                      for a in ep_soup.select("ul#ULEpisodesList li a[href*='/episode/']"):
                          href = a["href"]
                          key = urllib.parse.unquote(href).rstrip("/").lower()
                          ep_map[key] = href
              return title_txt, len(cards), len(ep_map), first_ep, no_eps_yet

          def decrypt_voe(enc):
              rot = []
              for c in enc:
                  if 'a' <= c <= 'z':
                      rot.append(chr(ord('a') + (ord(c) - ord('a') + 13) % 26))
                  elif 'A' <= c <= 'Z':
                      rot.append(chr(ord('A') + (ord(c) - ord('A') + 13) % 26))
                  else:
                      rot.append(c)
              s = "".join(rot)
              for m in ["@$", "^^", "~@", "%?", "*~", "!!", "#&"]:
                  s = s.replace(m, "_")
              s = s.replace("_", "")
              s3 = base64.b64decode(s).decode("latin1")
              s4 = "".join(chr(ord(ch) - 3) for ch in reversed(s3))
              return json.loads(base64.b64decode(s4).decode("utf-8"))

          def test_episode_providers(ep_url):
              html = fetch_site(ep_url)
              assert html, f"Failed to fetch episode {ep_url}"
              soup = BeautifulSoup(html, "html.parser")
              watch = [(li.select_one(".watch-server-name").get_text(strip=True) if li.select_one(".watch-server-name") else "srv",
                        li.select_one(".quality").get_text(strip=True) if li.select_one(".quality") else "",
                        li["data-watch"])
                       for li in soup.select("ul#episode-servers li[data-watch]")]
              dl = [(tr.select_one(".server-name, td.td-server").get_text(strip=True) if tr.select_one(".server-name, td.td-server") else "dl",
                     tr.select_one("td.td-quality").get_text(strip=True) if tr.select_one("td.td-quality") else "",
                     tr.select_one("td.td-link a[href]")["href"])
                    for tr in soup.select("div#download table tbody tr") if tr.select_one("td.td-link a[href]")]
              resolved = []
              for name, q, u in watch + dl:
                  try:
                      if "megamax.me" in u or "share4max.com" in u:
                          m = re.search(r"/(?:iframe|d|download)/([A-Za-z0-9_-]+)", u)
                          if m:
                              host = "https://share4max.com" if "share4max" in u else "https://megamax.me"
                              r = creq.get(f"{host}/iframe/{m.group(1)}", impersonate="chrome124", timeout=12)
                              s2 = BeautifulSoup(r.text, "html.parser")
                              sc = s2.select_one("script[data-page=app]")
                              if sc:
                                  arr = json.loads(sc.get_text())["props"]["streams"]["data"]["arr"]
                                  tiers = [f"{t.get('label')}:{len(t.get('mirrors',[]))}mirrors" for t in arr]
                                  resolved.append(f"MegaMax[{','.join(tiers)}]")
                      elif "mediafire.com" in u:
                          r = creq.get(u, impersonate="chrome124", timeout=12)
                          m = re.search(r'https?://download\d*\.mediafire\.com/[^"\'\s<>]+', r.text)
                          if m:
                              resolved.append(f"MediaFire({q})->MP4_OK")
                      elif "vkvideo.ru" in u:
                          r = creq.get(u, impersonate="chrome124", timeout=12)
                          quals = re.findall(r'"(url\d+|hls)"\s*:\s*"https?:', r.text)
                          if quals:
                              resolved.append(f"VK[{','.join(dict.fromkeys(quals))}]")
                      elif "voe.sx" in u:
                          vid = re.search(r'voe\.sx/(?:e/)?([A-Za-z0-9]+)', u).group(1)
                          r = creq.get(f"https://voe.sx/e/{vid}", impersonate="chrome124", timeout=12)
                          redir = re.search(r"window\.location\.href\s*=\s*['\"](https?://[^'\"]+)['\"]", r.text)
                          if redir:
                              r = creq.get(redir.group(1), impersonate="chrome124", timeout=12)
                          enc = re.search(r'<script[^>]*type=["\']application/json["\'][^>]*>\s*\[\s*"([^"]+)"\s*\]\s*</script>', r.text)
                          if enc:
                              dec = decrypt_voe(enc.group(1))
                              if dec.get("source"):
                                  resolved.append(f"VOE({q})->HLS_OK")
                      elif "uqload." in u:
                          uid = re.search(r'uqload\.[a-z]+/(?:e/|embed-)?([A-Za-z0-9]{10,})', u).group(1)
                          r = creq.get(f"https://uqload.vc/embed-{uid}.html", impersonate="chrome124", timeout=12)
                          if ".mp4" in r.text or ".m3u8" in r.text:
                              resolved.append(f"Uqload({q})->MP4_OK")
                  except Exception:
                      pass
              return len(watch), len(dl), list(dict.fromkeys(resolved))

          report = {}

          # 1. Naruto Shippuuden full 500-episode test + Ep 500 & Ep 1 links
          naruto_url = "https://w1.anime4up.rest/anime/naruto-shippuuden-sgtfr/"
          n_title, n_p1, n_total, n_first, _ = extract_episodes_like_kotlin(naruto_url)
          print(f"[Naruto] {n_title}: page1={n_p1}, total={n_total}")
          assert n_total == 500, f"Expected 500 Naruto episodes, got {n_total}"
          nw500, nd500, nres500 = test_episode_providers("https://w1.anime4up.rest/episode/naruto-shippuuden-%d8%a7%d9%84%d8%ad%d9%84%d9%82%d8%a9-500/")
          nw1, nd1, nres1 = test_episode_providers(n_first)
          report["naruto_shippuuden"] = {
              "title": n_title,
              "page1_cards": n_p1,
              "total_episodes": n_total,
              "ep1": {"watch": nw1, "download": nd1, "resolved": nres1},
              "ep500": {"watch": nw500, "download": nd500, "resolved": nres500},
          }

          # 2. Homepage widgets & new anime/episodes test
          home_html = fetch_site("https://w1.anime4up.rest/home8/")
          home_soup = BeautifulSoup(home_html, "html.parser")
          widgets = []
          tested_new = []
          for w in home_soup.select("div.main-widget"):
              h = w.select_one("div.main-didget-head h3")
              h_txt = h.get_text(strip=True) if h else ""
              if "تابع المشاهدة" in h_txt:
                  continue
              cards = w.select("div.anime-card-container")
              widgets.append({"heading": h_txt, "count": len(cards)})
              for c in cards[:5]:
                  a_el = c.select_one("div.anime-card-title h3 a[href*='/anime/']")
                  ep_el = c.select_one("div.ep_num a[href*='/episode/']")
                  if not a_el or not a_el["href"].startswith("http"):
                      continue
                  a_url = a_el["href"]
                  t_txt, p1c, totc, f_ep, no_eps_yet = extract_episodes_like_kotlin(a_url)
                  if no_eps_yet and totc == 0:
                      print(f"[Home:{h_txt}] {t_txt} -> site says 'لا توجد حلقات' (unreleased), skipping")
                      continue
                  assert totc > 0, f"Homepage anime {a_url} had 0 episodes!"
                  probe_ep = ep_el["href"] if ep_el else f_ep
                  wc, dc, rlist = test_episode_providers(probe_ep)
                  tested_new.append({
                      "widget": h_txt,
                      "anime": t_txt,
                      "url": a_url,
                      "episodes": totc,
                      "watch_servers": wc,
                      "download_links": dc,
                      "resolved_streams": rlist,
                  })
                  print(f"[Home:{h_txt}] {t_txt} -> {totc} eps, {wc} watch, {dc} dl, resolved={rlist}")
                  break

          # 3. Movie test (note exact URL slug on site: ninpouchou)
          m_title, m_p1, m_tot, m_ep, _ = extract_episodes_like_kotlin("https://w1.anime4up.rest/anime/naruto-movie-1-dai-katsugeki-yuki-hime-ninpouchou-dattebayo/")
          assert m_tot >= 1, f"Movie had 0 episodes!"
          mw, md, mres = test_episode_providers(m_ep)
          report["movie_test"] = {"title": m_title, "episodes": m_tot, "watch": mw, "download": md, "resolved": mres}
          report["home_widgets"] = widgets
          report["homepage_live_samples"] = tested_new

          with open(".tmp_verify_report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print("=== ALL E2E VERIFICATIONS PASSED ===")
          PYEOF

      - name: Commit built .cs3 artifacts and verification report
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/Anime4Up.cs3 build/Cimawbas.cs3 .tmp_verify_report.json .tmp_verify_log.txt .tmp_gradle_build.log
          git commit -m "chore: attach built Anime4Up.cs3, Cimawbas.cs3, and verification report [skip ci]"
          git push origin "${{ github.ref_name }}"
