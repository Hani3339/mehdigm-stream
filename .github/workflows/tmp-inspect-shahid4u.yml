name: Inspect Shahid4u Live Architecture & Providers

on:
  push:
    branches:
      - arena/67b3a643-mehdigm-stream

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/67b3a643-mehdigm-stream

      - name: Resolve all real watch & download providers (honeytoken-immune) & probe sub-hosts
        run: |
          pip install -q requests "curl_cffi>=0.7" beautifulsoup4 PySocks
          mkdir -p .tmp_s4u/hosts
          python3 - <<'PY'
          import concurrent.futures, json, os, random, re, time, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          from curl_cffi import requests as creq

          BASE = "https://shaahidd4u.net"
          ep_slug = "مسلسل-tulsa-king-الموسم-الرابع-الحلقة-1-مترجمة"
          film_slug = "فيلم-rise-of-the-footsoldier-retribution-2026-مترجم"

          def safe_url(u: str) -> str:
              p = urllib.parse.urlsplit(u)
              path = urllib.parse.quote(urllib.parse.unquote(p.path), safe="/%")
              query = urllib.parse.quote_plus(urllib.parse.unquote_plus(p.query), safe="=&%")
              return urllib.parse.urlunsplit((p.scheme, p.netloc, path, query, p.fragment))

          def is_valid_s4u(status: int, html: str) -> bool:
              if status != 200 or not html or len(html) < 2000:
                  return False
              low = html.lower()
              if "just a moment" in low or "attention required" in low or "_cf_chl_opt" in low or "sorry, you have been blocked" in low:
                  return False
              return "shaahidd4u" in low or "shahid4u" in low or "شاهد فور يو" in html

          def make_session(proxy_url: str):
              s = creq.Session(impersonate="chrome124")
              if proxy_url:
                  s.proxies = {"http": proxy_url, "https": proxy_url}
              return s

          feeds = [
              ("socks5h", "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks5.txt"),
              ("socks4", "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks4.txt"),
              ("http", "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/http.txt"),
              ("socks5h", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"),
              ("http", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"),
          ]
          cands = []
          for proto, fu in feeds:
              try:
                  fr = requests.get(fu, timeout=8)
                  for ln in fr.text.splitlines()[:140]:
                      ln = ln.strip()
                      if ":" in ln and not ln.startswith("#"):
                          cands.append(f"{proto}://{ln}")
              except Exception:
                  pass

          def probe_proxy(pu):
              try:
                  ps = make_session(pu)
                  r = ps.get(BASE + "/", timeout=8)
                  if is_valid_s4u(r.status_code, r.text):
                      return pu
              except Exception:
                  pass
              return None

          good_proxies = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as ex:
              futs = [ex.submit(probe_proxy, pu) for pu in cands[:400]]
              for ft in concurrent.futures.as_completed(futs):
                  res_p = ft.result()
                  if res_p:
                      good_proxies.append(res_p)
                      if len(good_proxies) >= 3:
                          break

          assert good_proxies, "No working proxies found"
          print("Found clean proxies:", good_proxies)
          sess = make_session(good_proxies[0])

          def get_page(url: str, save_as: str, ref: str = BASE + "/"):
              global sess
              for attempt_idx in range(len(good_proxies)):
                  time.sleep(0.45)
                  try:
                      r = sess.get(
                          safe_url(url),
                          headers={
                              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                              "Accept-Language": "ar-EG,ar;q=0.9,en-US;q=0.8,en;q=0.7",
                              "Referer": safe_url(ref),
                          },
                          timeout=20,
                      )
                      if is_valid_s4u(r.status_code, r.text):
                          with open(f".tmp_s4u/{save_as}", "w", encoding="utf-8") as fh:
                              fh.write(r.text)
                          print(f"OK {save_as}: len={len(r.text)}")
                          return r.text
                      print(f"Warn {save_as}: status={r.status_code} len={len(r.text)}, rotating proxy...")
                  except Exception as exc:
                      print(f"Err {save_as}: {exc}, rotating proxy...")
                  if attempt_idx + 1 < len(good_proxies):
                      sess = make_session(good_proxies[attempt_idx + 1])
              return ""

          def is_trap_or_hidden(el) -> bool:
              cur = el
              while cur is not None and hasattr(cur, "attrs") and cur.attrs is not None:
                  if cur.name == "template":
                      return True
                  if cur.has_attr("hidden") or cur.has_attr("data-honeytoken") or cur.has_attr("data-trap"):
                      return True
                  if str(cur.get("aria-hidden", "")).lower() == "true":
                      return True
                  if str(cur.get("tabindex", "")) == "-1":
                      return True
                  if str(cur.get("id", "")).lower() == "download-primary-server":
                      return True
                  st = str(cur.get("style", "")).replace(" ", "").lower()
                  if "display:none" in st or "visibility:hidden" in st or "opacity:0" in st:
                      return True
                  cls = " ".join(cur.get("class", [])).lower()
                  if "d-none" in cls or "visually-hidden" in cls:
                      return True
                  cur = cur.parent
              return False

          def follow_m_once(m_url: str, ref: str):
              if "/m/" not in m_url:
                  return {"direct": m_url}
              time.sleep(0.4)
              rr = sess.get(
                  safe_url(m_url),
                  headers={"Referer": safe_url(ref)},
                  allow_redirects=False,
                  timeout=15,
              )
              loc = rr.headers.get("Location") or rr.headers.get("location")
              return {"status": rr.status_code, "location": loc, "body_snip": "" if loc else rr.text[:160]}

          def resolve_watch_clean(watch_url: str, save_fname: str, ref_url: str):
              html = get_page(watch_url, save_fname, ref_url)
              if not html:
                  return []
              sp = BeautifulSoup(html, "html.parser")

              # Collect ALL trap tokens anywhere in DOM so we NEVER touch them!
              trap_tokens = set()
              for btn in sp.select("[data-token]"):
                  tok = (btn.get("data-token") or "").strip()
                  if tok and is_trap_or_hidden(btn):
                      trap_tokens.add(tok)

              visible_buttons = []
              for btn in sp.select("#servers .items_container button.btn-server[data-token]"):
                  if is_trap_or_hidden(btn):
                      continue
                  tok = (btn.get("data-token") or "").strip()
                  if not tok or tok in trap_tokens:
                      continue
                  sname = btn.get_text(" ", strip=True)
                  visible_buttons.append((sname, tok))

              m_key = re.search(r'watchResolveKey\s*=\s*["\']([^"\']+)["\']', html)
              m_csrf = re.search(r'csrfToken\s*=\s*["\']([^"\']+)["\']', html) or re.search(r'<meta\s+name=["\']csrf-token["\']\s+content=["\']([^"\']+)["\']', html)
              m_res = re.search(r'resolveUrl\s*=\s*["\']([^"\']+)["\']', html)
              if not (m_key and m_csrf):
                  return [{"error": "missing_key_or_csrf"}]
              key = m_key.group(1)
              csrf = m_csrf.group(1)
              res_url = urllib.parse.urljoin(BASE, m_res.group(1).replace("\\/", "/")) if m_res else f"{BASE}/watch/resolve"

              out = []
              elapsed = 380
              clicks = 2
              for sname, tok in visible_buttons:
                  time.sleep(0.55)
                  elapsed += random.randint(450, 900)
                  clicks += 1
                  human_sig = {
                      "version": 1,
                      "elapsed_ms": elapsed,
                      "visible_ms": elapsed - 25,
                      "pointer": 5 + clicks,
                      "click": clicks,
                      "touch": 0,
                      "scroll": 2,
                      "key": 0,
                  }
                  pr = sess.post(
                      safe_url(res_url),
                      headers={
                          "Accept": "application/json",
                          "Content-Type": "application/json",
                          "X-CSRF-TOKEN": csrf,
                          "X-Requested-With": "XMLHttpRequest",
                          "X-FP-Event-ID": "",
                          "Origin": BASE,
                          "Referer": safe_url(watch_url),
                      },
                      data=json.dumps({"key": key, "token": tok, "human_signal": human_sig}),
                      timeout=15,
                  )
                  try:
                      pj = pr.json()
                  except Exception:
                      pj = {"raw_text": pr.text[:250]}
                  target = pj.get("url") if isinstance(pj, dict) else None
                  final_t = None
                  if target:
                      abs_t = urllib.parse.urljoin(BASE, target)
                      final_t = follow_m_once(abs_t, watch_url)
                  out.append({
                      "name": sname,
                      "token_prefix": tok[:10],
                      "post_status": pr.status_code,
                      "resp": pj,
                      "final_target": final_t,
                  })
              return {"trap_tokens_skipped": list(trap_tokens), "resolved": out}

          def resolve_download_clean(dl_url: str, save_fname: str, ref_url: str):
              html = get_page(dl_url, save_fname, ref_url)
              if not html:
                  return {}
              sp = BeautifulSoup(html, "html.parser")
              traps_found = []
              items = []
              seen_base = set()

              # Check all elements with /m/ or data-honeytoken on download page
              for el in sp.find_all(True):
                  if el.has_attr("data-honeytoken") or el.get("id") == "download-primary-server":
                      traps_found.append(str(el)[:220])

              for a in sp.select("div.down-container a.btn-down[href], a.btn-down[href]"):
                  href = urllib.parse.urljoin(BASE, a.get("href", ""))
                  txt = " ".join(a.stripped_strings)
                  span_name = a.select_one(".info span")
                  sname = span_name.get_text(strip=True) if span_name else txt
                  if is_trap_or_hidden(a) or "/media/" in href.lower():
                      traps_found.append(f"BTN_TRAP:{sname}:{a.get('id','')}:{href}")
                      continue
                  base_host = re.sub(r'(1080|720|480|360|p|\.)+', '', sname.lower()).strip()
                  loc_info = None
                  if base_host not in seen_base:
                      seen_base.add(base_host)
                      loc_info = follow_m_once(href, dl_url)
                  items.append({"name": sname, "text": txt, "href": href, "resolved": loc_info})
              return {"traps_skipped": traps_found, "items": items}

          res2 = {}
          res2["download_ep"] = resolve_download_clean(f"{BASE}/download/{ep_slug}", "download_ep.html", f"{BASE}/episode/{ep_slug}")
          res2["download_film"] = resolve_download_clean(f"{BASE}/download/{film_slug}", "download_film.html", f"{BASE}/film/{film_slug}")
          res2["watch_ep"] = resolve_watch_clean(f"{BASE}/watch/{ep_slug}", "watch_ep_clean.html", f"{BASE}/episode/{ep_slug}")
          res2["watch_film"] = resolve_watch_clean(f"{BASE}/watch/{film_slug}", "watch_film.html", f"{BASE}/film/{film_slug}")

          # Probe every distinct external video host URL directly
          direct_s = make_session(None)
          ext_urls = []
          for wkey in ("watch_ep", "watch_film"):
              wdata = res2.get(wkey) or {}
              for entry in (wdata.get("resolved") if isinstance(wdata, dict) else []):
                  ft = entry.get("final_target") or {}
                  u = ft.get("location") or ft.get("direct")
                  if u and u.startswith("http"):
                      ext_urls.append(("watch_" + entry.get("name", "unk"), u))
          for dkey in ("download_ep", "download_film"):
              ddata = res2.get(dkey) or {}
              for entry in (ddata.get("items") if isinstance(ddata, dict) else []):
                  rs = entry.get("resolved") or {}
                  u = rs.get("location") or rs.get("direct")
                  if u and u.startswith("http"):
                      ext_urls.append(("dl_" + entry.get("name", "unk"), u))

          probed = {}
          seen_doms = set()
          for tag, eu in ext_urls:
              dom = urllib.parse.urlsplit(eu).netloc.lower().replace("www.", "")
              if not dom or dom in seen_doms:
                  continue
              seen_doms.add(dom)
              safe_tag = re.sub(r'[^a-zA-Z0-9_.-]+', '_', f"{tag}_{dom}")[:65]
              try:
                  pr = direct_s.get(eu, headers={"Referer": BASE + "/"}, timeout=14)
                  if pr.status_code in (403, 503) or len(pr.text) < 400:
                      pr2 = sess.get(eu, headers={"Referer": BASE + "/"}, timeout=14)
                      if pr2.status_code == 200 and len(pr2.text) > len(pr.text):
                          pr = pr2
                  with open(f".tmp_s4u/hosts/{safe_tag}.html", "w", encoding="utf-8") as fh:
                      fh.write(pr.text[:250000])
                  probed[safe_tag] = {
                      "input_url": eu,
                      "final_url": str(pr.url),
                      "status": pr.status_code,
                      "len": len(pr.text),
                  }
              except Exception as exc:
                  probed[safe_tag] = {"input_url": eu, "error": repr(exc)}
          res2["probed_hosts"] = probed

          with open(".tmp_s4u/report2.json", "w", encoding="utf-8") as fh:
              json.dump(res2, fh, indent=2, ensure_ascii=False)
          print("DONE! Probed hosts count:", len(probed), list(probed.keys()))
          PY

      - name: Commit inspection results
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f .tmp_s4u/ || true
          git commit --allow-empty -m "chore: resolve all real watch & download providers [skip ci]"
          git pull --rebase origin arena/67b3a643-mehdigm-stream || true
          git push origin arena/67b3a643-mehdigm-stream
