name: Fetch Byse PoW & Video Bundles

on:
  push:
    branches:
      - arena/b5447323-mehdigm-stream

permissions:
  contents: write

jobs:
  fetch-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/b5447323-mehdigm-stream

      - name: Fetch pow & videoPagesBundle
        run: |
          mkdir -p .tmp_build_verify
          curl -sS "https://n1mwq.org/assets/pow-DEJGtdh2.js" -o .tmp_build_verify/pow.js
          curl -sS "https://n1mwq.org/assets/videoPagesBundle-Bgi0QmPo.js" -o .tmp_build_verify/videoPagesBundle.js
          ls -lh .tmp_build_verify/pow.js .tmp_build_verify/videoPagesBundle.js

      - name: Commit bundles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f .tmp_build_verify/pow.js .tmp_build_verify/videoPagesBundle.js
          git commit --allow-empty -m "chore: fetch byse pow and videoPagesBundle [skip ci]"
          git pull --rebase origin arena/b5447323-mehdigm-stream || true
          git push origin arena/b5447323-mehdigm-stream
