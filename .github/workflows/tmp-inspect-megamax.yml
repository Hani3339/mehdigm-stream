name: Build Anime4Up v4 & Run Live Kotlin MegaMax E2E

on:
  push:
    branches:
      - arena/b5447323-mehdigm-stream

permissions:
  contents: write

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: arena/b5447323-mehdigm-stream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew

      - name: Build Anime4Up.cs3 (version 4)
        run: |
          set -euo pipefail
          mkdir -p .tmp_build_verify build
          ./gradlew :Anime4Up:clean :Anime4Up:make --stacktrace 2>&1 | tee .tmp_build_verify/gradle_build.log
          cp Anime4Up/build/Anime4Up.cs3 build/Anime4Up.cs3
          stat -c%s build/Anime4Up.cs3 | tee .tmp_build_verify/cs3_bytes.txt

      - name: Execute compiled Anime4UpMegaMaxExtractor live on JVM
        run: |
          WORK_TMP="/tmp/a4u_jvm_verify"
          mkdir -p "$WORK_TMP/src/android/util" "$WORK_TMP/classes"

          # Download standalone org.json & kotlinc if needed, or compile shim with javac + Anime4Up printClasspath
          curl -sSL "https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar" -o "$WORK_TMP/json.jar"

          cat > "$WORK_TMP/src/android/util/Base64.java" <<'JAVA'
          package android.util;
          public class Base64 {
              public static final int DEFAULT = 0;
              public static final int NO_PADDING = 1;
              public static final int NO_WRAP = 2;
              public static final int URL_SAFE = 8;
              public static byte[] decode(String str, int flags) {
                  String clean = str.trim();
                  if ((flags & URL_SAFE) != 0 || clean.indexOf('-') >= 0 || clean.indexOf('_') >= 0) {
                      clean = clean.replace('-', '+').replace('_', '/');
                  }
                  clean = clean.replaceAll("\\s+", "");
                  int rem = clean.length() % 4;
                  if (rem != 0) clean += "====".substring(rem);
                  return java.util.Base64.getDecoder().decode(clean);
              }
              public static String encodeToString(byte[] input, int flags) {
                  java.util.Base64.Encoder enc = ((flags & URL_SAFE) != 0)
                      ? java.util.Base64.getUrlEncoder()
                      : java.util.Base64.getEncoder();
                  if ((flags & NO_PADDING) != 0) enc = enc.withoutPadding();
                  String out = enc.encodeToString(input);
                  return out;
              }
          }
          JAVA

          cat > "$WORK_TMP/src/android/util/Log.java" <<'JAVA'
          package android.util;
          public class Log {
              public static int d(String t, String m) { return 0; }
              public static int e(String t, String m) { return 0; }
              public static int e(String t, String m, Throwable tr) { return 0; }
              public static int i(String t, String m) { return 0; }
              public static int w(String t, String m) { return 0; }
          }
          JAVA

          cat > "$WORK_TMP/src/VerifyMain.java" <<'JAVA'
          import com.anime4up.Anime4UpMegaMaxExtractor;
          import com.lagradost.cloudstream3.SubtitleFile;
          import com.lagradost.cloudstream3.utils.ExtractorLink;
          import java.util.*;
          import java.util.concurrent.CopyOnWriteArrayList;
          import kotlin.Unit;
          import kotlin.coroutines.*;
          import kotlinx.coroutines.BuildersKt;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class VerifyMain {
              public static void main(String[] args) throws Exception {
                  List<ExtractorLink> links = new CopyOnWriteArrayList<>();
                  List<SubtitleFile> subs = new CopyOnWriteArrayList<>();
                  long t0 = System.currentTimeMillis();

                  BuildersKt.runBlocking(
                      EmptyCoroutineContext.INSTANCE,
                      (scope, cont) -> new Anime4UpMegaMaxExtractor().extractWithHint(
                          "https://share4max.com/iframe/WJH4dVV5cgxk0",
                          "https://w1.anime4up.rest/episode/%d8%a7%d9%86%d9%85%d9%8a-tokyo-revengers-santen-sensou-hen-%d8%a7%d9%84%d8%ad%d9%84%d9%82%d8%a9-4-%d9%85%d8%aa%d8%b1%d8%ac%d9%85%d8%a9/",
                          "FHD - 1080p",
                          sub -> { subs.add(sub); return Unit.INSTANCE; },
                          link -> { links.add(link); return Unit.INSTANCE; },
                          cont
                      )
                  );

                  long elapsedMs = System.currentTimeMillis() - t0;
                  Map<String, List<Integer>> bySource = new TreeMap<>();
                  JSONArray arr = new JSONArray();
                  Set<String> uniqueUrls = new LinkedHashSet<>();

                  for (ExtractorLink l : links) {
                      if (!uniqueUrls.add(l.getUrl())) continue;
                      bySource.computeIfAbsent(l.getSource(), k -> new ArrayList<>()).add(l.getQuality());
                      JSONObject o = new JSONObject();
                      o.put("source", l.getSource());
                      o.put("name", l.getName());
                      o.put("quality", l.getQuality());
                      o.put("type", String.valueOf(l.getType()));
                      o.put("referer", l.getReferer());
                      o.put("url_host", new java.net.URI(l.getUrl()).getHost());
                      o.put("url_sample", l.getUrl().substring(0, Math.min(120, l.getUrl().length())));
                      arr.put(o);
                  }

                  JSONObject summary = new JSONObject();
                  summary.put("elapsed_ms", elapsedMs);
                  summary.put("total_emitted", links.size());
                  summary.put("unique_links", uniqueUrls.size());
                  summary.put("subtitles_count", subs.size());
                  JSONObject grouped = new JSONObject();
                  for (Map.Entry<String, List<Integer>> e : bySource.entrySet()) {
                      grouped.put(e.getKey(), new JSONArray(e.getValue()));
                  }
                  summary.put("by_source_qualities", grouped);
                  summary.put("links", arr);

                  java.nio.file.Files.writeString(
                      java.nio.file.Path.of(".tmp_build_verify/live_kotlin_links.json"),
                      summary.toString(2)
                  );
                  System.out.println("Elapsed ms: " + elapsedMs + ", Unique links: " + uniqueUrls.size());
                  System.out.println(grouped.toString(2));
              }
          }
          JAVA

          # Collect all jars from ~/.gradle caches + cloudstream.jar + Anime4Up compiled classes
          KOTLIN_CLASSES=$(find Anime4Up/build -type d -path "*kotlin-classes/debug" | head -n 1)
          CS_JAR=$(find ~/.gradle -name "cloudstream*.jar" -o -name "cloudstream.jar" 2>/dev/null | head -n 1)
          if [ -z "$CS_JAR" ]; then
            CS_JAR=$(find . /home/runner -name "cloudstream*.jar" 2>/dev/null | head -n 1)
          fi
          GRADLE_JARS=$(find ~/.gradle/caches/modules-2/files-2.1 -name "*.jar" \
            | grep -vE "(-sources\.jar|-javadoc\.jar|gradle|lint|aapt|kotlin-compiler|apkanalyzer)" \
            | tr '\n' ':')

          CP="$WORK_TMP/classes:$WORK_TMP/json.jar:$KOTLIN_CLASSES:$CS_JAR:$GRADLE_JARS"
          javac -cp "$CP" -d "$WORK_TMP/classes" \
            "$WORK_TMP/src/android/util/Base64.java" \
            "$WORK_TMP/src/android/util/Log.java" \
            "$WORK_TMP/src/VerifyMain.java"

          java -cp "$CP" VerifyMain 2>&1 | tee .tmp_build_verify/jvm_verify.log

      - name: Commit build & live Kotlin E2E report
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f build/Anime4Up.cs3 .tmp_build_verify/ || true
          git commit --allow-empty -m "chore: build Anime4Up v4 & run live Kotlin MegaMax E2E [skip ci]"
          git pull --rebase origin arena/b5447323-mehdigm-stream || true
          git push origin arena/b5447323-mehdigm-stream
