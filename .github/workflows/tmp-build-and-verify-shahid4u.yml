              return [{"provider": host, "type": "UNKNOWN", "qualities": [], "playable": False}]

          SUPPORTED = ("vinovo", "vidara", "fastvid", "earnvids", "byse", "mixdrop", "m1xdrop", "dood", "playmogo", "voe", "uqload", "savefiles", "streamhls", "vids", "upzur", "ok")

          def canonical_key(url):
              u = urllib.parse.urlparse(url)
              h = u.netloc.lower().removeprefix("www.")
              seg = u.path.strip("/").split("/")[-1].removeprefix("embed-").removesuffix(".html")
              for fam, keys in [("vinovo", ["vinovo"]), ("vidara", ["vidara"]), ("earnvids", ["fastvid", "earnvids"]), ("byse", ["byse", "n1mwq"]), ("mixdrop", ["m1xdrop", "mxdrop", "mixdrop"]), ("dood", ["playmogo", "dood"]), ("voe", ["voe.", "derricknationtop"]), ("uqload", ["uqload"]), ("savefiles", ["savefiles", "streamhls"]), ("vidsst", ["vids.st"]), ("upzur", ["upzur"]), ("okru", ["ok.ru"])]:
                  if any(k in h for k in keys):
                      return f"{fam}:{seg}"
              return url

          def test_full_item(label, item_title, item_url):
              slug = urllib.parse.urlparse(item_url).path.strip("/").split("/", 1)[1]
              watch_url = f"{BASE}/watch/{slug}"
              dl_url = f"{BASE}/download/{slug}"
              jobs = {}

              # Watch page
              wr = s4u_get(watch_url, ref=item_url)
              wsoup, wtraps = sanitize_soup(wr.text)
              csrf = (wsoup.select_one("meta[name=csrf-token]") or {}).get("content", "")
              m_key = re.search(r'watchResolveKey\s*=\s*["\']([^"\']+)["\']', wr.text)
              wkey = m_key.group(1) if m_key else ""
              btns = [b for b in wsoup.select("#servers button.btn-server[data-token]") if b["data-token"] not in wtraps]
              watch_resolved_count = 0
              for idx, b in enumerate(btns):
                  tok = b["data-token"]
                  el = 450 + idx * 520
                  pr = sess.post(f"{BASE}/watch/resolve", json={"key": wkey, "token": tok, "human_signal": {"version": 1, "elapsed_ms": el, "visible_ms": el - 20, "pointer": 5 + idx, "click": 2 + idx, "touch": 2, "scroll": 1, "key": 0}}, headers={"Accept": "application/json", "Content-Type": "application/json", "X-CSRF-TOKEN": csrf, "X-Requested-With": "XMLHttpRequest", "X-FP-Event-ID": "", "Origin": BASE, "Referer": wr.url}, timeout=14)
                  if pr.status_code == 200 and pr.json().get("ok"):
                      mu = urllib.parse.urljoin(BASE + "/", pr.json()["url"])
                      mr = sess.get(mu, headers={"Referer": wr.url}, allow_redirects=False, timeout=12)
                      loc = mr.headers.get("location", "")
                      if loc.startswith("http"):
                          watch_resolved_count += 1
                          ck = canonical_key(loc)
                          jobs[ck] = {"url": loc, "ref": wr.url, "q": None}
                  time.sleep(0.22)

              # Download page across ALL qualities (1080, 720, 480)
              dr = s4u_get(dl_url, ref=item_url)
              dsoup, _ = sanitize_soup(dr.text)
              sroot = dsoup.select_one(".down-container .servers, .servers")
              cur_q = None
              dl_resolved_count = 0
              if sroot:
                  for ch in sroot.find_all(recursive=False):
                      if "qual" in (ch.get("class") or []):
                          mq = re.search(r"(1080|720|480|360)", ch.get_text())
                          cur_q = int(mq.group(1)) if mq else None
                          continue
                      for a in ch.select("a.btn-down[href]"):
                          nm = a.get_text(" ", strip=True).lower()
                          if not any(s in nm for s in SUPPORTED):
                              continue
                          mu = urllib.parse.urljoin(BASE + "/", a["href"])
                          mr = sess.get(mu, headers={"Referer": dr.url}, allow_redirects=False, timeout=12)
                          loc = mr.headers.get("location", "")
                          if loc.startswith("http"):
                              dl_resolved_count += 1
                              ck = canonical_key(loc)
                              if ck not in jobs:
                                  jobs[ck] = {"url": loc, "ref": dr.url, "q": cur_q}
                              elif jobs[ck]["q"] is None and cur_q is not None:
                                  jobs[ck]["q"] = cur_q
                          time.sleep(0.16)

              extracted = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
                  futs = {ex.submit(extract_provider, j["url"], j["ref"], j["q"]): ck for ck, j in jobs.items()}
                  for f in concurrent.futures.as_completed(futs):
                      ck = futs[f]
                      try:
                          for item in f.result():
                              item["canonical_key"] = ck
                              extracted.append(item)
                      except Exception as e:
                          extracted.append({"canonical_key": ck, "playable": False, "error": str(e)})

              playable = [x for x in extracted if x.get("playable")]
              all_qualities = sorted({q for x in playable for q in x.get("qualities", [])}, reverse=True)
              providers_ok = sorted({x["provider"] for x in playable})
              return {
                  "label": label,
                  "title": item_title,
                  "url": urllib.parse.unquote(item_url),
                  "watch_buttons": len(btns),
                  "watch_resolved": watch_resolved_count,
                  "download_resolved": dl_resolved_count,
                  "unique_jobs": len(jobs),
                  "playable_streams_count": len(playable),
                  "providers_verified_200_ok": providers_ok,
                  "qualities_verified": all_qualities,
                  "details": extracted,
              }

          report = {
              "homepage_cards_count": len(cards),
              "series_episode_test": test_full_item("recent_homepage_series_episode", ep_target[0], ep_target[1]),
              "movie_test": test_full_item("recent_homepage_movie", movie_target[0], movie_target[1]),
          }
          with open(".tmp_e2e_report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print("E2E SUMMARY:", json.dumps({
              "homepage_cards": report["homepage_cards_count"],
              "ep_playable": report["series_episode_test"]["playable_streams_count"],
              "ep_providers": report["series_episode_test"]["providers_verified_200_ok"],
              "ep_qualities": report["series_episode_test"]["qualities_verified"],
              "movie_playable": report["movie_test"]["playable_streams_count"],
              "movie_providers": report["movie_test"]["providers_verified_200_ok"],
              "movie_qualities": report["movie_test"]["qualities_verified"],
          }, ensure_ascii=False, indent=2))
          PY

