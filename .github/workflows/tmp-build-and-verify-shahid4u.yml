                  chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
                  def base_n(num, b):
                      if num == 0: return "0"
                      res = ""
                      while num > 0:
                          res = chars[num % b] + res
                          num //= b
                      return res
                  for i in range(c - 1, -1, -1):
                      if i < len(k) and k[i]:
                          tok = base_n(i, a)
                          p = re.sub(r"\b" + re.escape(tok) + r"\b", lambda _, rep=k[i]: rep, p)
                  out.append(p)
