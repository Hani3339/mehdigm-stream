        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "build/Shahid4u.cs3" ] && git add -f build/Shahid4u.cs3 || true
          [ -f ".tmp_gradle.log" ] && git add -f .tmp_gradle.log || true
          [ -f ".tmp_e2e_report.json" ] && git add -f .tmp_e2e_report.json || true
          git commit -m "chore: build Shahid4u.cs3 v12 & save live E2E verification [skip ci]" || true
