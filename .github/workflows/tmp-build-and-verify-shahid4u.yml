              wsoup, wtraps = sanitize_soup(wr.text)
              csrf_el = wsoup.select_one("meta[name=csrf-token]")
              csrf = csrf_el["content"] if csrf_el and csrf_el.has_attr("content") else ""
              m_key = re.search(r'watchResolveKey\s*=\s*["\']([^"\']+)["\']', wr.text)
              wkey = m_key.group(1) if m_key else ""
              btns = [b for b in wsoup.select("#servers button.btn-server[data-token]") if b["data-token"] not in wtraps]
              watch_resolved_count = 0
              for idx, b in enumerate(btns):
                  try:
                      tok = b["data-token"]
                      el = 450 + idx * 520
                      pr = wsess.post(f"{BASE}/watch/resolve", json={"key": wkey, "token": tok, "human_signal": {"version": 1, "elapsed_ms": el, "visible_ms": el - 20, "pointer": 5 + idx, "click": 2 + idx, "touch": 2, "scroll": 1, "key": 0}}, headers={"Accept": "application/json", "Content-Type": "application/json", "X-CSRF-TOKEN": csrf, "X-Requested-With": "XMLHttpRequest", "X-FP-Event-ID": "", "Origin": BASE, "Referer": wr_ref}, timeout=14)
                      if pr.status_code == 200 and pr.json().get("ok"):
                          mu = enc_url(urllib.parse.urljoin(BASE + "/", pr.json()["url"]))
                          mr = wsess.get(mu, headers={"Referer": wr_ref}, allow_redirects=False, timeout=12)
                          loc = mr.headers.get("location", "")
                          if loc.startswith("http"):
                              watch_resolved_count += 1
                              ck = canonical_key(loc)
                              jobs[ck] = {"url": loc, "ref": wr_ref, "q": None}
                  except Exception as e:
                      print("Watch resolve err:", e, flush=True)
                  time.sleep(0.22)

              # Download page across ALL qualities (1080, 720, 480)
              dsess, _ = new_sticky_session(next_p)
              dr = dsess.get(dl_url, headers={"Referer": item_url}, timeout=16)
              dr_ref = enc_url(dr.url)
              dsoup, _ = sanitize_soup(dr.text)
              sroot = dsoup.select_one(".down-container .servers, .servers")
              cur_q = None
              dl_resolved_count = 0
              if sroot:
                  for ch in sroot.find_all(recursive=False):
                      if "qual" in (ch.get("class") or []):
                          mq = re.search(r"(1080|720|480|360)", ch.get_text())
                          cur_q = int(mq.group(1)) if mq else None
                          continue
                      for a in ch.select("a.btn-down[href]"):
                          nm = a.get_text(" ", strip=True).lower()
                          if not any(s in nm for s in SUPPORTED):
                              continue
                          try:
                              mu = enc_url(urllib.parse.urljoin(BASE + "/", a["href"]))
                              mr = dsess.get(mu, headers={"Referer": dr_ref}, allow_redirects=False, timeout=12)
                              loc = mr.headers.get("location", "")
                              if loc.startswith("http"):
                                  dl_resolved_count += 1
                                  ck = canonical_key(loc)
                                  if ck not in jobs:
                                      jobs[ck] = {"url": loc, "ref": dr_ref, "q": cur_q}
                                  elif jobs[ck]["q"] is None and cur_q is not None:
                                      jobs[ck]["q"] = cur_q
                          except Exception as e:
                              print("DL resolve err:", e, flush=True)
                          time.sleep(0.16)

              extracted = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
                  futs = {ex.submit(extract_provider, j["url"], j["ref"], j["q"]): ck for ck, j in jobs.items()}
                  for f in concurrent.futures.as_completed(futs):
                      ck = futs[f]
                      try:
                          for item in (f.result() or []):
                              item["canonical_key"] = ck
                              extracted.append(item)
                      except Exception as e:
                          extracted.append({"canonical_key": ck, "playable": False, "error": str(e)})

              playable = [x for x in extracted if x.get("playable")]
              all_qualities = sorted({q for x in playable for q in x.get("qualities", [])}, reverse=True)
              providers_ok = sorted({x["provider"] for x in playable})
              return {
                  "label": label,
                  "title": item_title,
                  "url": urllib.parse.unquote(item_url),
                  "watch_buttons": len(btns),
                  "watch_resolved": watch_resolved_count,
                  "download_resolved": dl_resolved_count,
                  "unique_jobs": len(jobs),
                  "playable_streams_count": len(playable),
                  "providers_verified_200_ok": providers_ok,
                  "qualities_verified": all_qualities,
                  "details": extracted,
              }

          try:
              report = {
                  "homepage_cards_count": len(cards),
                  "series_episode_test": test_full_item("recent_homepage_series_episode", ep_target[0], ep_target[1], 0),
                  "movie_test": test_full_item("recent_homepage_movie", movie_target[0], movie_target[1], 2),
              }
              with open(".tmp_e2e_report.json", "w", encoding="utf-8") as f:
                  json.dump(report, f, ensure_ascii=False, indent=2)
              print("SUCCESS! Saved .tmp_e2e_report.json", flush=True)
          except Exception:
              traceback.print_exc()
          PY
          set -e
          tail -n 50 .tmp_e2e_log.txt

      - name: Commit temporary E2E verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f ".tmp_e2e_log.txt" ] && git add -f .tmp_e2e_log.txt || true
          [ -f ".tmp_e2e_report.json" ] && git add -f .tmp_e2e_report.json || true
          git commit -m "chore: save live E2E verification report [skip ci]" || true
          git pull --rebase origin arena/67b3a643-mehdigm-stream || true
          git push origin arena/67b3a643-mehdigm-stream || true
