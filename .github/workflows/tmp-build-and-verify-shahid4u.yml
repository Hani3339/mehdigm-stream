          def unpack_packer(html_str):
              out = []
              for m in re.finditer(r"eval\(function\(p,a,c,k,e,[dr]\)\{.*?\}\('((?:\\.|[^'])*)',\s*(\d+),\s*(\d+),\s*'((?:\\.|[^'])*)'\.split\('\|'\)", html_str, re.S):
