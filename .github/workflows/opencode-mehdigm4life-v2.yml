name: 🧬 OpenCode v2 AI Cloud — 4Life Full Persistence

# ================================================================
#  opencode-mehdigm4life-v2.yml
# ----------------------------------------------------------------
#  OpenCode Generation 2 (v2.x) edition of the proven 4Life
#  persistence workflow. It installs the v2 binary from:
#
#      curl -fsSL https://opencode.ai/v2/install | bash
#
#  and persists EVERYTHING the agent touches locally:
#
#    • the whole $HOME directory (sessions/messages DB,
#      tool-output, snapshots, logs, caches, tmp, jars, tools that
#      were downloaded/extracted anywhere under the home),
#    • the v2 paths discovered at runtime via `opencode debug paths`
#      (data, config, cache, state, log, repos, db),
#    • optionally selected system roots (default: /opt and /tmp)
#      so tools such as Jadx/Apktool that live outside $HOME
#      survive across runs,
#    • a re-install manifest for apt / pip / npm / gem so
#      system-level packages are restored automatically,
#    • a system-dir DELTA (default: /usr/local /usr/bin /usr/sbin
#      /usr/share /root /etc/profile.d /etc/environment): every
#      file the agent adds or modifies in those paths compared to
#      the fresh runner image is captured and restored.
#
#  It writes to its OWN release, completely separate from both the
#  original workflow and the v1 state:
#
#      release tag : opencode-mehdigm4life-v2-state
#
#  To inherit an existing v1 4Life state on purpose, change
#  PERSIST_RELEASE_TAG below to `opencode-mehdigm4life-state`.
#  Keeping the default separate prevents v1 and v2 runs from
#  fighting over or corrupting the same archived database.
#
#  Storage strategy (unchanged, proven):
#  tar + zstd -> AES-256-CBC (pbkdf2) -> split into <2 GiB parts
#  -> upload each part as a release asset -> only publish the new
#  generation after every part succeeded -> delete old generation.
#
#  A SQLite-consistent snapshot of the live database is taken with
#  `sqlite3 .backup` before archiving, so the memory can never be
#  corrupted by copying a live WAL database.
#
#  v2-specific notes:
#    • `opencode serve` is the v2 API + web server (there is no
#      separate `opencode web` subcommand in v2).
#    • The v2 process itself listens only on 127.0.0.1 with a
#      random internal password (fixed username `opencode`).
#    • A small nginx reverse proxy exposes the public web login
#      and enforces the OPENCODE_WEB_USERNAME/PASSWORD secrets,
#      exactly like the v1 workflow did. The public credentials
#      are never written to the job summary or logs.
#    • v2 permissions use an ordered `permissions` ruleset with
#      actions such as `shell`/`subagent` (not v1 `permission`).
#    • The live service registration file
#      ~/.local/state/opencode/service.json is never archived
#      (it contains a stale pid/url/password), nor is
#      ~/.config/opencode/service.json.
#    • The git workspace ($GITHUB_WORKSPACE) is intentionally NOT
#      part of the archive — it is persisted by the auto-commit
#      step (git add -A / push) and restored by `actions/checkout`.
#    • Credential files are excluded by default. Enable the
#      `include_credentials` input only if you really need them.
# ================================================================

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "مدة تشغيل OpenCode بالدقائق (اترك هامشاً للنسخ الاحتياطي النهائي)"
        required: true
        default: "340"
        type: string

      auto_commit:
        description: "Commit + push تلقائي لتعديلات المشروع"
        required: true
        default: true
        type: boolean

      commit_interval_seconds:
        description: "الفاصل بين عمليات فحص Git"
        required: true
        default: "60"
        type: string

      backup_interval_minutes:
        description: "حفظ كامل حالة OpenCode (ذاكرة + أدوات + ملفات) كل كم دقيقة"
        required: true
        default: "5"
        type: string

      extra_backup_paths:
        description: "مسارات نظام إضافية تُحفظ كاملة (مفصولة بمسافة)"
        required: false
        default: "/opt /tmp"
        type: string

      extra_exclude_paths:
        description: "مجلدات نظام يجب استثناؤها من النسخ الاحتياطي"
        required: false
        default: "/opt/hostedtoolcache /opt/runner-cache /opt/actionarchivecache /opt/az /opt/microsoft /opt/google /opt/pipx /opt/pipx_bin /opt/containerd /opt/primer /opt/hca /opt/post-generation"
        type: string

      extra_system_dirs:
        description: "مسارات نظام تُلتقط بنظام الدلتا (ملفات الوكيل فقط) (مفصولة بمسافة؛ اتركها فارغة للافتراضي)"
        required: false
        default: ""
        type: string

      include_credentials:
        description: "تضمين ملفات الأسرار/التوكنات داخل النسخة الاحتياطية (غير آمن)"
        required: true
        default: false
        type: boolean

      restore_system_packages:
        description: "إعادة تثبيت حزم النظام الناقصة (apt/pip/npm) بعد الاستعادة"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# يمنع تشغيل جلستين لنفس المستودع في الوقت نفسه.
concurrency:
  group: opencode-mehdigm4life-v2-${{ github.repository }}
  cancel-in-progress: false

env:
  # ============================================================
  # 4Life persistence (independent release + policy)
  # ============================================================

  # Separate from the v1 tag to keep the two generations isolated.
  # Change this to `opencode-mehdigm4life-state` to inherit v1 state.
  PERSIST_RELEASE_TAG: opencode-mehdigm4life-v2-state

  PERSIST_INCLUDE_CREDENTIALS: ${{ github.event.inputs.include_credentials }}

  PERSIST_EXTRA_PATHS: ${{ github.event.inputs.extra_backup_paths }}

  PERSIST_EXTRA_EXCLUDES: ${{ github.event.inputs.extra_exclude_paths }}

  PERSIST_SYSTEM_DIRS: ${{ github.event.inputs.extra_system_dirs }}

  # ============================================================
  # Full permissions ("Allow Always") — no manual approvals
  # ------------------------------------------------------------
  # v2 uses an ordered `permissions` ruleset. The base v2 policy
  # already allows everything except *.env (ask), so the first
  # rule keeps the broad allow and the next rules explicitly allow
  # .env files too. Lower-priority project config is merged before
  # this local-scope content, and the last matching rule wins.
  #
  # OPENCODE_CONFIG_CONTENT is injected as a final local-scope
  # config merge by the v2 binary, so it wins over project/global
  # files. `update: disable` also prevents the v2 updater from
  # replacing the freshly installed binary during the session.
  # ============================================================

  OPENCODE_CONFIG_CONTENT: '{"update":"disable","share":"disabled","permissions":[{"action":"*","resource":"*","effect":"allow"},{"action":"read","resource":"*.env","effect":"allow"},{"action":"read","resource":"*.env.*","effect":"allow"},{"action":"read","resource":"*.env.example","effect":"allow"}]}'

  OPENCODE_DISABLE_AUTOUPDATE: "1"

  # ============================================================
  # Public OpenCode web login (basic auth)
  # ------------------------------------------------------------
  # These are the credentials users type in the browser login
  # prompt. They are enforced by the nginx reverse proxy, while
  # the v2 process uses its own random internal password. Neither
  # value is ever printed to the summary or logs.
  # ============================================================

  OPENCODE_WEB_USERNAME: ${{ secrets.OPENCODE_WEB_USERNAME }}
  OPENCODE_WEB_PASSWORD: ${{ secrets.OPENCODE_WEB_PASSWORD }}

  # ============================================================
  # AI providers
  # ============================================================

  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}

  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

jobs:
  opencode-web-4life:

    name: 🧬 OpenCode v2 Web + 4Life Persistence

    runs-on: ubuntu-latest

    timeout-minutes: 358

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. Node.js
      # ============================================================

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # 3. System dependencies
      # ============================================================

      - name: 🛠️ Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            curl \
            jq \
            git \
            ca-certificates \
            procps \
            openssl \
            nginx \
            sqlite3 \
            zstd \
            rsync \
            tar \
            gzip \
            xz-utils

      # ============================================================
      # 4. Create OpenCode directories
      # ============================================================

      - name: 📁 Prepare OpenCode directories
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/opencode"
          mkdir -p "$HOME/.local/share/opencode"
          mkdir -p "$HOME/.local/state/opencode"
          mkdir -p "$HOME/.cache/opencode"
          mkdir -p "$HOME/.opencode-persistence/manifests"

      # ============================================================
      # 5. Install OpenCode v2 (fresh binary every run)
      #
      # The persistent backup intentionally does NOT include
      # ~/.opencode (the installer, native binary and its packaged
      # dependencies); it is restored from the upstream v2 installer
      # so we never run a stale or partially-restored executable.
      # Everything else (config, data, cache, state, tools) is
      # restored from the 4Life archive.
      # ============================================================

      - name: 🤖 Install OpenCode v2
        run: |
          set -euo pipefail

          curl -fsSL https://opencode.ai/v2/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$PATH"

          echo "=========================================="
          echo "OpenCode version"
          echo "=========================================="

          OC_VERSION="$(opencode --version)"
          echo "$OC_VERSION"

          if ! printf '%s' "$OC_VERSION" | grep -Eq 'v?2\.'; then
            echo "❌ Expected OpenCode v2, got: $OC_VERSION"
            exit 1
          fi

          echo "=========================================="
          echo "OpenCode debug paths"
          echo "=========================================="

          opencode debug paths

      # ============================================================
      # 6. Discover OpenCode v2 paths
      #
      # v2 exposes stable selectors:
      #   opencode debug paths <db|home|data|config|cache|state|
      #                         tmp|bin|log|repos>
      # Each selector prints exactly one absolute path, which is far
      # more robust than parsing the labelled human-readable table.
      # XDG fallbacks keep the workflow usable if a future v2 build
      # ever drops a selector.
      # ============================================================

      - name: 🔎 Discover OpenCode v2 paths
        run: |
          set -uo pipefail

          export PATH="$HOME/.opencode/bin:$PATH"

          oc_path() {
            local key="$1"
            local fallback="$2"
            local value=""
            value="$(opencode debug paths "$key" 2>/dev/null | head -n1 || true)"
            if [ -z "${value:-}" ]; then
              value="$fallback"
            fi
            printf '%s' "$value"
          }

          echo "===== OpenCode paths (v2) ====="
          opencode debug paths 2>&1 || true
          echo ""

          CONFIG_DIR="$(oc_path config "${XDG_CONFIG_HOME:-$HOME/.config}/opencode")"
          DATA_DIR="$(oc_path data "${XDG_DATA_HOME:-$HOME/.local/share}/opencode")"
          STATE_DIR="$(oc_path state "${XDG_STATE_HOME:-$HOME/.local/state}/opencode")"
          CACHE_DIR="$(oc_path cache "${XDG_CACHE_HOME:-$HOME/.cache}/opencode")"
          DB_PATH="$(oc_path db "$DATA_DIR/opencode.db")"
          LOG_DIR="$(oc_path log "$DATA_DIR/log")"
          REPOS_DIR="$(oc_path repos "$DATA_DIR/repos")"
          TMP_DIR="$(oc_path tmp "/tmp/opencode")"

          echo "===== Resolved paths ====="
          echo "Config: $CONFIG_DIR"
          echo "Data:   $DATA_DIR"
          echo "State:  $STATE_DIR"
          echo "Cache:  $CACHE_DIR"
          echo "DB:     $DB_PATH"
          echo "Log:    $LOG_DIR"
          echo "Repos:  $REPOS_DIR"
          echo "Tmp:    $TMP_DIR"

          {
            echo "OPENCODE_CONFIG_DIR=$CONFIG_DIR"
            echo "OPENCODE_DATA_DIR=$DATA_DIR"
            echo "OPENCODE_STATE_DIR=$STATE_DIR"
            echo "OPENCODE_CACHE_DIR=$CACHE_DIR"
            echo "OPENCODE_DB_PATH=$DB_PATH"
            echo "OPENCODE_LOG_DIR=$LOG_DIR"
            echo "OPENCODE_REPOS_DIR=$REPOS_DIR"
            echo "OPENCODE_TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # System-dir delta baseline (captured on the FRESH runner,
          # BEFORE any restore). At backup time we archive only the
          # files that are NEW compared to this baseline, so tools
          # installed by the agent into system paths (raw binaries in
          # /usr/local/bin, /usr/bin, /usr/share, ...) are preserved
          # WITHOUT re-archiving the huge, already-present base image.
          # --------------------------------------------------------

          SYS_CAPTURE_DIRS="${PERSIST_SYSTEM_DIRS:-/usr/local /usr/bin /usr/sbin /usr/share /root /etc/profile.d /etc/environment}"
          SYS_BASELINE_DIR="$RUNNER_TEMP/oc4life-sys-baseline"
          SYS_DELTA_LIST="$RUNNER_TEMP/oc4life-system-delta.list"

          rm -rf "$SYS_BASELINE_DIR"
          mkdir -p "$SYS_BASELINE_DIR"
          : > "$SYS_DELTA_LIST"

          for d in $SYS_CAPTURE_DIRS; do
            [ -e "$d" ] || continue
            key="$(printf '%s' "$d" | sed 's#^/##; s#/#_#g')"
            rel="${d#/}"
            ( cd / && find "$rel" -printf '%p\t%s\t%T@\n' 2>/dev/null | LC_ALL=C sort ) \
              > "$SYS_BASELINE_DIR/$key.list" 2>/dev/null || true
          done

          {
            echo "SYS_CAPTURE_DIRS=$SYS_CAPTURE_DIRS"
            echo "SYS_BASELINE_DIR=$SYS_BASELINE_DIR"
            echo "SYS_DELTA_LIST=$SYS_DELTA_LIST"
          } >> "$GITHUB_ENV"

          echo "🧭 System delta capture dirs: $SYS_CAPTURE_DIRS"

      # ============================================================
      # 7. Restore full persistent state
      #
      # The archive was written with `tar -C /` and members relative
      # to `/` (home/..., opt/..., tmp/..., ...), so it is extracted
      # back to `/` with sudo. A `--transform` keeps the home path
      # correct even if the runner user/home ever changes.
      # ============================================================

      - name: ♻️ Restore OpenCode 4Life state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${STATE_KEY:-}" ]; then
            echo "⚠️ OPENCODE_STATE_KEY is not configured — skipping state restore."
            exit 0
          fi

          RELEASE_TAG="${PERSIST_RELEASE_TAG:-opencode-mehdigm4life-v2-state}"

          echo "🔎 Looking for previous 4Life state..."

          RELEASE_JSON="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              2>/dev/null || true
          )"

          if [ -z "$RELEASE_JSON" ]; then
            echo "ℹ️ No previous 4Life state found — starting fresh."
            exit 0
          fi

          BODY="$(echo "$RELEASE_JSON" | jq -r '.body // ""')"

          GENERATION="$(
            echo "$BODY" |
            sed -n 's/^CURRENT_GENERATION=//p' |
            head -n1
          )"

          EXPECTED_SHA="$(
            echo "$BODY" |
            sed -n 's/^SHA256=//p' |
            head -n1
          )"

          if [ -z "$GENERATION" ]; then
            echo "ℹ️ Release exists but has no valid generation — starting fresh."
            exit 0
          fi

          echo "📦 Restoring generation: $GENERATION"

          mkdir -p "$RUNNER_TEMP/state-parts"

          rm -f "$RUNNER_TEMP/state-parts"/* 2>/dev/null || true

          echo "$RELEASE_JSON" |
          jq -r --arg prefix "state-${GENERATION}-" '
            .assets[]
            | select(.name | startswith($prefix))
            | .name
          ' |
          sort |
          while read -r ASSET; do

            [ -z "$ASSET" ] && continue

            echo "⬇️ Downloading: $ASSET"

            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET" \
              --dir "$RUNNER_TEMP/state-parts" \
              --clobber || echo "⚠️ Failed to download $ASSET"

          done

          PARTS="$(
            find "$RUNNER_TEMP/state-parts" \
              -type f \
              -name "state-${GENERATION}-*.part" |
            sort
          )"

          if [ -z "$PARTS" ]; then
            echo "⚠️ No state parts found for generation $GENERATION — starting fresh."
            exit 0
          fi

          echo "🔗 Reassembling encrypted state..."

          # shellcheck disable=SC2086
          cat $PARTS > "$RUNNER_TEMP/oc4life-restore.enc"

          echo "🔐 Decrypting..."

          if ! openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -pass env:STATE_KEY \
            -in "$RUNNER_TEMP/oc4life-restore.enc" \
            -out "$RUNNER_TEMP/oc4life-restore.tar.zst"; then

            echo "⚠️ Decryption failed (wrong OPENCODE_STATE_KEY?) — starting fresh."
            exit 0

          fi

          if [ -n "$EXPECTED_SHA" ]; then

            ACTUAL_SHA="$(
              sha256sum "$RUNNER_TEMP/oc4life-restore.tar.zst" |
              awk '{print $1}'
            )"

            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "⚠️ Checksum mismatch — starting fresh."
              echo "   expected: $EXPECTED_SHA"
              echo "   actual:   $ACTUAL_SHA"
              exit 0
            fi

            echo "✅ Archive checksum verified."

          fi

          SUDO=""
          sudo -n true 2>/dev/null && SUDO="sudo"

          echo "📦 Extracting full state to / ..."

          # --------------------------------------------------------
          # Decompress FIRST, then extract.
          #
          # The 4Life archive captures the runner's own zstd binary
          # (/usr/local/bin/zstd) through the system-dir delta. If tar
          # decompresses on the fly (`tar --zstd`), it spawns zstd and
          # then tries to overwrite that very executable while it is
          # still running, which fails with:
          #
          #   tar: usr/local/bin/zstd: Cannot open: Text file busy
          #   tar: Exiting with failure status due to previous errors
          #
          # (ETXTBSY) and aborts the whole restore with exit code 2.
          # Decompressing first lets zstd exit before tar writes
          # anything, so the busy file is gone by extraction time.
          # --------------------------------------------------------

          PLAIN_TAR="$RUNNER_TEMP/oc4life-restore.tar"

          rm -f "$PLAIN_TAR"

          if ! zstd -q -d -f \
            "$RUNNER_TEMP/oc4life-restore.tar.zst" \
            -o "$PLAIN_TAR"; then

            echo "⚠️ Decompression failed — starting fresh."
            exit 0

          fi

          # Extraction must never abort the whole job with a fatal
          # exit code if an odd file cannot be written; the session can
          # still run with the (partially) restored state.
          if ! $SUDO tar \
            -xpf "$PLAIN_TAR" \
            -C / \
            --overwrite \
            --transform="s|^home/[^/]*|home/$(id -un)|"; then

            echo "⚠️ tar reported errors while extracting — continuing with the files it managed to restore."

          fi

          # Replace the live DB with the consistent snapshot that was
          # stored inside the archive.

          DB_PATH="${OPENCODE_DB_PATH:-$HOME/.local/share/opencode/opencode.db}"
          DB_SNAP="${DB_PATH}.snapshot"

          if [ -f "$DB_SNAP" ]; then

            rm -f \
              "$DB_PATH" \
              "$DB_PATH-wal" \
              "$DB_PATH-shm" \
              2>/dev/null || true

            mv -f "$DB_SNAP" "$DB_PATH"

            echo "✅ Consistent OpenCode database restored."

          fi

          # v2 service registration is machine/run specific (pid, url,
          # generated password). Never carry a stale one into the new
          # runner; the foreground `opencode serve` below is the only
          # server this workflow uses.
          rm -f \
            "${OPENCODE_STATE_DIR:-$HOME/.local/state/opencode}/service.json" \
            "${OPENCODE_CONFIG_DIR:-$HOME/.config/opencode}/service.json" \
            2>/dev/null || true

          rm -f \
            "$RUNNER_TEMP/oc4life-restore.enc" \
            "$RUNNER_TEMP/oc4life-restore.tar.zst" \
            "$RUNNER_TEMP/oc4life-restore.tar" \
            2>/dev/null || true

          echo "✅ OpenCode 4Life state restored."

      # ============================================================
      # 8. Restore extra system tools (diff only)
      #
      # We compare the saved manifests against the fresh runner and
      # install ONLY what is missing, so base image packages are not
      # reinstalled on every run.
      # ============================================================

      - name: 📦 Restore extra tools & packages
        if: ${{ github.event.inputs.restore_system_packages == 'true' }}
        run: |
          set -uo pipefail

          MAN="$HOME/.opencode-persistence/manifests"

          if [ ! -d "$MAN" ]; then
            echo "ℹ️ No saved package manifests — nothing to restore."
            exit 0
          fi

          SUDO=""
          sudo -n true 2>/dev/null && SUDO="sudo"

          # --------------------------------------------------------
          # apt packages (diff only)
          # --------------------------------------------------------

          echo "🔧 apt packages (missing only)..."

          if [ -f "$MAN/dpkg-selections.txt" ]; then

            cur="$(dpkg --get-selections 2>/dev/null | awk '$2=="install"{print $1}' | sort -u)"
            sav="$(awk '$2=="install"{print $1}' "$MAN/dpkg-selections.txt" | sort -u)"
            extra="$(comm -23 <(printf '%s\n' "$sav") <(printf '%s\n' "$cur") || true)"

            if [ -n "$extra" ]; then
              # shellcheck disable=SC2086
              $SUDO apt-get install -y -qq $extra 2>&1 | tail -n 20 || true
            else
              echo "  ✓ no extra apt packages."
            fi

          fi

          # --------------------------------------------------------
          # pip user packages (diff only)
          # --------------------------------------------------------

          echo "🐍 pip user packages (missing only)..."

          if [ -f "$MAN/pip-user.txt" ] && command -v python3 >/dev/null 2>&1; then

            cur="$(python3 -m pip list --user --format=freeze 2>/dev/null | cut -d= -f1 | tr '[:upper:]' '[:lower:]' | sort -u)"
            sav="$(cut -d= -f1 "$MAN/pip-user.txt" | tr '[:upper:]' '[:lower:]' | sort -u)"
            extra="$(comm -23 <(printf '%s\n' "$sav") <(printf '%s\n' "$cur") || true)"

            if [ -n "$extra" ]; then
              # shellcheck disable=SC2086
              python3 -m pip install --user -q $extra 2>&1 | tail -n 10 || true
            else
              echo "  ✓ no extra pip packages."
            fi

          fi

          # --------------------------------------------------------
          # npm global packages (diff only)
          # --------------------------------------------------------

          echo "📦 npm global packages (missing only)..."

          if [ -f "$MAN/npm-global.txt" ] && command -v npm >/dev/null 2>&1; then

            cur="$(npm ls -g --depth=0 --parseable 2>/dev/null | sed 's#.*/##' | grep -v '^$' | sort -u)"
            sav="$(sort -u "$MAN/npm-global.txt")"
            extra="$(comm -23 <(printf '%s\n' "$sav") <(printf '%s\n' "$cur") || true)"

            if [ -n "$extra" ]; then
              mapfile -t _pkgs <<< "$extra"
              npm install -g "${_pkgs[@]}" 2>&1 | tail -n 10 || true
            else
              echo "  ✓ no extra npm packages."
            fi

          fi

          echo "✅ Tool restoration finished."

      # ============================================================
      # 9. Verify restored state
      #
      # v2 has no direct-DB session listing CLI: `opencode session
      # list` needs a running server (and would auto-start the shared
      # background service). We inspect the SQLite database directly
      # instead, so this step stays read-only and never starts or
      # stops any server.
      # ============================================================

      - name: 🧠 Verify OpenCode state
        run: |
          set +e

          export PATH="$HOME/.opencode/bin:$PATH"

          DB_PATH="${OPENCODE_DB_PATH:-$HOME/.local/share/opencode/opencode.db}"
          DATA_DIR="${OPENCODE_DATA_DIR:-$HOME/.local/share/opencode}"
          TOOL_OUTPUT_DIR="$DATA_DIR/tool-output"

          echo "Database:"
          echo "$DB_PATH"

          if [ -f "$DB_PATH" ]; then
            echo "✅ Database found."
            ls -lh "$DB_PATH"

            echo ""
            echo "===== DB integrity ====="
            sqlite3 "$DB_PATH" "PRAGMA quick_check;" 2>&1 || true

            echo ""
            echo "===== Restored row counts ====="
            for tbl in session_v2 session session_message message part todo project; do
              COUNT="$(sqlite3 "$DB_PATH" "SELECT count(*) FROM $tbl;" 2>/dev/null)"
              if [ -n "${COUNT:-}" ]; then
                echo "$tbl: $COUNT"
              fi
            done
          else
            echo "ℹ️ No previous database."
          fi

          echo ""
          echo "===== Restored tool-output files ====="
          find "$TOOL_OUTPUT_DIR" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l || true

          echo ""
          echo "===== v2 paths ====="
          opencode debug paths 2>&1 || true

      # ============================================================
      # 10. Prepare project OpenCode v2 configuration
      #
      # The inline OPENCODE_CONFIG_CONTENT (job env) already grants
      # the full v2 permission ruleset for every run. This step only
      # creates a sensible project config when the repository has
      # none, using the v2 `permissions` array (not the deprecated v1
      # `permission` object). An existing project config is left
      # untouched; v2 automatically maps legacy v1 keys.
      # ============================================================

      - name: 📝 Prepare OpenCode v2 configuration
        run: |
          set -euo pipefail

          if [ ! -f "opencode.json" ] &&
             [ ! -f "opencode.jsonc" ] &&
             [ ! -f ".opencode/opencode.json" ] &&
             [ ! -f ".opencode/opencode.jsonc" ]; then

            cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "update": "disable",
            "share": "disabled",
            "permissions": [
              { "action": "*", "resource": "*", "effect": "allow" },
              { "action": "read", "resource": "*.env", "effect": "allow" },
              { "action": "read", "resource": "*.env.*", "effect": "allow" },
              { "action": "read", "resource": "*.env.example", "effect": "allow" }
            ]
          }
          JSON

            echo "Created default v2 opencode.json."

          else

            echo "Using existing OpenCode configuration (v2 maps legacy keys automatically)."

          fi

      # ============================================================
      # 11. Cloudflare
      # ============================================================

      - name: ☁️ Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      # ============================================================
      # 12. Start OpenCode v2 server (internal only)
      #
      # v2 ships a single `opencode serve` command (it serves both
      # the API and the web UI); there is no `opencode web`. The v2
      # process keeps its fixed internal basic-auth username
      # `opencode` and a random internal password. It listens only
      # on loopback so the public login is enforced by nginx below.
      # Readiness is verified against authenticated `/api/info`.
      # ============================================================

      - name: 🚀 Start OpenCode v2 server
        timeout-minutes: 5
        run: |
          set -euo pipefail

          : "${OPENCODE_WEB_USERNAME:?OPENCODE_WEB_USERNAME secret is required}"
          : "${OPENCODE_WEB_PASSWORD:?OPENCODE_WEB_PASSWORD secret is required}"

          export PATH="$HOME/.opencode/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/opencode-logs"

          LOG_FILE="$RUNNER_TEMP/opencode-logs/server.log"

          : > "$LOG_FILE"

          if ! opencode serve --help >/dev/null 2>&1; then
            echo "❌ 'opencode serve' is not available — is this really OpenCode v2?"
            opencode --help || true
            exit 1
          fi

          # Random internal password for the loopback v2 process.
          # It is never shown in the summary or logs; only nginx uses
          # it when forwarding authenticated requests.
          INTERNAL_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"

          export OPENCODE_SERVER_PASSWORD="$INTERNAL_PASSWORD"
          export OPENCODE_SERVER_USERNAME="opencode"

          echo "OPENCODE_SERVER_PASSWORD=$INTERNAL_PASSWORD" >> "$GITHUB_ENV"

          echo "🚀 Starting OpenCode v2 on 127.0.0.1:4096"

          setsid bash -c \
            "opencode serve \
              --hostname 127.0.0.1 \
              --port 4096 \
              </dev/null \
              >>'$LOG_FILE' 2>&1" &

          PID=$!

          echo "$PID" > "$RUNNER_TEMP/opencode.pid"

          disown || true

          echo "OpenCode PID=$PID"

          UP=0
          LAST_CODE="000"

          for _ in $(seq 1 120); do

            LAST_CODE="$(
              curl \
                -s \
                -o /dev/null \
                --max-time 2 \
                -u "opencode:${INTERNAL_PASSWORD}" \
                -w '%{http_code}' \
                http://127.0.0.1:4096/api/info \
                2>/dev/null || echo '000'
            )"

            if [ "$LAST_CODE" = "200" ]; then

              UP=1

              echo "✅ OpenCode v2 server is ready (HTTP 200 on /api/info)."

              break

            fi

            if ! kill -0 "$PID" 2>/dev/null; then

              echo "❌ OpenCode v2 server exited."

              cat "$LOG_FILE" || true

              exit 1

            fi

            sleep 1

          done

          if [ "$UP" -ne 1 ]; then

            echo "❌ OpenCode v2 server did not become ready (last HTTP $LAST_CODE)."

            tail -n 200 "$LOG_FILE" || true

            exit 1

          fi

          # Store server info for diagnostics/summary (best effort).
          curl -fsS \
            -u "opencode:${INTERNAL_PASSWORD}" \
            --max-time 5 \
            http://127.0.0.1:4096/api/info \
            > "$RUNNER_TEMP/opencode-logs/server-info.json" 2>/dev/null || true

      # ============================================================
      # 13. Public login reverse proxy (same behavior as v1)
      #
      # v2 hard-codes the basic-auth username to `opencode`, so a
      # tiny nginx proxy in front of it enforces the v1-style
      # OPENCODE_WEB_USERNAME / OPENCODE_WEB_PASSWORD secrets and
      # rewrites the upstream Authorization header to the internal
      # v2 credentials. Browser login therefore looks exactly like
      # the old workflow, and the public credentials never appear in
      # the summary. WebSocket/SSE traffic is forwarded as-is.
      # ============================================================

      - name: 🛡️ Start public login proxy
        timeout-minutes: 3
        run: |
          set -euo pipefail

          : "${OPENCODE_WEB_USERNAME:?OPENCODE_WEB_USERNAME secret is required}"
          : "${OPENCODE_WEB_PASSWORD:?OPENCODE_WEB_PASSWORD secret is required}"
          : "${OPENCODE_SERVER_PASSWORD:?internal OpenCode password is missing}"

          PROXY_PORT=8080
          PROXY_LOG="$RUNNER_TEMP/opencode-logs/proxy.log"
          HTPASSWD="$RUNNER_TEMP/opencode-proxy.htpasswd"
          NGINX_CONF="$RUNNER_TEMP/opencode-proxy.conf"

          : > "$PROXY_LOG"

          # Nginx supports the apr1 hash produced by OpenSSL, so no
          # extra apache2-utils dependency is needed.
          HASH="$(openssl passwd -apr1 "$OPENCODE_WEB_PASSWORD")"
          printf '%s:%s\n' "$OPENCODE_WEB_USERNAME" "$HASH" > "$HTPASSWD"
          chmod 600 "$HTPASSWD"

          INTERNAL_AUTH="$(
            printf 'opencode:%s' "$OPENCODE_SERVER_PASSWORD" |
            base64 -w0
          )"

          cat > "$NGINX_CONF" <<EOF
          user $(id -un);
          worker_processes 1;
          pid $RUNNER_TEMP/opencode-proxy.pid;
          error_log stderr warn;

          events {
            worker_connections 1024;
          }

          http {
            access_log off;

            map \$http_upgrade \$connection_upgrade {
              default upgrade;
              ''      close;
            }

            server {
              listen 127.0.0.1:$PROXY_PORT;
              server_name _;

              auth_basic "OpenCode";
              auth_basic_user_file $HTPASSWD;

              location / {
                proxy_pass http://127.0.0.1:4096;
                proxy_http_version 1.1;

                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection \$connection_upgrade;

                # Replace the public login with the internal v2 auth.
                proxy_set_header Authorization "Basic $INTERNAL_AUTH";

                proxy_buffering off;
                proxy_cache off;
                proxy_connect_timeout 10s;
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
              }
            }
          }
          EOF

          sudo nginx -t -c "$NGINX_CONF"

          setsid sudo nginx \
            -c "$NGINX_CONF" \
            -g 'daemon off;' \
            </dev/null \
            >> "$PROXY_LOG" 2>&1 &

          PID=$!

          echo "$PID" > "$RUNNER_TEMP/nginx.pid"

          disown || true

          echo "Proxy PID=$PID"

          UP=0
          LAST_CODE="000"

          for _ in $(seq 1 30); do

            LAST_CODE="$(
              curl \
                -s \
                -o /dev/null \
                --max-time 2 \
                -u "${OPENCODE_WEB_USERNAME}:${OPENCODE_WEB_PASSWORD}" \
                -w '%{http_code}' \
                http://127.0.0.1:${PROXY_PORT}/api/info \
                2>/dev/null || echo '000'
            )"

            if [ "$LAST_CODE" = "200" ]; then
              UP=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "❌ nginx proxy exited."
              cat "$PROXY_LOG" || true
              exit 1
            fi

            sleep 1

          done

          if [ "$UP" -ne 1 ]; then
            echo "❌ Public login proxy did not become ready (last HTTP $LAST_CODE)."
            cat "$PROXY_LOG" || true
            exit 1
          fi

          UNAUTH_CODE="$(
            curl \
              -s \
              -o /dev/null \
              --max-time 2 \
              -w '%{http_code}' \
              http://127.0.0.1:${PROXY_PORT}/api/info \
              2>/dev/null || echo '000'
          )"

          if [ "$UNAUTH_CODE" = "401" ]; then
            echo "✅ Public login proxy is ready; unauthenticated requests receive 401."
          else
            echo "❌ Unexpected unauthenticated response: $UNAUTH_CODE"
            exit 1
          fi

      # ============================================================
      # 13. Cloudflare Tunnel
      # ============================================================

      - name: 🌐 Start Cloudflare Tunnel
        id: tunnel
        timeout-minutes: 3
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/cloudflared-logs"

          LOG_FILE="$RUNNER_TEMP/cloudflared-logs/tunnel.log"

          : > "$LOG_FILE"

          echo "🌐 Starting Cloudflare Tunnel..."

          setsid bash -c \
            "cloudflared tunnel \
              --no-autoupdate \
              --url http://127.0.0.1:8080 \
              </dev/null \
              >>'$LOG_FILE' 2>&1" &

          PID=$!

          echo "$PID" > "$RUNNER_TEMP/cloudflared.pid"

          disown || true

          PUBLIC_URL=""

          for _ in $(seq 1 90); do

            PUBLIC_URL="$(
              grep -Eo \
              'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
              "$LOG_FILE" |
              head -n1 || true
            )"

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then

              echo "❌ Cloudflare exited."

              cat "$LOG_FILE" || true

              exit 1

            fi

            sleep 1

          done

          if [ -z "$PUBLIC_URL" ]; then

            echo "❌ Could not obtain Cloudflare URL."

            cat "$LOG_FILE" || true

            exit 1

          fi

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

          # Best-effort end-to-end check through the tunnel. The public
          # login uses OPENCODE_WEB_USERNAME/PASSWORD enforced by nginx;
          # the job must never print them.
          TUNNEL_OK=0
          for _ in $(seq 1 15); do
            TUNNEL_CODE="$(
              curl -s \
                -o /dev/null \
                --max-time 5 \
                -u "${OPENCODE_WEB_USERNAME}:${OPENCODE_WEB_PASSWORD}" \
                -w '%{http_code}' \
                "$PUBLIC_URL/api/info" \
                2>/dev/null || echo '000'
            )"
            if [ "$TUNNEL_CODE" = "200" ]; then
              TUNNEL_OK=1
              break
            fi
            sleep 1
          done

          if [ "$TUNNEL_OK" -eq 1 ]; then
            echo "✅ Public v2 login verified through the Cloudflare tunnel."
          else
            echo "⚠️ Tunnel is up but the public login has not returned 200 yet."
          fi

          echo "=============================================="
          echo "🧬 OpenCode v2 4Life Web is LIVE"
          echo ""
          echo "$PUBLIC_URL"
          echo "=============================================="

      # ============================================================
      # 14. GitHub Summary
      # ============================================================

      - name: 📌 Publish OpenCode v2 URL
        run: |
          {
            echo "# 🧬 OpenCode v2 — 4Life Full Persistence"
            echo ""
            echo "## 🌐 Web Interface"
            echo ""
            echo "### [$PUBLIC_URL]($PUBLIC_URL)"
            echo ""
            echo "- Login: protected by the \`OPENCODE_WEB_USERNAME\` / \`OPENCODE_WEB_PASSWORD\` repository secrets (same as the v1 workflow)."
            echo "- Credentials are never printed here for security."
            echo ""
            echo "## 📦 Persistence"
            echo ""
            echo "- Release: \`$PERSIST_RELEASE_TAG\`"
            echo "- Full \$HOME + extra roots (\`$PERSIST_EXTRA_PATHS\`)"
            echo "- v2 paths: data / config / cache / state / log / repos / db"
            echo "- Consistent SQLite snapshot of all sessions/messages"
            echo "- Stale v2 service registration is never restored"
            echo "- Tools, jars, downloads, caches and tmp are preserved"
            echo ""
            echo "## 📁 Repository"
            echo ""
            echo "\`$GITHUB_REPOSITORY\`"
            echo ""
            echo "## 🌿 Branch"
            echo ""
            echo "\`$GITHUB_REF_NAME\`"
            echo ""
            echo "## ⏱️ Duration"
            echo ""
            echo "${{ github.event.inputs.duration_minutes }} minutes"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 15. Auto commit / push
      # ============================================================

      - name: 🔁 Start Git auto-commit
        if: ${{ github.event.inputs.auto_commit == 'true' }}
        run: |
          set -euo pipefail

          git config --global user.email \
            "opencode-bot@users.noreply.github.com"

          git config --global user.name \
            "opencode-bot"

          INTERVAL="${{ github.event.inputs.commit_interval_seconds }}"

          LOG_FILE="$RUNNER_TEMP/autocommit.log"

          : > "$LOG_FILE"

          cat > "$RUNNER_TEMP/autocommit.sh" <<'SCRIPT'
          #!/usr/bin/env bash

          set -u

          cd "$GITHUB_WORKSPACE"

          while true; do

            sleep "$INTERVAL"

            if [ -n "$(git status --porcelain)" ]; then

              git add -A

              MSG="🤖 opencode: auto-commit $(date -u +'%Y-%m-%d %H:%M:%SZ')"

              git commit \
                -m "$MSG" \
                >> "$LOG_FILE" 2>&1 || true

              git push \
                origin "$GITHUB_REF_NAME" \
                >> "$LOG_FILE" 2>&1 || true

            fi

          done
          SCRIPT

          chmod +x "$RUNNER_TEMP/autocommit.sh"

          export INTERVAL
          export LOG_FILE

          setsid bash \
            "$RUNNER_TEMP/autocommit.sh" \
            </dev/null \
            >> "$LOG_FILE" 2>&1 &

          echo "$!" > "$RUNNER_TEMP/autocommit.pid"

          echo "✅ Auto-commit started."

      # ============================================================
      # 16. Persistent 4Life backup service
      # ============================================================

      - name: 💾 Prepare persistent 4Life backup service
        env:
          STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${STATE_KEY:-}" ]; then
            echo "⚠️ OPENCODE_STATE_KEY is not configured — persistent backup disabled."
            exit 0
          fi

          BACKUP_INTERVAL="${{ github.event.inputs.backup_interval_minutes }}"

          BACKUP_SECONDS=$((BACKUP_INTERVAL * 60))

          cat > "$RUNNER_TEMP/backup-opencode4life.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          #
          # 4Life full-state backup service.
          # Serialises every backup with flock so the periodic loop and
          # the final on-cancel backup can never run at the same time.

          set -uo pipefail

          export PATH="$HOME/.opencode/bin:$PATH"

          RELEASE_TAG="${PERSIST_RELEASE_TAG:-opencode-mehdigm4life-v2-state}"

          DATA_DIR="${OPENCODE_DATA_DIR:-$HOME/.local/share/opencode}"
          CONFIG_DIR="${OPENCODE_CONFIG_DIR:-$HOME/.config/opencode}"
          STATE_DIR="${OPENCODE_STATE_DIR:-$HOME/.local/state/opencode}"
          CACHE_DIR="${OPENCODE_CACHE_DIR:-$HOME/.cache/opencode}"
          DB_PATH="${OPENCODE_DB_PATH:-$DATA_DIR/opencode.db}"

          HOME_REL="${HOME#/}"
          RUNNER_TEMP_REL="${RUNNER_TEMP#/}"
          CONFIG_REL="${CONFIG_DIR#/}"
          STATE_REL="${STATE_DIR#/}"

          PERSIST_DIR="$HOME/.opencode-persistence"
          MANIFEST_DIR="$PERSIST_DIR/manifests"

          INCLUDE_CREDENTIALS="${PERSIST_INCLUDE_CREDENTIALS:-false}"
          BACKUP_SECONDS="${BACKUP_SECONDS:-600}"
          EXTRA_PATHS="${PERSIST_EXTRA_PATHS:-/opt /tmp}"
          EXTRA_EXCLUDES="${PERSIST_EXTRA_EXCLUDES:-}"

          SYS_CAPTURE_DIRS="${SYS_CAPTURE_DIRS:-${PERSIST_SYSTEM_DIRS:-/usr/local /usr/bin /usr/sbin /usr/share /root /etc/profile.d /etc/environment}}"
          SYS_BASELINE_DIR="${SYS_BASELINE_DIR:-}"
          SYS_DELTA_LIST="${SYS_DELTA_LIST:-$RUNNER_TEMP/oc4life-system-delta.list}"

          ARCHIVE="$RUNNER_TEMP/oc4life-state.tar.zst"
          ENC="$RUNNER_TEMP/oc4life-state.enc"
          TAR_LOG="$RUNNER_TEMP/oc4life-tar.log"
          LOCK_FILE="$RUNNER_TEMP/oc4life-backup.lock"

          log() {
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"
          }

          # --------------------------------------------------------
          # Package manifests (saved inside $HOME so they are part of
          # the archive and available on the next run).
          # --------------------------------------------------------

          write_manifests() {

            mkdir -p "$MANIFEST_DIR"

            dpkg --get-selections \
              > "$MANIFEST_DIR/dpkg-selections.txt" 2>/dev/null || true

            apt-mark showmanual \
              > "$MANIFEST_DIR/apt-manual.txt" 2>/dev/null || true

            if command -v python3 >/dev/null 2>&1; then
              python3 -m pip list --user --format=freeze \
                > "$MANIFEST_DIR/pip-user.txt" 2>/dev/null || true
              python3 -m pip list --format=freeze \
                > "$MANIFEST_DIR/pip-system.txt" 2>/dev/null || true
            fi

            if command -v npm >/dev/null 2>&1; then
              npm ls -g --depth=0 --parseable 2>/dev/null |
                sed 's#.*/##' |
                grep -v '^$' \
                > "$MANIFEST_DIR/npm-global.txt" || true
            fi

            if command -v gem >/dev/null 2>&1; then
              gem list --no-versions \
                > "$MANIFEST_DIR/gem-list.txt" 2>/dev/null || true
            fi

            if command -v cargo >/dev/null 2>&1; then
              cargo install --list 2>/dev/null |
                sed -n 's/^\([^ ]*\) .*/\1/p' \
                > "$MANIFEST_DIR/cargo-crates.txt" || true
            fi

            {
              echo "HOME=$HOME"
              echo "USER=$(id -un)"
              echo "PATH=$PATH"
            } > "$MANIFEST_DIR/env-info.txt"

          }

          # --------------------------------------------------------
          # Consistent SQLite snapshot (never copy a live WAL DB).
          # --------------------------------------------------------

          make_db_snapshot() {

            if [ "$DB_PATH" = ":memory:" ] || [ ! -f "$DB_PATH" ]; then
              return 0
            fi

            rm -f "$DB_PATH.snapshot"

            if ! sqlite3 "$DB_PATH" ".backup '$DB_PATH.snapshot'"; then
              log "⚠️ sqlite3 backup failed — live DB will be archived as-is."
              rm -f "$DB_PATH.snapshot"
              return 0
            fi

            if [ "$INCLUDE_CREDENTIALS" != "true" ]; then
              for t in account control_account credential account_state; do
                sqlite3 "$DB_PATH.snapshot" "DELETE FROM $t;" \
                  >/dev/null 2>&1 || true
              done
            fi

            touch -r "$DB_PATH" "$DB_PATH.snapshot" 2>/dev/null || true

          }

          # --------------------------------------------------------
          # Upload a finished encrypted blob as generation parts.
          # --------------------------------------------------------

          prune_old_generations() {

            CURRENT="$1"

            RID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                --jq '.id' 2>/dev/null || true
            )"

            [ -z "$RID" ] && return 0

            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" \
              --paginate 2>/dev/null |
            jq -r --arg current "$CURRENT" '
              .[]
              | select(
                  (.name | startswith("state-"))
                  and
                  (.name | startswith("state-\($current)-") | not)
                )
              | .id
            ' |
            while read -r ASSET_ID; do

              [ -z "$ASSET_ID" ] && continue

              log "🗑️ Removing old asset $ASSET_ID"

              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
                >/dev/null 2>&1 || true

            done

          }

          upload_backup() {

            SRC="$1"

            GENERATION="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${RANDOM}"

            PREFIX="state-${GENERATION}-"

            UPLOAD_DIR="$RUNNER_TEMP/oc4life-upload-${GENERATION}"

            rm -rf "$UPLOAD_DIR"
            mkdir -p "$UPLOAD_DIR"

            SHA256="${ARCHIVE_SHA:-}"

            # GitHub release assets must be < 2 GiB. 1900 MiB is safe.
            split -b 1900M -d -a 4 "$SRC" "$UPLOAD_DIR/$PREFIX"

            INDEX=0

            for FILE in "$UPLOAD_DIR/$PREFIX"*; do
              NEW_NAME="$UPLOAD_DIR/${PREFIX}$(printf '%04d' "$INDEX").part"
              mv "$FILE" "$NEW_NAME"
              INDEX=$((INDEX + 1))
            done

            if ! gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "🧬 OpenCode 4Life Persistent State" \
                --notes "CURRENT_GENERATION=${GENERATION}" \
                --latest=false

            fi

            for FILE in "$UPLOAD_DIR/${PREFIX}"*.part; do

              [ -e "$FILE" ] || continue

              log "⬆️ Uploading $(basename "$FILE")"

              gh release upload \
                "$RELEASE_TAG" \
                "$FILE" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber

            done

            # Publish only after ALL parts uploaded successfully, and
            # store the plaintext checksum for integrity verification.

            gh release edit \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes "$(printf 'CURRENT_GENERATION=%s\nSHA256=%s' "$GENERATION" "$SHA256")"

            prune_old_generations "$GENERATION"

            rm -rf "$UPLOAD_DIR"

            log "✅ State persisted (generation $GENERATION)."

          }

          # --------------------------------------------------------
          # Build a file list of everything the agent added to the
          # system dirs (present now, absent from the fresh baseline).
          # This is what makes manual installs into /usr/local/bin,
          # /usr/bin, /usr/share, ... survive across runs cheaply.
          # --------------------------------------------------------

          build_system_delta() {

            : > "$SYS_DELTA_LIST"

            if [ -z "${SYS_BASELINE_DIR:-}" ] || [ ! -d "$SYS_BASELINE_DIR" ]; then
              log "ℹ️ No system baseline — skipping system delta."
              return 0
            fi

            for d in $SYS_CAPTURE_DIRS; do

              [ -e "$d" ] || continue

              key="$(printf '%s' "$d" | sed 's#^/##; s#/#_#g')"
              base="$SYS_BASELINE_DIR/$key.list"

              # Without a baseline for this dir we cannot compute a safe
              # delta (we would archive the entire base image), so skip.
              [ -f "$base" ] || continue

              rel="${d#/}"

              ( cd / && find "$rel" -printf '%p\t%s\t%T@\n' 2>/dev/null | LC_ALL=C sort ) |
                LC_ALL=C comm -23 - "$base" |
                cut -f1 >> "$SYS_DELTA_LIST" || true

            done

            log "🧭 System delta entries: $(wc -l < "$SYS_DELTA_LIST" | tr -d ' ')"

          }

          # --------------------------------------------------------
          # Full backup
          # --------------------------------------------------------

          create_backup() {

            log "=============================================="
            log "💾 Creating full 4Life backup"
            log "=============================================="

            if [ -z "${STATE_KEY:-}" ]; then
              log "⚠️ STATE_KEY missing — aborting backup."
              return 1
            fi

            write_manifests

            rm -f "$DB_PATH.snapshot"
            make_db_snapshot

            EXCLUDES=()

            add_ex() {
              EXCLUDES+=("--exclude=$1")
            }

            # Home / runner internals
            add_ex "$HOME_REL/work"
            add_ex "$HOME_REL/actions-runner"

            # Freshly installed binary (restored from upstream each run)
            add_ex "$HOME_REL/.opencode"

            # Defensive: never archive our own work dir
            [ -n "$RUNNER_TEMP_REL" ] && add_ex "$RUNNER_TEMP_REL"

            # Stale v2 service registration (pid/url/password are
            # runner-specific and must never be restored)
            add_ex "$STATE_REL/service.json"
            add_ex "$CONFIG_REL/service.json"

            # Stale locks
            add_ex "$STATE_REL/locks"

            # Live (inconsistent) DB files — the .snapshot is included
            if [ "$DB_PATH" != ":memory:" ]; then
              DB_REL="${DB_PATH#/}"
              add_ex "$DB_REL"
              add_ex "$DB_REL-wal"
              add_ex "$DB_REL-shm"
            fi

            # Volatile /tmp internals
            add_ex "tmp/.X11-unix"
            add_ex "tmp/.ICE-unix"
            add_ex "tmp/.XIM-unix"
            add_ex "tmp/.font-unix"
            add_ex "tmp/.Test-unix"
            add_ex "tmp/systemd-private-*"
            add_ex "tmp/snap-private-tmp"
            add_ex "tmp/v8-compile-cache-*"
            add_ex "tmp/clr-debug-pipe-*"
            add_ex "tmp/dotnet-diagnostic-*"
            add_ex "tmp/.bcddfd3fbf8dfb7f-*"

            if [ "$INCLUDE_CREDENTIALS" != "true" ]; then
              add_ex "$HOME_REL/.ssh"
              add_ex "$HOME_REL/.netrc"
              add_ex "$HOME_REL/.git-credentials"
              add_ex "$HOME_REL/.npmrc"
              add_ex "$HOME_REL/.docker/config.json"
              add_ex "$HOME_REL/.config/gh"
              add_ex "$HOME_REL/.config/gcloud"
              add_ex "$HOME_REL/.aws"
              add_ex "$HOME_REL/.kube"
              add_ex "$CONFIG_REL/auth.json"
              add_ex "$HOME_REL/.local/share/opencode/auth.json"
            fi

            for e in $EXTRA_EXCLUDES; do
              add_ex "${e#/}"
            done

            ROOTS=("$HOME_REL")

            for p in $EXTRA_PATHS; do
              r="${p#/}"
              if [ -e "/$r" ]; then
                ROOTS+=("$r")
              fi
            done

            rm -f "$ARCHIVE" "$ENC"
            : > "$TAR_LOG"

            build_system_delta

            log "📁 roots: ${ROOTS[*]}"

            SUDO=""
            sudo -n true 2>/dev/null && SUDO="sudo"

            $SUDO tar -cf - \
              --warning=no-file-changed \
              --ignore-failed-read \
              "${EXCLUDES[@]}" \
              -C / \
              --files-from="$SYS_DELTA_LIST" \
              "${ROOTS[@]}" \
              2>> "$TAR_LOG" | zstd -q -T0 > "$ARCHIVE"

            _rc=("${PIPESTATUS[@]}")
            TAR_RC=${_rc[0]}
            ZSTD_RC=${_rc[1]}

            rm -f "$DB_PATH.snapshot" 2>/dev/null || true

            if [ "$TAR_RC" -gt 1 ] || [ "$ZSTD_RC" -ne 0 ]; then
              log "❌ Archive creation failed (tar=$TAR_RC zstd=$ZSTD_RC)."
              tail -n 40 "$TAR_LOG" || true
              return 1
            fi

            if [ ! -s "$ARCHIVE" ]; then
              log "❌ Archive is empty."
              return 1
            fi

            log "📦 archive: $(du -h "$ARCHIVE" | cut -f1)"

            ARCHIVE_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

            if ! openssl enc \
              -aes-256-cbc \
              -pbkdf2 \
              -iter 200000 \
              -pass env:STATE_KEY \
              -in "$ARCHIVE" \
              -out "$ENC"; then

              log "❌ Encryption failed."
              return 1

            fi

            rm -f "$ARCHIVE"

            upload_backup "$ENC"

          }

          with_lock() {
            (
              exec 9>"$LOCK_FILE"
              flock 9
              "$@"
            )
          }

          final_backup_on_term() {

            log "🛑 Shutdown signal — running final 4Life backup..."

            with_lock create_backup || true

            exit 0

          }

          # --------------------------------------------------------
          # Entry point
          # --------------------------------------------------------

          if [ "${1:-}" = "--once" ]; then
            with_lock create_backup || true
            exit 0
          fi

          trap final_backup_on_term TERM INT HUP

          while true; do

            sleep "$BACKUP_SECONDS" &
            SLEEP_PID=$!
            wait "$SLEEP_PID" 2>/dev/null || true

            with_lock create_backup || true

          done
          SCRIPT

          chmod +x "$RUNNER_TEMP/backup-opencode4life.sh"

          export STATE_KEY
          export BACKUP_SECONDS

          setsid bash \
            "$RUNNER_TEMP/backup-opencode4life.sh" \
            </dev/null \
            >> "$RUNNER_TEMP/opencode-backup.log" 2>&1 &

          echo "$!" > "$RUNNER_TEMP/opencode-backup.pid"

          echo "💾 4Life backup service started."
          echo "⏱️ Interval: ${BACKUP_INTERVAL} minutes."

      # ============================================================
      # 17. Keep session alive
      # ============================================================

      - name: ⏳ Keep OpenCode alive
        run: |
          set -euo pipefail

          shutdown_final_backup() {

            echo ""
            echo "=============================================="
            echo "🛑 Session cancelled — final 4Life backup..."
            echo "=============================================="

            BPID="$(cat "$RUNNER_TEMP/opencode-backup.pid" 2>/dev/null || true)"

            if [ -n "${BPID:-}" ] && kill -0 "$BPID" 2>/dev/null; then

              echo "💾 Asking backup service (pid $BPID) to save final state..."

              kill -TERM "$BPID" 2>/dev/null || true

              for _ in $(seq 1 300); do

                if ! kill -0 "$BPID" 2>/dev/null; then
                  break
                fi

                sleep 1

              done

            fi

            exit 0

          }

          trap shutdown_final_backup TERM INT HUP

          DURATION_MIN="${{ github.event.inputs.duration_minutes }}"

          DURATION_SEC=$((DURATION_MIN * 60))

          ELAPSED=0

          STEP=300

          echo "=============================================="
          echo "🧬 OpenCode 4Life session started"
          echo "=============================================="
          echo ""
          echo "🌐 $PUBLIC_URL"
          echo ""
          echo "⏱️ Duration: ${DURATION_MIN} minutes"
          echo ""

          while [ "$ELAPSED" -lt "$DURATION_SEC" ]; do

            sleep "$STEP"

            ELAPSED=$((ELAPSED + STEP))

            REMAINING=$((DURATION_SEC - ELAPSED))

            if [ "$REMAINING" -lt 0 ]; then
              REMAINING=0
            fi

            echo ""
            echo "⏱️ Elapsed: $((ELAPSED / 60)) minutes"
            echo "⏳ Remaining: $((REMAINING / 60)) minutes"
            echo "🌐 $PUBLIC_URL"

            if [ -f "$RUNNER_TEMP/opencode.pid" ]; then

              PID="$(cat "$RUNNER_TEMP/opencode.pid")"

              if ! kill -0 "$PID" 2>/dev/null; then

                echo "❌ OpenCode process died."

                exit 1

              fi

            fi

            if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then

              PID="$(cat "$RUNNER_TEMP/cloudflared.pid")"

              if ! kill -0 "$PID" 2>/dev/null; then

                echo "❌ Cloudflare process died."

                exit 1

              fi

            fi

          done

          echo ""
          echo "✅ Requested session duration reached."

      # ============================================================
      # 18. Final Git commit
      # ============================================================

      - name: 💾 Final project commit and push
        if: ${{ always() && github.event.inputs.auto_commit == 'true' }}
        run: |
          set +e

          git config --global user.email \
            "opencode-bot@users.noreply.github.com"

          git config --global user.name \
            "opencode-bot"

          git add -A

          if ! git diff --cached --quiet; then

            git commit \
              -m "🤖 opencode: final auto-commit $(date -u +'%Y-%m-%d %H:%M:%SZ')"

            git push \
              origin "$GITHUB_REF_NAME"

          else

            echo "No pending project changes."

          fi

      # ============================================================
      # 19. Final state backup
      # ============================================================

      - name: 💾 Final OpenCode 4Life state backup
        if: ${{ always() }}
        env:
          STATE_KEY: ${{ secrets.OPENCODE_STATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${STATE_KEY:-}" ]; then
            echo "⚠️ OPENCODE_STATE_KEY is not configured — skipping final backup."
            exit 0
          fi

          if [ ! -x "$RUNNER_TEMP/backup-opencode4life.sh" ]; then
            echo "ℹ️ Backup service script not present — skipping final backup."
            exit 0
          fi

          echo "💾 Running final 4Life backup (--once)..."

          export STATE_KEY

          bash "$RUNNER_TEMP/backup-opencode4life.sh" --once || true

          echo "✅ Final 4Life backup done."

      # ============================================================
      # 20. Debug logs
      # ============================================================

      - name: 📜 Show logs
        if: always()
        run: |

          echo "=============================================="
          echo "===== OpenCode server log ====="
          echo "=============================================="

          tail -n 100 \
            "$RUNNER_TEMP/opencode-logs/server.log" \
            2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "===== 4Life backup log ====="
          echo "=============================================="

          tail -n 120 \
            "$RUNNER_TEMP/opencode-backup.log" \
            2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "===== tar warnings ====="
          echo "=============================================="

          tail -n 40 \
            "$RUNNER_TEMP/oc4life-tar.log" \
            2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "===== Auto commit log ====="
          echo "=============================================="

          tail -n 100 \
            "$RUNNER_TEMP/autocommit.log" \
            2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "===== Cloudflare log ====="
          echo "=============================================="

          tail -n 100 \
            "$RUNNER_TEMP/cloudflared-logs/tunnel.log" \
            2>/dev/null || true

      # ============================================================
      # 21. Cloudflare cleanup
      # ============================================================

      - name: 🧹 Shutdown cloudflared
        if: always()
        continue-on-error: true
        uses: AnimMouse/setup-cloudflared/shutdown@v2

      - name: 🧹 Shutdown public proxy
        if: always()
        continue-on-error: true
        run: |
          sudo nginx -s quit 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/nginx.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/nginx.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/nginx.pid"
          fi
          if [ -f "$RUNNER_TEMP/opencode-proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/opencode-proxy.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/opencode-proxy.pid"
          fi
          rm -f "$RUNNER_TEMP/opencode-proxy.conf" "$RUNNER_TEMP/opencode-proxy.htpasswd" 2>/dev/null || true
