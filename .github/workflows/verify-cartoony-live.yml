name: Verify Cartoony Live API and Playback

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cartoony/scripts/**'
      - '.github/workflows/verify-cartoony-live.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test Cartoony API, decryption, HLS playlist, and first segment
        run: |
          set -o pipefail
          node Cartoony/scripts/live-smoke.mjs 2>&1 | tee /tmp/cartoony-live.log

      - name: Capture live-test diagnostics
        if: failure()
        run: |
          if [ -f /tmp/cartoony-live.log ]; then
            tail -n 80 /tmp/cartoony-live.log | tee -a "$GITHUB_STEP_SUMMARY"
            details="$(tail -n 20 /tmp/cartoony-live.log | tr '\n' ' ' | cut -c1-3500)"
            echo "::error title=Cartoony live-test diagnostics::$details"
          fi
