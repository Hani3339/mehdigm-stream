      behavioral.lastY = e.clientY

    window.addEventListener('scroll', function() { behavioral.interactionCount++ })

  function updateEncUI(data) {
    var title = document.getElementById('encTitle')
    var sub = document.getElementById('encSub')
    var fill = document.getElementById('encFill')
    var pct = document.getElementById('encPct')
    var state = document.getElementById('encState')
    if (!title || !state) return

    if (data.encodingStatus === 'error') {
      showError('Encoding failed', 'Something went wrong while processing this video. Please try re-uploading.')
      return
    }

    // Check transfer state when encoding is completed
    var td = data.encodingStatus === 'completed' ? (data.transferStatus || null) : null

    if (td === 'pending' || td === 'transferring') {
      title.textContent = td === 'pending' ? 'Waiting for transfer...' : 'Transferring to storage...'
      sub.textContent = td === 'pending' ? 'File ready, waiting to upload to storage' : ''
    } else if (data.encodingStatus === 'pending') {
      title.textContent = 'Queued for encoding...'
      if (data.queuePosition > 0) {
        sub.textContent = data.queuePosition + ' video' + (data.queuePosition !== 1 ? 's' : '') + ' ahead in queue'
      } else {
        sub.textContent = ''
      }
    } else {
      title.textContent = 'Encoding video...'
      sub.textContent = ''
    }
    var progress = data.encodingProgress || 0
    fill.style.width = progress + '%'
    pct.textContent = progress + '%'
  }

  function pollEncodingStatus(video) {
    updateEncUI({ encodingStatus: video.encodingStatus, encodingProgress: video.encodingProgress || 0, transferStatus: video.transferStatus || null, queuePosition: 0 })
    var requestInFlight = false
    var interval = setInterval(function() {
      if (requestInFlight) return
      requestInFlight = true
      fetch('/api/videos/' + encodeURIComponent(slug) + '/encoding-status')
        .then(function(r) { return r.json() })
        .then(function(data) {
          updateEncUI(data)
          // Only reload when both encoding AND transfer are complete (or transfer not applicable)
          var td = data.encodingStatus === 'completed' ? (data.transferStatus || null) : null
          var fullyDone = data.encodingStatus === 'completed' && (!td || td === 'completed')
          if (fullyDone) {
            clearInterval(interval)
            window.location.reload()
          }
          // Transfer failed: reload so page renders with direct encoder streaming
          if (td === 'error') {
            clearInterval(interval)
            window.location.reload()
          }
          if (data.encodingStatus === 'error') {
            clearInterval(interval)
          }
        })
        .catch(function() {})
        .then(function() { requestInFlight = false })
    }, 5000)
  }

          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>' +

        '</button>' +
        '<div class="ab-hint">After disabling, click the button above</div>' +
      '</div>'

      detectAdBlock(function(stillBlocked) {

  // The player is never initialised, so no ad-free view is ever served.
  function showSandboxOverlay() {

    ov.innerHTML =

        '<div class="ab-flame">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="rgba(249,115,22,0.12)"/><path d="M12 2c1.5 3.5 4 5.5 4 8a4 4 0 11-8 0c0-2.5 2.5-4.5 4-8z" fill="#f97316" opacity=".9"/><path d="M12 6c.8 1.8 2 3 2 4.5a2 2 0 11-4 0c0-1.5 1.2-2.7 2-4.5z" fill="#fbbf24"/></svg>' +
        '</div>' +
        '<h2>Watch on FireStream</h2>' +
        '<p>This video can only be watched on <strong>FireStream</strong>. Click below to open it.</p>' +
        '<button class="ab-btn" id="sbxOpen">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          'Open Video' +
        '</button>' +

      '</div>'

    document.getElementById('sbxOpen').addEventListener('click', function() {
      var url = window.location.origin + '/e/' + slug
      try { window.top.location.href = url } catch (e) {} // works if top-nav is allowed
      window.location.href = url // fallback: navigate this frame to the branded page
    })
  }

  // ── VPN Overlay ──
  function showVpnOverlay(onDismissed) {
    var ov = document.createElement('div')
    ov.className = 'vpn-overlay'
    var orgName = (video.vpnOrg || 'VPN/Proxy')
    ov.innerHTML =
      '<div class="vpn-box">' +
        '<div class="vpn-icon">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="rgba(249,115,22,0.12)"/><path d="M12 2c1.5 3.5 4 5.5 4 8a4 4 0 11-8 0c0-2.5 2.5-4.5 4-8z" fill="#f97316" opacity=".9"/><path d="M12 6c.8 1.8 2 3 2 4.5a2 2 0 11-4 0c0-1.5 1.2-2.7 2-4.5z" fill="#fbbf24"/></svg>' +

        '<button class="vpn-btn" id="vpnContinue">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>' +
          'Reload &amp; Continue' +
        '</button>' +
        '<div class="vpn-hint">After disabling your VPN, click the button above to reload</div>' +
      '</div>'
    document.body.appendChild(ov)

    document.getElementById('vpnContinue').addEventListener('click', function() {
      window.location.reload()
    })
  }

  // Read server-injected video data (no API call — URL never in page source)
  try {
    var el = document.getElementById('video-data')
    var data = JSON.parse(el.textContent)
    var video = data.video
    if (!video) { showError('Not found', 'Video does not exist or is still processing.'); return }
    var adsmode = 100;
    if (video.user) {
      var _m = video.user.adsmode != null ? video.user.adsmode : video.user.profitMode;
      if (_m != null) adsmode = Number(_m);
    }
    window.adsmode = adsmode;

    // Sandboxed embed strips ads → never initialise the player or count a view.
    if (sandboxed) { showSandboxOverlay(); return }

    // ── VPN check helper (called after ad-block is ruled out) ──
    function checkVpnThenRender() {
      var vpnDetected = video.isVpn === true
      var shouldBlockVpn = video.user && video.user.blockVpn
      if (shouldBlockVpn && vpnDetected) {
        showVpnOverlay(function() { renderPage(video, data.minWatchTime || 0) })
      } else {
        renderPage(video, data.minWatchTime || 0)
      }
    }

    var shouldBlock = video.user && video.user.blockAdBlock
    if (shouldBlock && adBlockDetected) {
      showAdblockOverlay(function() { checkVpnThenRender() })
    } else if (shouldBlock) {
      var detStart = Date.now()
      var detPoll = setInterval(function() {
        if (adBlockDetected !== false || Date.now() - detStart > 2200) {
          clearInterval(detPoll)
          if (adBlockDetected) {
            showAdblockOverlay(function() { checkVpnThenRender() })
          } else {
            checkVpnThenRender()
          }
        }
      }, 80)
    } else {
      checkVpnThenRender()
    }
  } catch (err) {
    showError('Video not found', 'The video was not found or is still processing.')
  }
})()
