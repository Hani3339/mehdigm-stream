            }

            const report = {
                report: 'VnxPlayer playback diagnostics',
                version: '3.22.30',
                created_at: startedAt,
                page_origin: window.location.origin,
                online: navigator.onLine,
                user_agent: navigator.userAgent,
                stream: parsedStream ? {
                    host: parsedStream.host,
                    path: parsedStream.pathname,
                    has_token: parsedStream.searchParams.has('token')
                } : { valid: false },
                tests: []
            };

            if (streamUrl) {
                report.tests.push(await probe('encrypted_stream_get', retryableStreamUrl(streamUrl, 'diagnostic'), {
                    method: 'GET',
                    headers: { 'Accept': 'application/vnd.apple.mpegurl, application/x-mpegURL, */*' }
                }));
            }
            if (diagnosticDirectStreamUrl) {
                const directResult = await probe('direct_upstream_get_admin_only', diagnosticDirectStreamUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/vnd.apple.mpegurl, application/x-mpegURL, */*' }
                });
                directResult.url_path = '[redacted]';
                directResult.has_token = false;
                report.tests.push(directResult);
            } else {

                    name: 'direct_upstream_get_admin_only',
                    skipped: true,

                report.tests.push(await probe('edge_options', edgeBase + '?vnx_diagnostic=' + Date.now(), {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': window.location.origin,
                        'Access-Control-Request-Method': 'GET'
                    }
                }));
                report.tests.push(await probe('edge_without_token', edgeBase + '?vnx_diagnostic=' + Date.now(), {

        function renderPlaybackError(message) {
            playerBooted = false;
            if (currentPlayer && typeof currentPlayer.remove === 'function') {
                try { currentPlayer.remove(); } catch (error) {}
            }
            currentPlayer = null;
            if (nativeVideo) {
                nativeVideo.pause();
                nativeVideo.removeAttribute('src');
                nativeVideo.load();
                nativeVideo.hidden = true;
                nativeVideo.style.display = 'none';
                if (nativeSubtitle) { nativeSubtitle.hidden = true; }
            }
            if (!holder) {
                return;
            }

            holder.replaceChildren();
            const box = document.createElement('div');
            box.className = 'megaplay-error';
            const title = document.createElement('strong');
            title.textContent = 'السيرفر لم يرسل ملف فيديو صالح';
            const details = document.createElement('span');
            details.textContent = message || 'جرّب مرة أخرى أو اختر سيرفرًا آخر.';
            const retry = document.createElement('button');
            retry.type = 'button';
            retry.className = 'vnx-stream-retry';
            retry.textContent = 'إعادة المحاولة';
            retry.addEventListener('click', function () {
                streamUrl = retryableStreamUrl(streamUrl, Date.now());
                playbackRetryCount = 0;
                bootPlayer(true);
            });
            const diagnostic = document.createElement('button');
            diagnostic.type = 'button';
            diagnostic.className = 'vnx-stream-diagnostic';
            diagnostic.textContent = 'إنشاء تقرير تشخيص';
            const reportBox = document.createElement('textarea');
            reportBox.className = 'vnx-stream-diagnostic-report';
            reportBox.readOnly = true;
            reportBox.hidden = true;
            diagnostic.addEventListener('click', async function () {
                diagnostic.disabled = true;
                diagnostic.textContent = 'جارٍ إجراء الاختبارات…';
                reportBox.hidden = false;
                reportBox.value = 'قد تستغرق الاختبارات حتى 30 ثانية…';
                try {
                    reportBox.value = await buildPlaybackDiagnosticReport();
                    reportBox.focus();
                    reportBox.select();
                    try {
                        await navigator.clipboard.writeText(reportBox.value);
                        diagnostic.textContent = 'تم إنشاء التقرير ونسخه';
                    } catch (error) {
                        diagnostic.textContent = 'تم إنشاء التقرير — انسخه من الصندوق';
                    }
                } catch (error) {
                    reportBox.value = JSON.stringify({
                        report: 'VnxPlayer playback diagnostics',
                        version: '3.22.30',
                        fatal_error: error && error.message ? error.message : String(error)
                    }, null, 2);
                    diagnostic.textContent = 'تعذر إكمال بعض الاختبارات';
                } finally {
                    diagnostic.disabled = false;
                }
            });
            box.appendChild(title);
            box.appendChild(details);
            box.appendChild(retry);
            box.appendChild(diagnostic);
            box.appendChild(reportBox);

        function handlePlaybackFailure(error) {
            if (playbackRetryCount < 2) {
                playbackRetryCount += 1;
                playerBooted = false;
                streamUrl = retryableStreamUrl(streamUrl, 'playback-' + playbackRetryCount);
                window.setTimeout(function () {
                    bootPlayer(true);
                }, 700 * playbackRetryCount);
                return;
            }
            renderPlaybackError(error && error.message ? error.message : 'تعذر تشغيل البث بعد إعادة المحاولة.');

        function subtitleTimestampToSeconds(value) {
            const normalized = String(value || '').trim().replace(',', '.');
            const parts = normalized.split(':');
            if (parts.length < 2 || parts.length > 3) {
                return NaN;
            }
            let hours = 0;
            let minutes = 0;
            let seconds = 0;
            if (parts.length === 3) {
                hours = Number(parts[0]);
                minutes = Number(parts[1]);
                seconds = Number(parts[2]);
            } else {
                minutes = Number(parts[0]);
                seconds = Number(parts[1]);
            }
            if (![hours, minutes, seconds].every(Number.isFinite)) {
                return NaN;
            }
            return (hours * 3600) + (minutes * 60) + seconds;
        }

        function stripSubtitleFormattingArtifacts(value) {
            return String(value || '').replace(
                /\{(?:\\[^{}\r\n]*|c\s*:\s*(?:[$#]|&H)?[0-9a-f]{6,8}&?|y\s*:\s*[bius](?:\s*,\s*[bius])*|f\s*:[^{}\r\n]*|s\s*:\s*\d+(?:\.\d+)?|[op]\s*:\s*-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?)\}/giu,
                ''
            );
        }

        function cleanSubtitleCueText(value) {
            const holderElement = document.createElement('div');
            holderElement.innerHTML = stripSubtitleFormattingArtifacts(value)
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/?(?:c(?:\.[^>]*)?|v|lang|ruby|rt)[^>]*>/gi, '');
            return stripSubtitleFormattingArtifacts(holderElement.textContent || holderElement.innerText || '')
                .replace(/\u00a0/g, ' ')
                .replace(/[ \t]+\n/g, '\n')
                .trim();
        }

        function subtitleLineDirection(value) {
            const text = String(value || '');
            if (/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/u.test(text)) {
                return 'rtl';
            }
            if (/[A-Za-z\u00C0-\u02AF]/u.test(text)) {
                return 'ltr';
            }
            return 'auto';
        }

        function stabilizeSubtitlePunctuation(value, direction) {
            let text = String(value || '');
            if (direction !== 'rtl' || !text) {
                return text;
            }

            /* Legacy Arabic ASS/SSA files are sometimes authored for LTR
             * renderers and store the final punctuation at the logical start,
             * e.g. ".نساء أكبر منّي". Normalize that ordering at playback too,
             * so previously converted VTT files are fixed without re-uploading. */
            const leadingMatch = text.match(/^(\s*[\u200E\u200F\u202A-\u202E\u2066-\u2069]*)([.!?؟،؛:…]+)(\s*)(?=[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF])([\s\S]*?)\s*$/u);
            if (leadingMatch) {
                const body = String(leadingMatch[4] || '').replace(/\s+$/u, '');
                if (body && !/[.!?؟،؛:…]+$/u.test(body)) {
                    text = leadingMatch[1] + body + leadingMatch[2];
                }
            }

            /* Neutral punctuation can still jump to the visual beginning of an
             * Arabic cue. A trailing RLM keeps it attached to the sentence
             * without changing the visible subtitle text. */
            if (/[.!?؟،؛:…)\]}»"'”’]+\s*$/u.test(text) && !/\u200F\s*$/u.test(text)) {
                return text + '\u200F';
            }
            return text;
        }

        function applySubtitleCueText(element, value) {
            if (!element) {
                return;
            }
            const lines = String(value || '').split(/\n/);
            const fragment = document.createDocumentFragment();
            let firstStrongDirection = 'auto';
            lines.forEach(function (lineText) {
                const direction = subtitleLineDirection(lineText);
                if (firstStrongDirection === 'auto' && direction !== 'auto') {
                    firstStrongDirection = direction;
                }
                const line = document.createElement('span');
                line.className = 'vnx-native-subtitle-line';
                line.setAttribute('dir', direction);
                line.textContent = stabilizeSubtitlePunctuation(lineText, direction) || '\u00a0';
                fragment.appendChild(line);
            });
            element.setAttribute('dir', firstStrongDirection);
            element.replaceChildren(fragment);
        }

        function clampSubtitlePercent(value, fallback) {
            const number = Number(value);
            return Number.isFinite(number) ? Math.max(0, Math.min(100, number)) : fallback;
        }

        function parseWebVttCueSettings(value) {
            const source = String(value || '').trim();
            if (!source) {
                return null;
            }
            const placement = {
                line: null,
                position: null,
                align: 'center',
                lineAnchor: 'auto',
                positionAnchor: 'auto'
            };
            source.split(/\s+/).forEach(function (token) {
                const separator = token.indexOf(':');
                if (separator <= 0) {
                    return;
                }
                const name = token.slice(0, separator).toLowerCase();
                const raw = token.slice(separator + 1);
                const parts = raw.split(',');
                if (name === 'line' && /%$/.test(parts[0])) {
                    placement.line = clampSubtitlePercent(parseFloat(parts[0]), null);
                    placement.lineAnchor = String(parts[1] || 'auto').toLowerCase();
                } else if (name === 'position' && /%$/.test(parts[0])) {
                    placement.position = clampSubtitlePercent(parseFloat(parts[0]), null);
                    placement.positionAnchor = String(parts[1] || 'auto').toLowerCase();
                } else if (name === 'align' && /^(?:start|center|end|left|right)$/i.test(raw)) {
                    placement.align = raw.toLowerCase();
                }
            });
            return Number.isFinite(placement.line) && Number.isFinite(placement.position) ? placement : null;
        }

        function assAlignmentPlacement(rawText, style, dialogue, playResX, playResY) {
            const text = String(rawText || '');
            const styleData = style || {};
            const row = dialogue || {};
            let alignment = parseInt(styleData.alignment || 2, 10);
            if (!Number.isInteger(alignment) || alignment < 1 || alignment > 9) {
                alignment = 2;
            }
            const inlineAlignment = text.match(/\\an([1-9])/i);
            if (inlineAlignment) {
                alignment = parseInt(inlineAlignment[1], 10);
            }
            const isLeft = [1, 4, 7].indexOf(alignment) !== -1;
            const isRight = [3, 6, 9].indexOf(alignment) !== -1;
            const isTop = alignment >= 7;
            const isMiddle = alignment >= 4 && alignment <= 6;
            const margin = function (name) {
                const dialogueValue = parseInt(row[name] || 0, 10) || 0;
                return dialogueValue || (parseInt(styleData[name] || 0, 10) || 0);
            };
            const marginL = margin('marginl');
            const marginR = margin('marginr');
            const marginV = margin('marginv');
            let x = isLeft ? 5 : (isRight ? 95 : 50);
            let y = isTop ? 8 : (isMiddle ? 50 : 92);
            if (playResX > 0) {
                if (isLeft && marginL > 0) {
                    x = clampSubtitlePercent((marginL / playResX) * 100, x);
                } else if (isRight && marginR > 0) {
                    x = clampSubtitlePercent(100 - ((marginR / playResX) * 100), x);
                }
            }
            if (playResY > 0 && !isMiddle && marginV > 0) {
                const marginPercent = Math.max(0, Math.min(45, (marginV / playResY) * 100));
                y = isTop ? marginPercent : 100 - marginPercent;
            }
            let coordinates = text.match(/\\pos\(\s*([-0-9.]+)\s*,\s*([-0-9.]+)\s*\)/i);
            if (!coordinates) {
                coordinates = text.match(/\\move\(\s*([-0-9.]+)\s*,\s*([-0-9.]+)\s*,/i);
            }
            if (coordinates && playResX > 0 && playResY > 0) {
                x = clampSubtitlePercent((parseFloat(coordinates[1]) / playResX) * 100, x);
                y = clampSubtitlePercent((parseFloat(coordinates[2]) / playResY) * 100, y);
            }
            return {
                line: y,
                position: x,
                align: isLeft ? 'start' : (isRight ? 'end' : 'center'),
                lineAnchor: isTop ? 'start' : (isMiddle ? 'center' : 'end'),
                positionAnchor: isLeft ? 'line-left' : (isRight ? 'line-right' : 'center')
            };
        }

        function parseWebVtt(value) {
            const lines = String(value || '')
                .replace(/^\uFEFF/, '')
                .replace(/\r\n?/g, '\n')
                .split('\n');
            const cues = [];
            for (let index = 0; index < lines.length; index += 1) {
                const line = lines[index].trim();
                if (!line || /^WEBVTT(?:\s|$)/i.test(line) || /^(?:NOTE|STYLE|REGION)(?:\s|$)/i.test(line)) {
                    continue;
                }
                const timingLine = line.indexOf('-->') !== -1
                    ? line
                    : (index + 1 < lines.length && lines[index + 1].indexOf('-->') !== -1 ? lines[++index].trim() : '');
                if (!timingLine) {
                    continue;
                }
                const match = timingLine.match(/^((?:\d{1,2}:)?\d{2}:\d{2}[.,]\d{1,3})\s*-->\s*((?:\d{1,2}:)?\d{2}:\d{2}[.,]\d{1,3})(?:\s+(.*))?$/);
                if (!match) {
                    continue;
                }
                const start = subtitleTimestampToSeconds(match[1]);
                const end = subtitleTimestampToSeconds(match[2]);
                if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) {
                    continue;
                }
                const textLines = [];
                while (index + 1 < lines.length && lines[index + 1].trim() !== '') {
                    textLines.push(lines[++index]);
                }
                const text = cleanSubtitleCueText(textLines.join('\n'));
                if (text) {
                    cues.push({ start: start, end: end, text: text, placement: parseWebVttCueSettings(match[3] || '') });
                }
            }
            cues.sort(function (first, second) { return first.start - second.start; });
            return cues;
        }

        function parseAssSubtitle(value) {
            const lines = String(value || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
            const cues = [];
            let section = '';
            let playResX = 0;
            let playResY = 0;
            let eventFields = ['layer', 'start', 'end', 'style', 'name', 'marginl', 'marginr', 'marginv', 'effect', 'text'];
            let styleFields = ['name', 'fontname', 'fontsize', 'primarycolour', 'secondarycolour', 'outlinecolour', 'backcolour', 'bold', 'italic', 'underline', 'strikeout', 'scalex', 'scaley', 'spacing', 'angle', 'borderstyle', 'outline', 'shadow', 'alignment', 'marginl', 'marginr', 'marginv', 'encoding'];
            const styles = {};
            lines.forEach(function (rawLine) {
                const line = String(rawLine || '').trim();
                const sectionMatch = line.match(/^\[([^\]]+)\]$/);
                if (sectionMatch) {
                    section = sectionMatch[1].trim().toLowerCase();
                    return;
                }
                if (section === 'script info') {
                    let resolution = line.match(/^playresx\s*:\s*(\d+)/i);
                    if (resolution) { playResX = Math.max(1, parseInt(resolution[1], 10)); return; }
                    resolution = line.match(/^playresy\s*:\s*(\d+)/i);
                    if (resolution) { playResY = Math.max(1, parseInt(resolution[1], 10)); }
                    return;
                }
                if (section === 'v4+ styles' || section === 'v4 styles') {
                    if (/^format\s*:/i.test(line)) {
                        styleFields = line.replace(/^format\s*:/i, '').split(',').map(function (field) { return field.trim().toLowerCase(); });
                        return;
                    }
                    if (/^style\s*:/i.test(line)) {
                        const values = line.replace(/^style\s*:/i, '').split(',');
                        const row = {};
                        styleFields.forEach(function (field, index) { row[field] = values[index] || ''; });
                        const name = String(row.name || '').trim().toLowerCase();
                        if (name) { styles[name] = row; }
                    }
                    return;
                }
                if (section !== 'events') {
                    return;
                }
                if (/^format\s*:/i.test(line)) {
                    eventFields = line.replace(/^format\s*:/i, '').split(',').map(function (field) { return field.trim().toLowerCase(); });
                    return;
                }
                if (!/^dialogue\s*:/i.test(line)) {
                    return;
                }
                const body = line.replace(/^dialogue\s*:/i, '');
                const values = body.split(',');
                if (values.length < eventFields.length) {
                    return;
                }
                const fixedValues = values.slice(0, eventFields.length - 1);
                fixedValues.push(values.slice(eventFields.length - 1).join(','));
                const row = {};
                eventFields.forEach(function (field, index) { row[field] = fixedValues[index] || ''; });
                const start = subtitleTimestampToSeconds(row.start);
                const end = subtitleTimestampToSeconds(row.end);
                const rawText = String(row.text || '');
                const text = cleanSubtitleCueText(rawText
                    .replace(/\\[Nn]/g, '\n')
                    .replace(/\\h/g, ' ')
                    .replace(/\{[^}]*\}/g, ''));
                const style = styles[String(row.style || 'default').trim().toLowerCase()] || {};
                if (Number.isFinite(start) && Number.isFinite(end) && end > start && text) {
                    cues.push({
                        start: start,
                        end: end,
                        text: text,
                        placement: assAlignmentPlacement(rawText, style, row, playResX, playResY)
                    });
                }
            });
            cues.sort(function (first, second) { return first.start - second.start; });
            return cues;
        }

        function parseSubtitleDocument(value) {
            const text = String(value || '').replace(/^\uFEFF/, '');
            if (/^\s*\[script info\]/i.test(text) || /\n\s*\[events\]\s*\n/i.test(text)) {
                return parseAssSubtitle(text);
            }
            let cues = parseWebVtt(text);
            if (cues.length) {
                return cues;
            }
            const normalizedSrt = 'WEBVTT\n\n' + text.replace(
                /((?:\d{1,3}:)?\d{1,2}:\d{2}),(\d{1,3})(?=\s*-->|\s*$)/gm,
                '$1.$2'
            );
            return parseWebVtt(normalizedSrt);
        }

        function currentPlaybackPosition() {
            if (currentPlayer && typeof currentPlayer.getPosition === 'function') {
                const position = Number(currentPlayer.getPosition());
                if (Number.isFinite(position)) {
                    return position;
                }
            }
            return nativeVideo && Number.isFinite(Number(nativeVideo.currentTime)) ? Number(nativeVideo.currentTime) : 0;
        }

        function currentJwContainer() {
            if (currentPlayer && typeof currentPlayer.getContainer === 'function') {
                try {
                    const container = currentPlayer.getContainer();
                    /* Some JW rebuilds briefly keep returning the detached old
                       container. Never mount controls into a node that is no
                       longer part of this document. */
                    if (container && container.nodeType === 1 && document.documentElement.contains(container)) {
                        return container;
                    }
                } catch (error) {}
            }
            if (holder && !holder.hidden && holder.classList && holder.classList.contains('jwplayer')) {
                return holder;
            }
            if (holder && !holder.hidden) {
                const candidate = holder.querySelector('.jwplayer');
                if (candidate) {
                    return candidate;
                }
            }
            return null;
        }

        function subtitleVideoElement(host) {
            if (!host) {
                return null;
            }
            if (host === nativeVideo) {
                return nativeVideo;
            }
            const videos = host.querySelectorAll ? host.querySelectorAll('video') : [];
            for (let index = 0; index < videos.length; index += 1) {
                const video = videos[index];
                if (video && video.videoWidth > 0 && video.videoHeight > 0) {
                    return video;
                }
            }
            return videos.length ? videos[0] : null;
        }

        function visibleMediaDimensions(host) {
            const target = host && host.nodeType === 1 ? host : playerFrame;
            let viewportWidth = Math.max(1, Number((window.visualViewport && window.visualViewport.width) || window.innerWidth || document.documentElement.clientWidth || 0));
            let viewportHeight = Math.max(1, Number((window.visualViewport && window.visualViewport.height) || window.innerHeight || document.documentElement.clientHeight || 0));

            /* In embeds, CSS transforms or a dynamically resized parent iframe can
             * make innerWidth larger than the actually displayed rectangle. Use the
             * outer iframe dimensions whenever same-origin access or a parent size
             * message is available. */
            if (embedMode && parentEmbedViewport) {
                viewportWidth = Math.min(viewportWidth, Math.max(1, Number(parentEmbedViewport.width || viewportWidth)));
                viewportHeight = Math.min(viewportHeight, Math.max(1, Number(parentEmbedViewport.height || viewportHeight)));
            }
            if (embedMode) {
                try {
                    if (window.frameElement && typeof window.frameElement.getBoundingClientRect === 'function') {
                        const frameRect = window.frameElement.getBoundingClientRect();
                        if (frameRect.width > 0) { viewportWidth = Math.min(viewportWidth, frameRect.width); }
                        if (frameRect.height > 0) { viewportHeight = Math.min(viewportHeight, frameRect.height); }
                    }
                } catch (error) {}
            }

            let width = target ? Number(target.clientWidth || 0) : viewportWidth;
            let height = target ? Number(target.clientHeight || 0) : viewportHeight;

            if (target && typeof target.getBoundingClientRect === 'function') {
                const rect = target.getBoundingClientRect();
                const visibleLeft = Math.max(0, Number(rect.left || 0));
                const visibleTop = Math.max(0, Number(rect.top || 0));
                const visibleRight = Math.min(viewportWidth, Number(rect.right || 0));
                const visibleBottom = Math.min(viewportHeight, Number(rect.bottom || 0));
                const visibleWidth = Math.max(0, visibleRight - visibleLeft);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                if (visibleWidth > 0) {
                    width = Math.min(width || visibleWidth, visibleWidth);
                }
                if (visibleHeight > 0) {
                    height = Math.min(height || visibleHeight, visibleHeight);
                }
            }

            return {
                width: Math.max(1, Math.min(width || viewportWidth, viewportWidth)),
                height: Math.max(1, Math.min(height || viewportHeight, viewportHeight))
            };
        }

        function renderedMediaGeometry(host, requestedWidth, requestedHeight) {
            const target = host && host.nodeType === 1 ? host : (currentJwContainer() || playerFrame);
            const dimensions = visibleMediaDimensions(target);
            const width = Math.max(1, Math.min(Number(requestedWidth || dimensions.width), dimensions.width));
            const height = Math.max(1, Math.min(Number(requestedHeight || dimensions.height), dimensions.height));
            let renderedWidth = width;
            let renderedHeight = height;
            const video = subtitleVideoElement(target);
            const videoWidth = video ? Number(video.videoWidth || 0) : 0;
            const videoHeight = video ? Number(video.videoHeight || 0) : 0;

            if (videoWidth > 0 && videoHeight > 0) {
                const fitScale = Math.min(width / videoWidth, height / videoHeight);
                renderedWidth = Math.max(1, videoWidth * fitScale);
                renderedHeight = Math.max(1, videoHeight * fitScale);
            } else {
                /* Until metadata is ready, assume the common 16:9 shape. This
                 * avoids restoring desktop-sized captions during the first
                 * frames of portrait fullscreen on mobile. */
                const assumedRatio = 16 / 9;
                if ((width / height) > assumedRatio) {
                    renderedWidth = Math.max(1, height * assumedRatio);
                } else {
                    renderedHeight = Math.max(1, width / assumedRatio);
                }
            }

            return {
                width: width,
                height: height,
                renderedWidth: renderedWidth,
                renderedHeight: renderedHeight,
                sideBar: Math.max(0, (width - renderedWidth) / 2),
                topBar: Math.max(0, (height - renderedHeight) / 2)
            };
        }

        function clampNumber(value, minimum, maximum, fallback) {
            const numeric = Number(value);
            return Math.max(minimum, Math.min(maximum, Number.isFinite(numeric) ? numeric : fallback));
        }

        function normalizeHexColor(value, fallback) {
            const color = String(value || '').trim();
            return /^#[0-9a-f]{6}$/i.test(color) ? color.toLowerCase() : fallback;
        }

        function loadSubtitleViewerPreferences() {
            let stored = {};
            try {
                stored = JSON.parse(window.localStorage.getItem(subtitlePreferenceStorageKey) || '{}') || {};
            } catch (error) {}
            return {
                sizePercent: clampNumber(stored.sizePercent, 50, 200, subtitleViewerDefaults.sizePercent),
                fontFamily: ['default', 'Tahoma', 'Arial', 'Trebuchet MS', 'sans-serif', 'serif'].includes(stored.fontFamily) ? stored.fontFamily : subtitleViewerDefaults.fontFamily,

        function subtitleFamilyValue(preference) {
            if (!preference || preference === 'default') {
                return "'" + String(subtitleFontFamily || 'Tahoma').replace(/["']/g, '') + "', Tahoma, Arial, sans-serif";

            if (preference === 'serif' || preference === 'sans-serif') {

            return "'" + String(preference).replace(/["']/g, '') + "', Tahoma, Arial, sans-serif";

        function hexToRgba(hex, opacity) {

            const red = parseInt(safe.slice(0, 2), 16);
            const green = parseInt(safe.slice(2, 4), 16);
            const blue = parseInt(safe.slice(4, 6), 16);
            return 'rgba(' + red + ',' + green + ',' + blue + ',' + (clampNumber(opacity, 0, 100, 0) / 100).toFixed(2) + ')';
        }

        function persistSubtitleViewerPreferences() {

            if (subtitleFontControl) { subtitleFontControl.value = subtitleViewerPreferences.fontFamily; }
            if (subtitleColorControl) { subtitleColorControl.value = subtitleViewerPreferences.textColor; }
            if (subtitleBackgroundControl) { subtitleBackgroundControl.value = subtitleViewerPreferences.backgroundColor; }
            if (subtitleOpacityControl) { subtitleOpacityControl.value = String(subtitleViewerPreferences.backgroundOpacity); }
            if (subtitleOpacityValue) { subtitleOpacityValue.textContent = Math.round(subtitleViewerPreferences.backgroundOpacity) + '%'; }
        }

        function applySubtitleViewerPreferences(persist) {

            document.documentElement.style.setProperty('--vnx-subtitle-family', subtitleFamilyValue(subtitleViewerPreferences.fontFamily));
            document.documentElement.style.setProperty('--vnx-subtitle-preview-size', previewFontSize.toFixed(2) + 'px');
            document.documentElement.style.setProperty('--vnx-subtitle-color', subtitleViewerPreferences.textColor);
            document.documentElement.style.setProperty('--vnx-subtitle-background', hexToRgba(subtitleViewerPreferences.backgroundColor, subtitleViewerPreferences.backgroundOpacity));
            syncSubtitlePreferenceControls();
            if (persist) { persistSubtitleViewerPreferences(); }
            refreshResponsiveMediaSizing(currentJwContainer() || subtitleHost || playerFrame || nativeVideo);
            scheduleSubtitleGeometry();
            renderedSubtitleSignature = '';
            renderCustomSubtitle();
        }


        function settleSubtitleStartupRendering() {
            if (!tracks.length) {
                document.body.classList.remove('vnx-subtitles-initializing', 'vnx-subtitle-font-loading', 'vnx-subtitle-layout-loading');
                return Promise.resolve();
            }

            /* A visitor-selected system font is available synchronously, so no
               reason to delay the Vnx overlay in that case. */
            const needsUploadedFont = subtitleViewerPreferences.fontFamily === 'default'
                && !!subtitleFontUrl
                && !!subtitleFontFamily;
            if (!needsUploadedFont || !document.fonts || typeof document.fonts.load !== 'function') {
                document.body.classList.remove('vnx-subtitle-font-loading');
                return Promise.resolve();
            }

            const escapedFamily = String(subtitleFontFamily).replace(/["']/g, '');
            let timeoutId = 0;
            const fontReady = document.fonts.load('400 32px "' + escapedFamily + '"').catch(function () { return []; });
            const timeout = new Promise(function (resolve) {
                timeoutId = window.setTimeout(resolve, 1800);
            });
            return Promise.race([fontReady, timeout]).then(function () {
                if (timeoutId) { window.clearTimeout(timeoutId); }
                document.body.classList.remove('vnx-subtitle-font-loading');
                renderedSubtitleSignature = '';
                refreshResponsiveMediaSizing(currentJwContainer() || subtitleHost || playerFrame || nativeVideo);
                scheduleSubtitleGeometry();
                renderCustomSubtitle();
            });
        }


        function markSubtitleLayoutReady() {

            if (!document.body.classList.contains('vnx-subtitle-layout-loading')) { return; }

            renderedSubtitleSignature = '';

            scheduleSubtitleGeometry();
            window.requestAnimationFrame(function () { renderCustomSubtitle(); });
        }

        function setSubtitleSettingsOpen(open) {

        function normalizedJwSettingsText(value) {
            return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();

            if (!element || element.nodeType !== 1) { return false; }
            const combinedText = normalizedJwSettingsText([
                element.textContent,
                element.getAttribute('aria-label'),
                element.getAttribute('title')
            ].filter(Boolean).join(' '));
            const classText = normalizedJwSettingsText(element.className || '');
            if (classText.includes('jw-icon-cc') || classText.includes('captions')) {
                return true;
            }
            if (!combinedText) { return false; }
            return combinedText.includes('visual settings')
                || combinedText.includes('caption styling')
                || combinedText.includes('subtitle styling')
                || combinedText.includes('captions')
                || combinedText.includes('subtitles')
                || combinedText.includes('closed captions')
                || combinedText.includes('english')
                || combinedText.includes('الإنجليزية')
                || combinedText.includes('إيقاف الترجمة')
                || combinedText === 'off'
                || combinedText.includes('إعدادات الترجمة المرئية')
                || combinedText.includes('إعدادات مرئية للترجمة');
        }

        function hideNativeCaptionVisualSettings(root) {
            const scope = root && root.querySelectorAll ? root : document;
            const candidates = scope.querySelectorAll([
                '.jw-settings-menu button',
                '.jw-settings-menu [role="menuitem"]',
                '.jw-settings-content-item',
                '.jw-settings-menu a'
            ].join(','));
            candidates.forEach(function (element) {
                if (!isNativeCaptionVisualSettingsEntry(element)) { return; }

                mutations.forEach(function (mutation) {

                        shouldScan = true;
                    }

                if (shouldScan) { hideNativeCaptionVisualSettings(observerRoot); }

            observer.observe(observerRoot, {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,

                ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(function (eventName) {

            if (subtitleBackgroundControl) {

                    applySubtitleViewerPreferences(true);

                if (event) {
                    event.preventDefault();

                applySubtitleViewerPreferences(true);

            if (subtitleSettingsResetDesktop) {

        function responsiveMediaScale(width, height) {
            /* The configured font size is defined at a 1280x720 reference video.
             * Every smaller rendered video uses the exact same linear ratio. A
             * 640x360 embed is 50%, 426x240 is about 33%, and 320x180 is 25%. */
            const safeWidth = Math.max(1, Number(width || 1));
            const safeHeight = Math.max(1, Number(height || 1));
            const widthScale = safeWidth / 1280;
            const heightScale = safeHeight / 720;
            return Math.max(0.04, Math.min(1, widthScale, heightScale));
        }

        function configuredSubtitleSizeForMedia(mediaWidth, mediaHeight) {
            const safeWidth = Math.max(1, Number(mediaWidth || 1));
            const safeHeight = Math.max(1, Number(mediaHeight || 1));
            /* نحول المساحة المرئية إلى عرض مكافئ 16:9 حتى يعتمد الحساب على
             * البعد الأصغر ولا يكبر الخط بسبب الحواف أو نسبة فيديو مختلفة. */
            const equivalentWidth = Math.max(1, Math.min(safeWidth, safeHeight * (16 / 9)));
            const points = Array.isArray(subtitleSizeProfile) ? subtitleSizeProfile
                .map(function (point) {
                    return {
                        width: Math.max(1, Number(point.width || 1)),
                        size: Math.max(6, Math.min(160, Number(point.size || 12)))
                    };
                })
                .sort(function (a, b) { return a.width - b.width; }) : [];

            if (!points.length) {
                return Math.max(6, Math.min(160, subtitleBaseFontSize || 48));
            }
            if (equivalentWidth <= points[0].width) {
                /* تحت 320×180 نستمر بالتصغير النسبي، مع حد قراءة 6px. */
                return Math.max(6, points[0].size * (equivalentWidth / points[0].width));
            }
            const last = points[points.length - 1];
            if (equivalentWidth >= last.width) {
                return last.size;
            }
            for (let index = 0; index < points.length - 1; index += 1) {
                const lower = points[index];
                const upper = points[index + 1];
                if (equivalentWidth >= lower.width && equivalentWidth <= upper.width) {
                    const ratio = (equivalentWidth - lower.width) / Math.max(1, upper.width - lower.width);
                    return lower.size + ((upper.size - lower.size) * ratio);
                }
            }
            return last.size;
        }

        function responsiveSubtitleFontSize(baseSize, mediaWidth, mediaHeight) {
            const viewerMultiplier = clampNumber(subtitleViewerPreferences.sizePercent, 50, 200, 100) / 100;
            const configuredSize = configuredSubtitleSizeForMedia(mediaWidth, mediaHeight);
            /* نحافظ على اختلاف أحجام Styles داخل ASS نسبةً إلى الحجم المرجعي. */
            const styleBase = Math.max(1, Number(baseSize || subtitleBaseFontSize || 48));
            const referenceBase = Math.max(1, Number(subtitleBaseFontSize || 48));
            const styleRatio = Math.max(0.25, Math.min(4, styleBase / referenceBase));
            return Math.max(6, Math.min(320, configuredSize * styleRatio * viewerMultiplier));
        }

        function responsiveSizingHost(preferredHost) {
            const activeFullscreen = fullscreenElement();
            if (activeFullscreen && activeFullscreen.nodeType === 1) {
                return activeFullscreen;
            }
            if (preferredHost && preferredHost.nodeType === 1) {
                return preferredHost;
            }
            return currentJwContainer() || subtitleHost || playerFrame || nativeVideo;
        }

        function refreshResponsiveMediaSizing(preferredHost) {
            const target = responsiveSizingHost(preferredHost);
            const dimensions = visibleMediaDimensions(target);
            return applyResponsiveMediaSizing(dimensions.width, dimensions.height, target);
        }

        function applyResponsiveMediaSizing(width, height, host) {
            const geometry = renderedMediaGeometry(host || currentJwContainer() || subtitleHost || playerFrame, width, height);
            const mediaWidth = geometry.renderedWidth;
            const mediaHeight = geometry.renderedHeight;
            const scale = responsiveMediaScale(mediaWidth, mediaHeight);
            let subtitleSize = responsiveSubtitleFontSize(subtitleBaseFontSize, mediaWidth, mediaHeight);

            subtitleSize = Math.round(subtitleSize * 10) / 10;
            document.documentElement.style.setProperty('--vnx-subtitle-size', subtitleSize + 'px');
            return {
                scale: scale,
                geometry: geometry
            };
        }

        function updateSubtitleGeometry() {
            subtitleGeometryFrame = 0;
            if (!nativeSubtitle || !subtitleHost || !subtitleHost.isConnected) {
                return;
            }
            const width = Math.max(0, Number(subtitleHost.clientWidth || 0));
            const height = Math.max(0, Number(subtitleHost.clientHeight || 0));
            if (!width || !height) {
                return;
            }
            const sizing = applyResponsiveMediaSizing(width, height, subtitleHost);
            const responsiveScale = sizing.scale;
            const geometry = sizing.geometry;
            const renderedWidth = geometry.renderedWidth;
            const renderedHeight = geometry.renderedHeight;
            const bottomBlackBar = geometry.topBar;
            const sideBlackBar = geometry.sideBar;
            const sidePadding = sideBlackBar + Math.max(12, renderedWidth * 0.04);
            const bottomPadding = bottomBlackBar + Math.max(24, subtitleBaseBottom * responsiveScale);
            subtitleRenderedGeometry = {
                width: width,
                height: height,
                renderedWidth: renderedWidth,
                renderedHeight: renderedHeight,
                sideBar: sideBlackBar,
                topBar: bottomBlackBar,
                scale: responsiveScale,
                sidePadding: sidePadding,
                bottomPadding: bottomPadding
            };
            renderedSubtitleSignature = '';
            if (customSubtitleCues.length) {
                renderCustomSubtitle();
            } else if (activeNativeSubtitleTrack) {
                renderNativeSubtitle(activeNativeSubtitleTrack);
            }
        }

        function scheduleSubtitleGeometry() {
            if (subtitleGeometryFrame) {
                window.cancelAnimationFrame(subtitleGeometryFrame);
            }
            subtitleGeometryFrame = window.requestAnimationFrame(updateSubtitleGeometry);
        }

        function observeSubtitleHost(host) {
            if (subtitleResizeObserver) {
                subtitleResizeObserver.disconnect();

            }
            if (typeof ResizeObserver === 'function' && host) {
                subtitleResizeObserver = new ResizeObserver(function () {
                    refreshResponsiveMediaSizing(host);
                    scheduleSubtitleGeometry();
                });
                subtitleResizeObserver.observe(host);
            }
        }

        function mountSubtitleOverlay(host) {
            if (!nativeSubtitle) {
                return;
            }
            const target = host && host.nodeType === 1 ? host : playerFrame;
            if (!target) {
                return;
            }
            if (window.getComputedStyle && window.getComputedStyle(target).position === 'static') {
                target.style.position = 'relative';
            }
            if (nativeSubtitle.parentNode !== target) {
                target.appendChild(nativeSubtitle);
            }
            /* Never move the interactive subtitle settings wrapper into JW's
             * internal DOM. Some JW skins use delegated pointer handling and a
             * foreign high-z-index child can swallow the central play click. */
            if (subtitleSettings && playerFrame && subtitleSettings.parentNode !== playerFrame) {
                playerFrame.appendChild(subtitleSettings);
            }
            subtitleHost = target;
            observeSubtitleHost(target);
            scheduleSubtitleGeometry();
            window.setTimeout(scheduleSubtitleGeometry, 80);
            window.setTimeout(scheduleSubtitleGeometry, 350);
        }

        function subtitlePlacementGeometry(cue) {
            const hostWidth = Math.max(1, Number((subtitleHost && subtitleHost.clientWidth) || (playerFrame && playerFrame.clientWidth) || window.innerWidth || 1));
            const hostHeight = Math.max(1, Number((subtitleHost && subtitleHost.clientHeight) || (playerFrame && playerFrame.clientHeight) || window.innerHeight || 1));
            const geometry = subtitleRenderedGeometry || {
                width: hostWidth,
                height: hostHeight,
                renderedWidth: hostWidth,
                renderedHeight: hostHeight,
                sideBar: 0,
                topBar: 0,
                scale: responsiveMediaScale(hostWidth, hostHeight),
                bottomPadding: Math.max(24, subtitleBaseBottom)
            };
            const placement = cue && cue.placement ? cue.placement : null;
            let xPercent = placement && Number.isFinite(placement.position) ? placement.position : 50;
            let yPercent = placement && Number.isFinite(placement.line) ? placement.line : 100;
            let shiftX = '-50%';
            let shiftY = '-100%';
            let textAlign = 'center';

            let y;
            if (placement) {
                const positionAnchor = String(placement.positionAnchor || 'auto').toLowerCase();
                const lineAnchor = String(placement.lineAnchor || 'auto').toLowerCase();
                const alignment = String(placement.align || 'center').toLowerCase();
                shiftX = positionAnchor === 'line-left' || alignment === 'start' || alignment === 'left'
                    ? '0%'
                    : (positionAnchor === 'line-right' || alignment === 'end' || alignment === 'right' ? '-100%' : '-50%');
                shiftY = lineAnchor === 'start' ? '0%' : (lineAnchor === 'center' ? '-50%' : '-100%');
                textAlign = alignment === 'start' || alignment === 'left' ? 'left' : (alignment === 'end' || alignment === 'right' ? 'right' : 'center');
                y = geometry.topBar
                    + ((clampSubtitlePercent(yPercent, 90) / 100) * geometry.renderedHeight)
                    - (subtitleVerticalOffset * geometry.scale);
            } else {
                const bottomDistance = Math.max(
                    12,
                    Math.min(geometry.renderedHeight - 8, (subtitleBaseBottom + subtitleVerticalOffset) * geometry.scale)
                );
                y = geometry.topBar + geometry.renderedHeight - bottomDistance;
            }

            const x = geometry.sideBar + ((clampSubtitlePercent(xPercent, 50) / 100) * geometry.renderedWidth);
            return {
                left: Math.max(0, Math.min(geometry.width, x)),
                top: Math.max(0, Math.min(geometry.height, y)),
                shiftX: shiftX,
                shiftY: shiftY,
                textAlign: textAlign,
                maxWidth: Math.max(80, geometry.renderedWidth * 0.92)
            };
        }

        function subtitleSafeBounds() {
            const hostWidth = Math.max(1, Number((subtitleHost && subtitleHost.clientWidth) || (playerFrame && playerFrame.clientWidth) || window.innerWidth || 1));
            const hostHeight = Math.max(1, Number((subtitleHost && subtitleHost.clientHeight) || (playerFrame && playerFrame.clientHeight) || window.innerHeight || 1));
            const geometry = subtitleRenderedGeometry || {
                width: hostWidth,
                height: hostHeight,
                renderedWidth: hostWidth,
                renderedHeight: hostHeight,
                sideBar: 0,
                topBar: 0
            };
            const computedSize = parseFloat(window.getComputedStyle(document.documentElement).getPropertyValue('--vnx-subtitle-size')) || subtitleBaseFontSize || 24;
            const padding = Math.max(5, Math.min(24, computedSize * 0.28));
            return {
                left: Math.max(0, geometry.sideBar + padding),
                top: Math.max(0, geometry.topBar + padding),
                right: Math.min(geometry.width, geometry.sideBar + geometry.renderedWidth - padding),
                bottom: Math.min(geometry.height, geometry.topBar + geometry.renderedHeight - padding)
            };
        }

        function subtitleShiftFactor(value, fallback) {
            const normalized = String(value || '').trim();
            if (normalized === '0%') { return 0; }
            if (normalized === '-100%') { return -1; }
            if (normalized === '-50%') { return -0.5; }
            return fallback;
        }

        function keepSubtitleInsideRenderedVideo(element, placementGeometry) {
            if (!element || !placementGeometry) {
                return;
            }
            const bounds = subtitleSafeBounds();
            const availableWidth = Math.max(40, bounds.right - bounds.left);
            const availableHeight = Math.max(24, bounds.bottom - bounds.top);
            element.style.maxWidth = Math.floor(availableWidth) + 'px';

            let width = Math.min(availableWidth, Math.max(1, element.offsetWidth || element.getBoundingClientRect().width || 1));
            let height = Math.min(availableHeight, Math.max(1, element.offsetHeight || element.getBoundingClientRect().height || 1));
            const factorX = subtitleShiftFactor(placementGeometry.shiftX, -0.5);
            const factorY = subtitleShiftFactor(placementGeometry.shiftY, -1);
            let left = Number(placementGeometry.left || 0) + (factorX * width);
            let top = Number(placementGeometry.top || 0) + (factorY * height);

            if (width >= availableWidth) {
                left = bounds.left;
            } else {
                left = Math.max(bounds.left, Math.min(bounds.right - width, left));
            }
            if (height >= availableHeight) {
                top = bounds.top;
            } else {
                top = Math.max(bounds.top, Math.min(bounds.bottom - height, top));
            }

            element.style.transform = 'none';
            element.style.left = Math.round(left * 10) / 10 + 'px';
            element.style.top = Math.round(top * 10) / 10 + 'px';
        }

        function subtitleElementRect(element) {
            if (!element) {
                return null;
            }
            const left = Number(element.offsetLeft || parseFloat(element.style.left) || 0);
            const top = Number(element.offsetTop || parseFloat(element.style.top) || 0);
            const width = Math.max(1, Number(element.offsetWidth || element.getBoundingClientRect().width || 1));
            const height = Math.max(1, Number(element.offsetHeight || element.getBoundingClientRect().height || 1));
            return {
                left: left,
                top: top,
                right: left + width,
                bottom: top + height,
                width: width,
                height: height
            };
        }

        function subtitleRectsOverlap(first, second) {
            if (!first || !second) {
                return false;
            }
            return first.left < second.right
                && first.right > second.left
                && first.top < second.bottom
                && first.bottom > second.top;
        }

        function preferredSubtitleStackDirection(cue, element) {
            const placement = cue && cue.placement ? cue.placement : null;
            const anchor = placement ? String(placement.lineAnchor || 'auto').toLowerCase() : 'end';
            if (anchor === 'start') {
                return 1; // Top-aligned cues grow downward.
            }
            if (anchor === 'end') {
                return -1; // Bottom-aligned cues grow upward.
            }
            const rect = subtitleElementRect(element);
            const bounds = subtitleSafeBounds();
            const center = rect ? rect.top + (rect.height / 2) : (bounds.top + bounds.bottom) / 2;
            return center <= ((bounds.top + bounds.bottom) / 2) ? 1 : -1;
        }

        function resolveSubtitleCueOverlaps(entries) {
            if (!Array.isArray(entries) || entries.length < 2) {
                return;
            }
            const bounds = subtitleSafeBounds();
            const computedSize = parseFloat(window.getComputedStyle(document.documentElement).getPropertyValue('--vnx-subtitle-size')) || subtitleBaseFontSize || 24;
            const gap = Math.max(3, Math.min(14, computedSize * 0.18));
            const placed = [];

            entries.forEach(function (entry) {
                const element = entry && entry.element ? entry.element : null;
                if (!element) {
                    return;
                }
                let direction = preferredSubtitleStackDirection(entry.cue, element);
                let attempts = 0;
                const maxAttempts = Math.max(6, placed.length * 4);

                while (attempts < maxAttempts) {
                    attempts += 1;
                    const current = subtitleElementRect(element);
                    const collisions = placed.filter(function (previous) {
                        return subtitleRectsOverlap(current, subtitleElementRect(previous.element));
                    });
                    if (!collisions.length || !current) {
                        break;
                    }

                    const collisionRects = collisions.map(function (previous) {
                        return subtitleElementRect(previous.element);
                    }).filter(Boolean);
                    if (!collisionRects.length) {
                        break;
                    }

                    const highestTop = Math.min.apply(null, collisionRects.map(function (rect) { return rect.top; }));
                    const lowestBottom = Math.max.apply(null, collisionRects.map(function (rect) { return rect.bottom; }));
                    const upwardTop = highestTop - current.height - gap;
                    const downwardTop = lowestBottom + gap;
                    const upwardFits = upwardTop >= bounds.top;
                    const downwardFits = downwardTop + current.height <= bounds.bottom;
                    let nextTop;

                    if (direction < 0 && upwardFits) {
                        nextTop = upwardTop;
                    } else if (direction > 0 && downwardFits) {
                        nextTop = downwardTop;
                    } else if (upwardFits) {
                        nextTop = upwardTop;
                        direction = -1;
                    } else if (downwardFits) {
                        nextTop = downwardTop;
                        direction = 1;
                    } else {
                        const roomAbove = Math.max(0, current.top - bounds.top);
                        const roomBelow = Math.max(0, bounds.bottom - current.bottom);
                        direction = roomAbove >= roomBelow ? -1 : 1;
                        nextTop = direction < 0
                            ? Math.max(bounds.top, upwardTop)
                            : Math.min(bounds.bottom - current.height, downwardTop);
                    }

                    const oldTop = parseFloat(element.style.top) || current.top;
                    const safeTop = Math.max(bounds.top, Math.min(bounds.bottom - current.height, nextTop));
                    if (Math.abs(safeTop - oldTop) < 0.5) {
                        break;
                    }
                    element.style.top = Math.round(safeTop * 10) / 10 + 'px';
                }
                placed.push(entry);
            });
        }

        function clearSubtitleOverlay() {
            if (nativeSubtitle) {
                nativeSubtitle.replaceChildren();
                nativeSubtitle.hidden = true;

            renderedSubtitleSignature = '';
        }

        function renderSubtitleCues(cues) {
            if (!nativeSubtitle) {
                return;
            }
            const activeCues = Array.isArray(cues) ? cues.filter(function (cue) {
                return cue && typeof cue.text === 'string' && cue.text.trim() !== '';
            }) : [];
            if (!activeCues.length) {

                return;
            }
            const signature = activeCues.map(function (cue) {
                const placement = cue.placement || {};
                return [cue.start, cue.end, cue.text, placement.line, placement.position, placement.align, placement.lineAnchor, placement.positionAnchor].join('~');
            }).join('|') + '@' + JSON.stringify(subtitleRenderedGeometry || {});
            if (signature === renderedSubtitleSignature) {

                return;
            }
            renderedSubtitleSignature = signature;
            nativeSubtitle.replaceChildren();
            /* Unhide before measuring. Elements inside a hidden overlay have a
             * zero width/height, which previously prevented safe clamping. */
            nativeSubtitle.hidden = false;
            const renderedEntries = [];
            activeCues.forEach(function (cue) {
                const element = document.createElement('span');
                const geometry = subtitlePlacementGeometry(cue);
                element.className = 'vnx-native-subtitle-text';
                applySubtitleCueText(element, cue.text);
                element.style.left = Math.round(geometry.left * 10) / 10 + 'px';
                element.style.top = Math.round(geometry.top * 10) / 10 + 'px';
                element.style.transform = 'translate(' + geometry.shiftX + ', ' + geometry.shiftY + ')';
                element.style.textAlign = geometry.textAlign;
                element.style.maxWidth = Math.round(geometry.maxWidth) + 'px';
                nativeSubtitle.appendChild(element);
                /* Preserve the intended ASS/WebVTT anchor, then move the cue by
                 * the smallest possible amount if any edge falls outside the
                 * actually rendered video area. */
                keepSubtitleInsideRenderedVideo(element, geometry);
                renderedEntries.push({ cue: cue, element: element, geometry: geometry });
            });

             * position, place them in a vertical stack instead of drawing one
             * on top of the other. Bottom cues stack upward, top cues downward. */
            resolveSubtitleCueOverlaps(renderedEntries);
        }

        /*
         * 3.22.16 — طيّ الطبقات المكررة قبل الرسم.
         *
         * ملفات ASS المحوَّلة إلى VTT تفقد معنى الطبقات وتُبقي التكرار: نفس النص
         * يتكرر عشرات المرات بإزاحات طفيفة لصنع تأثير بصري كان يُرسم في الأصل
         * كطبقة واحدة. في ملف اختُبر فعليًا بلغت الذروة 125 عبارة نشطة تحمل
         * ثمانية نصوص فريدة فقط، أحدها مكرر 49 مرة.
         *
         * الرسم كان ينشئ عنصرًا لكل واحدة ثم يقيس أبعاده، فيجبر المتصفح على
         * إعادة حساب التخطيط 125 مرة متتالية في الإطار الواحد. النتيجة تجمّد
         * لحظي بلا رسالة خطأ، فلا تظهر ترجمة إطلاقًا.
         *
         * نحتفظ بأول ظهور لكل نص فريد، وهو الطبقة الأساسية التي تحمل الموضع
         * المقصود، ونُسقط بقية النسخ. ثم نضع سقفًا نهائيًا يحمي من أي ملف
         * مكدّس بنصوص فريدة فعلًا.
         */
        const SUBTITLE_MAX_SIMULTANEOUS_CUES = 8;

        function collapseDuplicateSubtitleCues(cues) {
            if (!Array.isArray(cues) || cues.length < 2) {
                return Array.isArray(cues) ? cues : [];
            }
            const seen = new Map();
            for (let index = 0; index < cues.length; index += 1) {
                const cue = cues[index];
                if (!cue || typeof cue.text !== 'string') {
                    continue;
                }
                /* المفتاح هو النص وحده. الطبقات المكررة تختلف في الموضع فقط،
                 * فإدخال الموضع في المفتاح يُبقي التكرار كما هو. */
                const key = cue.text.replace(/\s+/g, ' ').trim();
                if (!key) {
                    continue;
                }
                const previous = seen.get(key);
                if (!previous) {
                    seen.set(key, cue);
                    continue;
                }
                /* عند التكرار نُفضّل الأطول مدةً: الطبقة الأساسية تدوم طول
                 * الجملة، بينما طبقات التأثير تومض لأجزاء من الثانية. */
                const previousSpan = Number(previous.end) - Number(previous.start);
                const currentSpan = Number(cue.end) - Number(cue.start);
                if (Number.isFinite(currentSpan) && Number.isFinite(previousSpan) && currentSpan > previousSpan) {
                    seen.set(key, cue);
                }
            }
            const unique = Array.from(seen.values());
            if (unique.length <= SUBTITLE_MAX_SIMULTANEOUS_CUES) {
                return unique;
            }
            /* السقف النهائي: نُبقي الأطول مدةً لأنها الأقرب إلى الحوار الحقيقي،
             * ثم نعيد الترتيب الزمني حتى لا يتغير ترتيب الأسطر على الشاشة. */
            return unique
                .slice()
                .sort(function (first, second) {
                    return (Number(second.end) - Number(second.start)) - (Number(first.end) - Number(first.start));
                })
                .slice(0, SUBTITLE_MAX_SIMULTANEOUS_CUES)
                .sort(function (first, second) { return Number(first.start) - Number(second.start); });
        }

        function renderCustomSubtitle(position) {
            if (
                !nativeSubtitle
                || !customSubtitleEnabled
                || !customSubtitleCues.length
                || nativeVideoFullscreenActive
                || isVideoElement(fullscreenElement())

                clearSubtitleOverlay();
                return;
            }
            const time = Number.isFinite(Number(position)) ? Number(position) : currentPlaybackPosition();
            const active = customSubtitleCues.filter(function (candidate) {
                return candidate && time >= candidate.start && time < candidate.end;
            });
            renderSubtitleCues(collapseDuplicateSubtitleCues(active));
        }

        function setCustomSubtitleEnabled(enabled) {
            customSubtitleEnabled = !!enabled;
            const active = customSubtitleEnabled && customSubtitleCues.length > 0;
            document.body.classList.toggle('vnx-custom-subtitles-active', active);
            if (customSubtitleSyncTimer) {
                window.clearInterval(customSubtitleSyncTimer);
                customSubtitleSyncTimer = 0;
            }
            if (active) {
                builtInSubtitleFallbackActive = false;
                document.body.classList.remove('vnx-subtitles-initializing');
                removeManagedSubtitleFallbackTracks();
                suppressBuiltInSubtitleRenderers();
                [0, 180, 650, 1600].forEach(function (delay) {
                    window.setTimeout(function () {
                        if (customSubtitleEnabled && customSubtitleCues.length) {
                            suppressBuiltInSubtitleRenderers();
                        }
                    }, delay);
                });

                    renderCustomSubtitle();
                }, 125);
            }
            renderCustomSubtitle();
        }

        function removeManagedSubtitleFallbackTracks() {
            const roots = [nativeVideo, currentJwContainer(), playerFrame].filter(Boolean);
            roots.forEach(function (root) {
                if (!root || typeof root.querySelectorAll !== 'function') {
                    return;
                }
                root.querySelectorAll('track[data-vnx-subtitle-fallback="1"]').forEach(function (trackNode) {
                    trackNode.remove();
                });
            });
        }

        function suppressJwCaptionRenderer(player) {
            if (!player || builtInSubtitleFallbackActive) {
                return;
            }

            if (typeof player.setCurrentCaptions === 'function' && !jwCaptionSuppressionPending) {
                let currentIndex = null;
                if (typeof player.getCurrentCaptions === 'function') {
                    try {
                        currentIndex = Number(player.getCurrentCaptions());
                    } catch (error) {}
                }
                if ((Number.isFinite(currentIndex) && currentIndex > 0) || (!Number.isFinite(currentIndex) && !jwCaptionsOffRequested)) {
                    jwCaptionSuppressionPending = true;
                    jwCaptionsOffRequested = true;
                    try {
                        player.setCurrentCaptions(0);
                    } catch (error) {}
                    window.setTimeout(function () {
                        jwCaptionSuppressionPending = false;
                    }, 80);
                }
            }

            const container = currentJwContainer();
            if (!container || typeof container.querySelectorAll !== 'function') {
                return;
            }
            container.querySelectorAll('video').forEach(function (video) {
                if (!video.textTracks) {
                    return;
                }
                const bridgeNode = video.querySelector('track[data-vnx-native-fullscreen-track="1"]');
                for (let index = 0; index < video.textTracks.length; index += 1) {
                    try {
                        if (bridgeNode && bridgeNode.track === video.textTracks[index]) {

                                ? 'showing'
                                : 'hidden';
                            continue;
                        }
                        video.textTracks[index].mode = 'disabled';
                    } catch (error) {}
                }

        function suppressBuiltInSubtitleRenderers() {
            if (builtInSubtitleFallbackActive) {
                return;
            }
            suppressJwCaptionRenderer(currentPlayer);

            const nativeIsFullscreen = nativeVideoFullscreenActive && nativeFullscreenVideoElement === nativeVideo;
            if (!nativeIsFullscreen && nativeVideo && nativeVideo.textTracks) {
                for (let index = 0; index < nativeVideo.textTracks.length; index += 1) {
                    try {
                        nativeVideo.textTracks[index].mode = 'disabled';
                    } catch (error) {}
                }
            }
        }

        function enableEmergencySubtitleFallback(trackData) {
            if (!trackData || !trackData.file) {
                return;
            }
            builtInSubtitleFallbackActive = true;
            jwCaptionsOffRequested = false;
            document.body.classList.remove('vnx-custom-subtitles-active', 'vnx-subtitles-initializing', 'vnx-subtitle-font-loading', 'vnx-subtitle-layout-loading');

            const mountFallback = function () {
                if (!builtInSubtitleFallbackActive || (customSubtitleEnabled && customSubtitleCues.length)) {
                    return;
                }

                if (nativeVideo && !nativeVideo.hidden && activeNativeSubtitleTrack) {
                    try {
                        activeNativeSubtitleTrack.mode = 'showing';
                    } catch (error) {}
                    return;
                }

                const container = currentJwContainer();
                const video = container && typeof container.querySelector === 'function'
                    ? container.querySelector('video')
                    : null;
                if (!video) {
                    return;
                }
                video.querySelectorAll('track[data-vnx-subtitle-fallback="1"]').forEach(function (node) {
                    node.remove();
                });
                if (video.textTracks) {
                    for (let index = 0; index < video.textTracks.length; index += 1) {
                        try {
                            video.textTracks[index].mode = 'disabled';
                        } catch (error) {}
                    }
                }
                const trackNode = document.createElement('track');
                trackNode.kind = 'captions';
                trackNode.label = trackData.label || 'العربية';
                trackNode.srclang = trackData.srclang || 'ar';
                trackNode.src = trackData.file;
                trackNode.default = true;
                trackNode.setAttribute('data-vnx-subtitle-fallback', '1');
                video.appendChild(trackNode);
                try {
                    if (trackNode.track) {
                        trackNode.track.mode = 'showing';
                    }
                } catch (error) {}
            };

            [0, 350, 1100].forEach(function (delay) {
                window.setTimeout(mountFallback, delay);
            });
        }

        function subtitleCandidateUrls(trackData) {
            const values = [];
            if (trackData && trackData.file) {
                values.push(trackData.file);
            }
            if (trackData && Array.isArray(trackData.fallbacks)) {
                trackData.fallbacks.forEach(function (value) {
                    if (value) {
                        values.push(value);
                    }
                });
            }
            const seen = new Set();
            return values.filter(function (value) {
                try {
                    const absolute = new URL(String(value), window.location.href).href;
                    if (seen.has(absolute)) {
                        return false;
                    }
                    seen.add(absolute);
                    return true;
                } catch (error) {
                    return false;
                }
            });
        }

        async function fetchSubtitleCandidate(url, bypassCache) {
            const parsed = new URL(url, window.location.href);
            if (bypassCache) {
                parsed.searchParams.set('vnx_sub_retry', String(Date.now()));
            }
            const sameOrigin = parsed.origin === window.location.origin;
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const timer = window.setTimeout(function () {
                if (controller) {
                    controller.abort();
                }
            }, 22000);
            try {
                const response = await window.fetch(parsed.href, {
                    method: 'GET',
                    mode: sameOrigin ? 'same-origin' : 'cors',
                    credentials: sameOrigin ? 'same-origin' : 'omit',
                    cache: bypassCache ? 'no-store' : 'default',
                    redirect: 'follow',
                    headers: { 'Accept': 'text/vtt,text/plain,application/x-subrip,text/x-ssa;q=0.9,*/*;q=0.1' },
                    signal: controller ? controller.signal : undefined
                });
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                const subtitleText = await response.text();
                const contentType = String(response.headers.get('content-type') || '').toLowerCase();
                const normalized = String(subtitleText || '').replace(/^\uFEFF/, '').trim();
                if (!normalized || contentType.indexOf('text/html') !== -1 || /<\s*(?:!doctype|html|head|body|script)\b/i.test(normalized)) {
                    throw new Error('Subtitle endpoint returned invalid content');
                }
                if (normalized.indexOf('-->') === -1) {
                    throw new Error('Subtitle endpoint returned no timed cues');
                }
                return subtitleText;
            } finally {
                window.clearTimeout(timer);
            }
        }

        async function fetchSubtitleText(trackData) {
            const urls = subtitleCandidateUrls(trackData);
            if (!urls.length) {
                throw new Error('No subtitle URL');
            }
            let lastError = null;
            for (let round = 0; round < 2; round += 1) {
                for (let index = 0; index < urls.length; index += 1) {
                    try {
                        return await fetchSubtitleCandidate(urls[index], round > 0);
                    } catch (error) {
                        lastError = error;
                    }
                }
                if (round === 0) {
                    await new Promise(function (resolve) {
                        window.setTimeout(resolve, 900);
                    });
                }
            }
            throw lastError || new Error('Subtitle request failed');
        }

        async function loadCustomSubtitleTrack(index, attemptedIndexes) {
            index = Number(index);
            const attempted = Array.isArray(attemptedIndexes) ? attemptedIndexes.slice() : [];
            if (attempted.indexOf(index) !== -1) {
                return false;
            }
            attempted.push(index);
            const trackData = Number.isInteger(index) && index >= 0 ? tracks[index] : null;
            const token = ++customSubtitleLoadToken;
            customSubtitleTrackIndex = trackData ? index : -1;
            if (!trackData || !trackData.file || !window.fetch) {
                customSubtitleCues = [];
                setCustomSubtitleEnabled(false);
                if (trackData && trackData.file) {
                    enableEmergencySubtitleFallback(trackData);
                }
                return false;
            }
            try {
                let cues = customSubtitleCache.get(trackData.file);
                if (!cues) {
                    const subtitleText = await fetchSubtitleText(trackData);
                    cues = parseSubtitleDocument(subtitleText);
                    if (!cues.length) {
                        throw new Error('No valid WebVTT cues');
                    }
                    customSubtitleCache.set(trackData.file, cues);
                }
                if (token !== customSubtitleLoadToken || customSubtitleTrackIndex !== index) {
                    return false;
                }
                customSubtitleCues = cues;
                setCustomSubtitleEnabled(true);
                renderCustomSubtitle();
                return true;
            } catch (error) {
                if (token === customSubtitleLoadToken) {
                    const alternativeIndex = tracks.findIndex(function (candidate, candidateIndex) {
                        return attempted.indexOf(candidateIndex) === -1 && candidate && candidate.file;
                    });
                    if (alternativeIndex >= 0) {
                        return loadCustomSubtitleTrack(alternativeIndex, attempted);
                    }
                    customSubtitleCues = [];
                    setCustomSubtitleEnabled(false);
                    // Activate exactly one browser-level renderer only after
                    // the protected Vnx overlay has genuinely failed.
                    enableEmergencySubtitleFallback(trackData);
                }
                return false;
            }
        }

        function preferredSubtitleTrackIndex() {
            const defaultIndex = tracks.findIndex(function (track) { return !!(track && track.default); });
            return defaultIndex >= 0 ? defaultIndex : (tracks.length ? 0 : -1);

        function isVideoElement(element) {
            return !!(element && String(element.tagName || '').toLowerCase() === 'video');

        function nativeFullscreenTrackData() {
            const index = preferredSubtitleTrackIndex();
            return index >= 0 && tracks[index] && tracks[index].file ? tracks[index] : null;

        /* JW's custom subtitle overlay is outside the <video> element. iPhone

        function ensureNativeFullscreenSubtitleBridge(video) {

            const trackData = nativeFullscreenTrackData();
            if (!trackData) {

                trackNode.default = false;

                    trackNode.track.mode = 'hidden';

        function showNativeFullscreenTrack(video, trackNode) {
            if (!video || !trackNode) {
                return;
            }
            const applyMode = function () {
                if (!nativeVideoFullscreenActive || nativeFullscreenVideoElement !== video) {
                    return;

                    if (trackNode.track) {
                        trackNode.track.mode = 'showing';

        function activateNativeVideoFullscreen(video, usesDocument, refreshState) {

            }
            nativeFullscreenVideoElement = video;
            nativeVideoFullscreenActive = true;
            nativeVideoFullscreenUsesDocument = !!usesDocument;
            document.body.classList.add('vnx-native-video-fullscreen');

            if (video === nativeVideo) {

        function deactivateNativeVideoFullscreen(refreshState) {
            const video = nativeFullscreenVideoElement;
            if (video && video !== nativeVideo) {
                const bridgeNode = video.querySelector('track[data-vnx-native-fullscreen-track="1"]');

                } catch (error) {}

                try {
                    activeNativeSubtitleTrack.mode = customSubtitleEnabled && customSubtitleCues.length ? 'disabled' : 'hidden';
                } catch (error) {}
            }
            nativeFullscreenVideoElement = null;
            nativeVideoFullscreenActive = false;
            nativeVideoFullscreenUsesDocument = false;
            document.body.classList.remove('vnx-native-video-fullscreen');

        function bindNativeVideoFullscreenEvents(video) {
            if (!isVideoElement(video)) {
                return;

            ensureNativeFullscreenSubtitleBridge(video);
            if (nativeFullscreenBoundVideos) {
                if (nativeFullscreenBoundVideos.has(video)) {
                    return;
                }
                nativeFullscreenBoundVideos.add(video);
            } else if (video.getAttribute('data-vnx-fullscreen-bound') === '1') {
                return;
            } else {
                video.setAttribute('data-vnx-fullscreen-bound', '1');

            video.addEventListener('loadedmetadata', function () {
                ensureNativeFullscreenSubtitleBridge(video);

                    deactivateNativeVideoFullscreen(false);
