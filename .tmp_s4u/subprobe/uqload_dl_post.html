<!-- pop diagnostics v3 (2026-09-10): can the popunder open at all on this embedder?
     Installed BEFORE the ad tag. Samples 25% of loads, watches the WHOLE session and
     reports ONE Plausible event (20s after the first real click, or on page hide):
        Pop Fired       - window.open returned a window (pop works here)
        Pop Blocked     - window.open was called and returned null => sandboxed
        Pop Fired Focus - no open() seen, but the page lost focus within 3s of a click
        Pop No Attempt  - nothing tried (no fill, capped, or the tag was blocked)
     Plausible stores the referrer on custom events, so the per-embedder rate comes from
     GROUP BY domainWithoutWWW(referrer). Purely observational: window.open is called
     through unchanged and its return value / exceptions are passed straight back. -->
<script>
(function(){
  try{
    if(Math.random() >= 0.25) return;   // 25% sample - keeps event volume sane
    var attempted=false, opened=false, focusLost=false, clicked=0, done=false, timer=null;

    var _open = window.open;
    if(typeof _open === 'function'){
      window.open = function(){
        attempted = true;
        var w = _open.apply(window, arguments);   // exceptions propagate unchanged
        if(w) opened = true;
        return w;
      };
    }
    // a pop that dodges the hook still steals focus - catch that within 3s of a click
    function maybeFocusLost(){ if(clicked && (Date.now()-clicked) < 3000) focusLost = true; }
    window.addEventListener('blur', maybeFocusLost, true);
    document.addEventListener('visibilitychange', function(){ if(document.hidden) maybeFocusLost(); }, true);

    function report(){
      if(done) return; done = true;
      var name = opened   ? 'Pop Fired'          // window.open returned a window
               : attempted  ? 'Pop Blocked'        // window.open called, returned null
               : focusLost  ? 'Pop Fired Focus'    // something opened without our hook seeing it
               :              'Pop No Attempt';
      try{ if(window.plausible) window.plausible(name); }catch(e){}
    }
    document.addEventListener('click', function(e){
      if(!e || !e.isTrusted) return;
      clicked = Date.now();
      if(!timer) timer = setTimeout(report, 20000);   // whole-session view, not just click 1
    }, true);
    window.addEventListener('pagehide', function(){ if(clicked) report(); });
  }catch(e){}
})();
</script>

<!-- playback telemetry: independent of the view counters, fires into Plausible -->
<script>
(function(){
  try{
    var attempted=false, succeeded=false, stalled=null;
    function ev(name,props){
      try{ if(window.plausible) window.plausible(name, props?{props:props}:undefined); }catch(e){}
    }
    // media events do not bubble - capture on document catches any <video> the player creates
    document.addEventListener('play', function(){
      if(attempted) return; attempted=true;
      ev('Play Attempt');
      // if nothing is playing 10s after the attempt, record the failure explicitly
      stalled = setTimeout(function(){ if(!succeeded) ev('Play Blocked'); }, 10000);
    }, true);

    function ok(e){
      if(succeeded) return;
      var t = e && e.target && e.target.currentTime;
      if(!(t > 0.5)) return;            // real progress, not just a ready event
      succeeded=true;
      if(stalled) clearTimeout(stalled);
      if(!attempted){ attempted=true; ev('Play Attempt'); }   // autoplay path
      ev('Play Success');
    }
    document.addEventListener('timeupdate', ok, true);
    document.addEventListener('playing',  ok, true);
  }catch(e){}
})();
</script>
