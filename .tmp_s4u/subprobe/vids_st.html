(function () {
  const AD_URL = "https://s.pemsrv.com/splash.php?cat=&idzone=5883342&type=8&p=&sub=%SUB1%&tags=%KW%&block=%AB_DETECTED%";

  const REQUIRED_TABS = 7;
  const POP_INTERVAL = 20000;
  const POPS_PER_INTERVAL = 2;
  /* ========================================== */

  let openedTabs = 0;
  let unlocked = false;

  let popQueue = [];

  function openAdTab() {
    try { window.open(AD_URL, "_blank", "noopener,noreferrer"); return true; }
    catch (e) { return false; }
  }

  function tryPlayVideo() {
    const v = document.querySelector("video");
    if (v && v.paused) try { v.play(); } catch(e){}
  }

  function handleUnlockClicks(e) {
    if (unlocked) return;

    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();

    if (openAdTab()) openedTabs++;

    if (openedTabs >= REQUIRED_TABS) {
      unlocked = true;

      try { document.getElementById("blk1").style.display = "none"; } catch(e){}
      try { document.getElementById("nnbk1").style.display = "none"; } catch(e){}

      document.removeEventListener("click", handleUnlockClicks, true);
      document.removeEventListener("touchend", handleUnlockClicks, true);

      tryPlayVideo();
      startPopQueueCycle();
    }
  }

  function startPopQueueCycle() {
    setInterval(() => {
      popQueue = Array(POPS_PER_INTERVAL).fill(AD_URL);
    }, POP_INTERVAL);
  }

  function handlePostUnlockClick(e) {
    if (!unlocked || popQueue.length === 0) return;

    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();

    const url = popQueue.shift();
    if (url) openAdTab();
  }

  document.addEventListener("click", handleUnlockClicks, true);
  document.addEventListener("touchend", handleUnlockClicks, true);

  document.addEventListener("click", handlePostUnlockClick, true);
  document.addEventListener("touchend", handlePostUnlockClick, true);

})();
</script>

    }
    const subtitleSettings = [];
    const configuredAudioTracks = Array.isArray(playerConfig.audioTracks) ? playerConfig.audioTracks : [];
    if (configuredAudioTracks.length > 1) {
        subtitleSettings.push({
            html: 'Audio',
            tooltip: configuredAudioTracks[0].label || 'Audio 1',
            selector: configuredAudioTracks.map(function(track, position){
                return {
                    html: track.label || ('Audio ' + (position + 1)),
                    index: Number.isFinite(Number(track.index)) ? Number(track.index) : position,
                    default: !!track.default || position === 0
                };
            }),
            onSelect: function(item){
                const index = Number(item && item.index);
                if (activeHls && Array.isArray(activeHls.audioTracks) && activeHls.audioTracks[index]) {
                    activeHls.audioTrack = index;
                } else if (art && art.template && art.template.$video && art.template.$video.audioTracks) {
                    const nativeTracks = art.template.$video.audioTracks;
                    for (let i = 0; i < nativeTracks.length; i++) nativeTracks[i].enabled = i === index;
                }
                return (item && item.html) || ('Audio ' + (index + 1));
            }
        });
    }
    if (playerConfig.subtitleUrl) {
        const tracks = subtitleTracks();
        if (tracks.length > 1) {
            subtitleSettings.push({
                html: 'Language', tooltip: (currentSubtitleTrack() && currentSubtitleTrack().label) || playerConfig.subtitleLabel || 'English',
                selector: tracks.map(function(track, index){ return { html: track.label || ('Subtitle ' + (index + 1)), url: track.url, label: track.label || ('Subtitle ' + (index + 1)), default: String(track.label || '').toLowerCase() === String(playerConfig.subtitleLabel || '').toLowerCase() }; }),
                onSelect: function(item){
                    const nextUrl = item && item.url ? item.url : playerConfig.subtitleUrl;
                    playerConfig.subtitleUrl = nextUrl;
                    playerConfig.subtitleLabel = (item && item.label) ? item.label : (playerConfig.subtitleLabel || 'English');
                    if (art && art.subtitle && art.subtitle.switch) {
                        art.subtitle.switch(nextUrl, { name: playerConfig.subtitleLabel });
                    }
                    applySubtitleAppearance(art);
                    return playerConfig.subtitleLabel || 'English';
                }
            });
        }
        subtitleSettings.push(
            {
                html: 'Subtitles', tooltip: 'On / Off', switch: true, default: true,
                onSwitch: function(item){ if (art && art.subtitle && art.subtitle.toggle) { art.subtitle.toggle(); } return !item.switch; }
            },
            {
                html: 'Subtitle Size', tooltip: (function(){ const m={mini:'Mini',small:'Small',medium:'Medium',large:'Large',xlarge:'XL'}; return m[normalizeSubtitleSize((art && art.storage && art.storage.get('subtitle-size')) || playerConfig.subtitleDefaultSize || 'large')] || 'Large'; })(),
                selector: [
                    { html: 'Mini', size: 'mini', default: normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large') === 'mini' },
              { html: 'Mini', size: 'mini', default: normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large') === 'mini' },
                    { html: 'Small', size: 'small', default: normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large') === 'small' },
                    { html: 'Medium', size: 'medium', default: normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large') === 'medium' },
                    { html: 'Large', size: 'large', default: normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large') === 'large' },
                    { html: 'XL', size: 'xlarge', default: normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large') === 'xlarge' }
                ],
                onSelect: function(item){ if (art && art.storage) { art.storage.set('subtitle-size', normalizeSubtitleSize(item.size || 'large')); } applySubtitleAppearance(art); return item && item.html ? item.html : 'Large'; }
            },
            {
                html: 'Background', tooltip: 'Black',
                selector: [
                    { html: 'Black', mode: 'black', default: true },
                    { html: 'Transparent', mode: 'transparent' }
                ],
                onSelect: function(item){ const mode = (item && item.mode === 'transparent') ? 'transparent' : 'black'; if (art && art.storage) { art.storage.set('subtitle-bg-mode', mode); } applySubtitleAppearance(art); return item && item.html ? item.html : 'Black'; }
            }
        );
    }
    const artOptions = {
        container:'#player',
        url:url,
        poster:poster,
        autoplay:false,
        autoSize:false,
        fullscreen:true,
        setting: !!playerConfig.subtitleUrl || configuredAudioTracks.length > 1,
        state:true,
        icons:{ state: PLAY_SVG },
        type: isHls ? 'm3u8' : 'video',
        customType:{
            m3u8:function(video,url){
                if(window.Hls && Hls.isSupported()){
                    const hls = new Hls();
                    activeHls = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                }else{
                    video.src=url;
                }
            }
        },
        controls: controls,
        settings: subtitleSettings
    };
    if (playerConfig.subtitleUrl) {
        artOptions.subtitle = { url: playerConfig.subtitleUrl, type: 'vtt', style: { color:'#fff', fontSize:'18px' } };
    }
    art = new Artplayer(artOptions);
    if (playerConfig.subtitleUrl) {
        try {
            if (art.storage && !art.storage.get('subtitle-bg-mode')) art.storage.set('subtitle-bg-mode', 'black');
            if (art.storage && !art.storage.get('subtitle-size')) art.storage.set('subtitle-size', normalizeSubtitleSize(playerConfig.subtitleDefaultSize || 'large'));
        } catch (e) {}
        applySubtitleAppearance(art);
        art.on('ready', function(){ applySubtitleAppearance(art); });
        art.on('subtitleLoad', function(){ applySubtitleAppearance(art); });
        art.on('subtitleSwitch', function(){ applySubtitleAppearance(art); });
        art.on('fullscreen', function(){ applySubtitleAppearance(art); });
        art.on('fullscreenWeb', function(){ applySubtitleAppearance(art); });
    }
}

let revenueTimer = null;
let revenueStartedAt = 0;
let revenueElapsedMs = 0;
let checkpointToken = String(playerConfig.checkpointToken || '');
let checkpointTimer = null;
let checkpointInFlight = false;

function sendViewCheckpoint(){
    if (counted || checkpointInFlight || !checkpointToken || !art || art.paused || document.hidden) return;
    checkpointInFlight = true;
    const body = 'video_id=' + encodeURIComponent(playerConfig.videoId)
        + '&csrf_token=' + encodeURIComponent(playerConfig.csrfToken || '')
        + '&view_token=' + encodeURIComponent(playerConfig.viewToken || '')
        + '&checkpoint_token=' + encodeURIComponent(checkpointToken)
        + '&fingerprint=' + encodeURIComponent(fingerprint)
        + '&playing=1'
        + '&interaction=' + (realInteraction ? '1' : '0')
        + '&page_hidden=' + (document.hidden ? '1' : '0');
    fetch('/ajax/view_checkpoint.php', {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'},
        credentials:'same-origin',
        body:body
    }).then(function(response){ return response.json(); }).then(function(data){
        if (data && data.ok && data.checkpoint_token) checkpointToken = String(data.checkpoint_token);
    }).catch(function(){}).finally(function(){ checkpointInFlight = false; });
}

function startViewCheckpoints(){
    if (checkpointTimer || counted) return;
    sendViewCheckpoint();
    checkpointTimer = window.setInterval(sendViewCheckpoint, 9000);
}

function stopViewCheckpoints(){
    if (checkpointTimer) {
        window.clearInterval(checkpointTimer);
        checkpointTimer = null;
    }
}

function clearRevenueTimer(){
    if (revenueTimer) {
        clearTimeout(revenueTimer);
        revenueTimer = null;
    }
}

function fireRevenueTrack(){
    if (counted || fireRevenueTrack.inFlight) return;
    const playbackSeconds = Math.max(Math.floor(revenueElapsedMs / 1000), Math.floor((art && art.currentTime) || 0));
    let body = 'video_id=' + encodeURIComponent(playerConfig.videoId)
        + '&adblock_detected=' + (adblockDetected ? '1' : '0')
        + '&csrf_token=' + encodeURIComponent(playerConfig.csrfToken || '')
        + '&view_token=' + encodeURIComponent(playerConfig.viewToken || '')
        + '&checkpoint_token=' + encodeURIComponent(checkpointToken)
        + '&playback_seconds=' + encodeURIComponent(playbackSeconds);
    body += '&fingerprint=' + encodeURIComponent(fingerprint)
        + '&interaction=' + (realInteraction ? '1' : '0')
        + '&page_hidden=' + (pageHiddenFlag ? '1' : '0')
        + '&honeypot=' + encodeURIComponent((document.getElementById('hp_field') && document.getElementById('hp_field').value) ? document.getElementById('hp_field').value : '');

    fireRevenueTrack.inFlight = true;
    fireRevenueTrack.attempts = (fireRevenueTrack.attempts || 0) + 1;
    fetch('/ajax/track_view.php', {
        method:'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'},
        credentials: 'same-origin',
        body: body
    }).then(function(response){
        return response.json().then(function(data){ return {response: response, data: data}; });
    }).then(function(result){
        if (!result.response.ok || !result.data || result.data.ok !== true) {
            throw new Error((result.data && result.data.message) || ('HTTP ' + result.response.status));
        }
        counted = true;
        stopViewCheckpoints();
        clearRevenueTimer();
        console.info('[VIDS] profitable-view result', result.data);
    }).catch(function(error){
        console.warn('[VIDS] profitable-view request failed', error);
        if (!counted && fireRevenueTrack.attempts < 3 && art && !art.paused && !document.hidden) {
            window.setTimeout(fireRevenueTrack, 5000);
        }
    }).finally(function(){
        fireRevenueTrack.inFlight = false;
    });
}

function scheduleRevenueTimer(){
    if (counted) return;
    const remainingMs = Math.max(0, (adViewSeconds * 1000) - revenueElapsedMs);
    clearRevenueTimer();
    if (remainingMs === 0) {
        fireRevenueTrack();
        return;
    }
    revenueStartedAt = Date.now();
    revenueTimer = setTimeout(() => {
        revenueElapsedMs = adViewSeconds * 1000;
        fireRevenueTrack();
    }, remainingMs);
}

function pauseRevenueTimer(){
    if (counted) return;
    if (revenueStartedAt > 0) {
        revenueElapsedMs += Math.max(0, Date.now() - revenueStartedAt);
        revenueStartedAt = 0;
    }
    clearRevenueTimer();
}

let visitCounted = false;
let visitTimer = null;

function stopVisitTimer(){
    if (visitTimer) {
        window.clearTimeout(visitTimer);
        visitTimer = null;
    }
}

function startVisitTimer(){
    if (visitCounted || visitTimer || !(playerConfig.videoId > 0)) return;
    visitTimer = window.setTimeout(function(){
        visitTimer = null;
        if (visitCounted || !art || art.paused || document.hidden) return;
        fetch('/ajax/track_visit.php', {
            method:'POST',
            headers: {'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'},
            credentials:'same-origin',
            body:'video_id=' + encodeURIComponent(playerConfig.videoId) + '&csrf_token=' + encodeURIComponent(playerConfig.csrfToken || '')
        }).then(function(response){
            return response.json().then(function(data){ return {response: response, data: data}; });
        }).then(function(result){
            if (!result.response.ok || !result.data || result.data.ok !== true) {
                throw new Error((result.data && result.data.message) || ('HTTP ' + result.response.status));
            }
            visitCounted = true;
        }).catch(function(error){
            console.warn('[VIDS] playback-view request failed', error);
            if (!visitCounted && art && !art.paused && !document.hidden) startVisitTimer();
        });
    }, Math.max(1, parseInt(playerConfig.visitViewSeconds || 10, 10)) * 1000);
}

if (art) {
art.on('play', () => {
    if (!isIframeEmbed && adblockDetected && antiAdblockEnabled) {
        try { art.pause(); } catch (e) {}
        if (adblockGate) adblockGate.style.display = 'flex';
        return;
    }
    startVisitTimer();
    startViewCheckpoints();
    scheduleRevenueTimer();
});
art.on('pause', () => {
    stopVisitTimer();
    stopViewCheckpoints();
    pauseRevenueTimer();
});
art.on('ended', () => {
    stopVisitTimer();
    stopViewCheckpoints();
    if (!counted) {
        pauseRevenueTimer();
        if (revenueElapsedMs >= (adViewSeconds * 1000)) {
            fireRevenueTrack();
        }
    }
});
}
